// ================================================================
// KASA — GATED PARTS (DESIGN-003)
// ----------------------------------------------------------------
// The single place that says which parts are hidden behind which
// fuel. Read by KASAPartGate.cs. One node per (fuel, category) pair,
// because the category is what gets restored when the part is
// revealed:
//
//   KASA_PART_GATE
//   {
//       fuel     = PrismaticGel
//       category = Propulsion
//       part     = kasa_gel_terrier
//       part     = kasa_gel_poodle
//   }
//
// FUEL NAMES must match the resource names in KASA_Resources.cfg:
//   PrismaticGel, DenseOxidiser, ThermicMix, Aetherium
//
// CATEGORY is a stock PartCategories value. The ones we need:
//   Propulsion   engines
//   FuelTank     tanks
//
// UNLOCK GATES (see DESIGN-003 doc):
//   PrismaticGel   <- KSP_04_MinmusCrewed   (Glassmonite, Minmus)
//   DenseOxidiser  <- OP_06_Base            (Kerium, Ike)
//   ThermicMix     <- IP_03_Crewed          (Moherium, Moho)
//   Aetherium      <- OP_16_Crewed          (Elysium, Eeloo)
//
// Revealing makes a part VISIBLE only — it still has to be purchased
// in R&D, so every gated part needs a real TechRequired node.
//
// CONFIG-001: always full block syntax, never one-liner nodes.
// ================================================================


// ----------------------------------------------------------------
// STEP 1 TEST ENTRY — remove once real parts exist
// ----------------------------------------------------------------
// Wires the hiding-spike part to a fake fuel so the whole chain
// (behaviour -> scenario flag -> part gate) can be tested before any
// real fuel parts are built.
//
// TO TEST:
//   1. Install this plus KASA_HideSpike.cfg. Load a career save.
//   2. VAB: the spike part should be HIDDEN (the gate hides it,
//      because "KASATestFuel" is not in UnlockedFuels).
//   3. Add the BEHAVIOUR below to any short contract, complete it,
//      and the part should appear:
//
//        BEHAVIOUR
//        {
//            name = UnlockTestFuel
//            type = KASAFuelUnlocked
//            fuel = KASATestFuel
//        }
//
//   4. Check the log for:
//        [KASA] Fuel unlocked: KASATestFuel - revealing its parts.
//        [KASA] Part gate: revealed 1 part(s) for KASATestFuel.
//   5. Reload the save — the part must STAY visible (the flag is
//      persisted in FUEL_UNLOCK).
// ----------------------------------------------------------------

KASA_PART_GATE
{
    fuel     = KASATestFuel
    category = FuelTank
    part     = kasaSpikeTank
}


