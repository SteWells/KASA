// ================================================================
// KASA — AETHERIUM ENGINE MODES
// ================================================================
// The endgame propellant, refined from Elysium mined on Eeloo.
// Aetherium is the reward for the longest journey in the game:
// 5000s vacuum Isp, versus Prismatic Gel's 3500s.
//
// Mechanism: MultiModeEngine (stock class name -- NOT
// "ModuleMultiModeEngine", which does not exist).
//   * mode 1 "Conventional" = the engine's stock propellant (untouched)
//   * mode 2 "Aetherium"    = pure Aetherium, 5000s vac Isp
//
// MultiModeEngine supports exactly TWO modes, so Aetherium uses a
// DIFFERENT curated engine set from Prismatic Gel (see DESIGN-004).
// Gel set:       Terrier, Poodle, Nerv, Wolfhound, Rhino, Dawn
// Aetherium set: Spark, Cub, Cheetah, Skiff
//
// maxThrust = each engine's STOCK VACUUM THRUST, because burn duration
// ~= (mass x dV) / thrust and is independent of Isp. (NOTE-002)
//
// VACUUM-ONLY by design: 5000s vac / 350s sea level, so it will not
// lift anything off Kerbin. Intended, not a bug. (NOTE-001)
//
// >>> Thrust figures are stock-vacuum values from memory -- verify in
// >>> the VAB against each engine's stock mode and correct if needed.
// >>> No plume FX on the Aetherium mode yet.
// ================================================================


@PART[liquidEngineMini_v2]:FOR[KASA]      // 48-7S "Spark"
{
    @MODULE[ModuleEnginesFX] { %engineID = Conventional }

    MODULE
    {
        name      = ModuleEnginesFX
        engineID  = Aetherium
        thrustVectorTransformName = thrustTransform
        exhaustDamage   = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 20
        heatProduction = 60
        EngineType = Generic
        PROPELLANT
        {
            name = Aetherium
            ratio = 1.0
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 5000
            key = 1 350
            key = 3 0.001
        }
    }

    MODULE
    {
        name              = MultiModeEngine
        primaryEngineID   = Conventional
        secondaryEngineID = Aetherium
        primaryEngineModeDisplayName   = Conventional
        secondaryEngineModeDisplayName = Aetherium
        autoSwitch = false
    }
}

