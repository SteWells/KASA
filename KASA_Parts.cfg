// ================================================================
// KASA — Part Patches
// ================================================================
// Requires B9PartSwitch.
//   * Tanks     -> B9 switch, all KASA resources selectable. (Names
//                  visible; the discovery gate lives on the drills.)
//                  Includes Consumables, the bought Kerbin-supplied
//                  half of the in-situ ship-build recipe.
//   * Drills    -> a harvester per KASA raw resource; the plugin hides
//                  the ones whose resource hasn't been scanned yet.
// ================================================================


