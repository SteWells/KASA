// ----------------------------------------------------------------
// HOLDING TANKS -> switchable KASA storage (stock + ReStock+).
// Ore is the default; every KASA resource is freely selectable.
// ----------------------------------------------------------------
@PART[RadialOreTank|SmallTank|LargeTank|restock-oretank-1875-1|restock-oretank-375-1]:NEEDS[B9PartSwitch]:AFTER[KASA]
{
    MODULE
    {
        name                = ModuleB9PartSwitch
        moduleID            = kasaStorage
        switcherDescription = Contents
        switchInFlight      = true
        baseVolume          = #$/RESOURCE[Ore]/maxAmount$
        SUBTYPE
        {
            name     = Ore
            tankType = KASA_Ore
            defaultSubtypePriority = 10
        }
        SUBTYPE
        {
            name     = Regocite
            tankType = KASA_Regocite
        }
        SUBTYPE
        {
            name     = Glassmonite
            tankType = KASA_Glassmonite
        }
        SUBTYPE
        {
            name     = Kerium
            tankType = KASA_Kerium
        }
        SUBTYPE
        {
            name     = Moherium
            tankType = KASA_Moherium
        }
        SUBTYPE
        {
            name     = Ferrosite
            tankType = KASA_Ferrosite
        }
        SUBTYPE
        {
            name     = Evonite
            tankType = KASA_Evonite
        }
        SUBTYPE
        {
            name     = Laythite
            tankType = KASA_Laythite
        }
        SUBTYPE
        {
            name     = Elysium
            tankType = KASA_Elysium
        }
        SUBTYPE
        {
            name     = Prismatic Gel
            tankType = KASA_PrismaticGel
        }
        SUBTYPE
        {
            name     = Heavy Blend
            tankType = KASA_HeavyBlend
        }
        SUBTYPE
        {
            name     = Thermic Mix
            tankType = KASA_ThermicMix
        }
        SUBTYPE
        {
            name     = Consumables
            tankType = KASA_Consumables
        }
        SUBTYPE
        {
            name     = LiquidFuel
            tankType = KASA_LiquidFuel
        }
        SUBTYPE
        {
            name     = Oxidizer
            tankType = KASA_Oxidizer
        }
        SUBTYPE
        {
            name     = LFO
            tankType = KASA_LFO
        }
    }
    MODULE
    {
        name = KASACargoTank
    }
    !RESOURCE[Ore] {}
}


// ----------------------------------------------------------------
// DRILLS -> a harvester per KASA raw resource. The plugin hides the
// ones whose resource hasn't been scanned yet. Stock Ore intact.
// ----------------------------------------------------------------
@PART[RadialDrill|MiniDrill]:AFTER[KASA]
{
    MODULE
    {
        name                     = ModuleResourceHarvester
        HarvesterType            = 0
        Efficiency               = 1.0
        ResourceName             = Regocite
        ConverterName            = Regocite Drill
        StartActionName          = Start Regocite Drill
        StopActionName           = Stop Regocite Drill
        ToggleActionName         = Toggle Regocite Drill
        AutoShutdown             = true
        GeneratesHeat            = false
        UseSpecialistBonus       = true
        SpecialistEfficiencyFactor = 0.2
        SpecialistBonusBase      = 0.05
        Specialty                = Engineer
        EfficiencyBonus          = 1
        ImpactTransform          = ImpactTransform
        ImpactRange              = 5
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 15
        }
