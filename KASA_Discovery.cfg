// ================================================================
// KASA — Body Discovery Configuration
// ================================================================
// Defines which bodies are known at the start of a new career,
// plus orbital data for the Sentinel detection weighting system
// and moon/parent relationships.
//
// sma values are approximate semi-major axes in metres (stock KSP).
// These weight the Sentinel detection timers — closer bodies
// transit more frequently and are detected sooner.
//
// moonOf defines which planet a moon belongs to, used by the
// moon discovery timer system when a probe enters a planet's SOI.
// ================================================================

KASA_DISCOVERY
{
    knownBody = Sun
    knownBody = Kerbin

    // ---- Planet orbital data (SMA in metres) ----
    PLANET_DATA
    {
        name = Moho
        sma  = 5263138304
    }
