// ================================================================
// KASA — PART HIDING SPIKE  (THROWAWAY — DELETE AFTER TESTING)
// ----------------------------------------------------------------
// PURPOSE
// Answer one question before committing ~15-20h to DESIGN-003:
//   can a part be TRULY hidden from R&D and the VAB, and then made
//   visible at runtime by the plugin, without a scene reload?
//
// If the answer is no, Option 3 (dedicated Gel parts) loses most of
// its value and we stay with the curated-subtype middle ground.
//
// WHAT THIS MAKES
// A clone of the FL-T100 called "kasaSpikeTank", titled so it is
// impossible to miss in a parts list. It is deliberately:
//   * TechRequired = start   -> tech gating is NOT the variable
//   * entryCost / cost = 0   -> purchasing is NOT the variable
//   * TechHidden = True      -> the thing under test (R&D)
//   * category = none        -> the thing under test (VAB)
// so the ONLY reason it should be invisible is the hiding itself.
//
// HOW TO TEST — see KASAPartHideSpike.cs for the keybinds.
//
// NOTE: uses +PART (copy), so the stock FL-T100 is untouched.
// Deleting this file removes the part completely.
// ================================================================

+PART[fuelTankSmallFlat]:FOR[KASA]
{
    @name         = kasaSpikeTank
    @title        = ZZZ KASA SPIKE — Hidden Part Test
    @manufacturer = KASA Test Article
    @description  = Throwaway part for the DESIGN-003 hiding spike. If you can see this in the VAB parts list without pressing the unhide key, the part is NOT properly hidden. Delete KASA_HideSpike.cfg when the test is done.

    // --- isolate the variable: always unlocked, always free ---
    @TechRequired = start
    @entryCost    = 0
    @cost         = 0

    // --- the thing under test ---
    %TechHidden   = True
    %category     = none

    // keep it obvious in any list that does show it
    @tags = kasaspike hidden test
}
