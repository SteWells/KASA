// ================================================================
// KASA — Science Experiment Definitions
// ================================================================
// Custom science results for the KASA telescope instruments,
// written to tie into the story arc.
//
// The scopeScan experiment (KOP-1 Seeker) is the key one —
// its results progress from "we can see something" to "we can
// see it clearly" as the player moves through different situations.
//
// These definitions patch the DMagic scopeScan experiment with
// KASA-flavoured result text.
// ================================================================

EXPERIMENT_DEFINITION
{
    id = kasaOpticalSurvey
    title = KOP-1 "Seeker" Optical Survey
    baseValue = 12
    scienceCap = 12
    dataScale = 1
    requireAtmosphere = False
    situationMask = 16
    biomeMask = 0

    RESULTS
    {
        // In space low around Kerbin
        InSpaceLow = The Seeker's optics are steady above the atmosphere. The first images are striking — Kerbin fills the lower frame, blue and white and impossibly vivid. But Wernher is not interested in Kerbin. He is pointing the instrument at a specific bearing, waiting for something to cross the field of view. Several passes complete before he says anything. When he does, it is quiet, almost to himself: "There you are."
        InSpaceLowRecovered = The physical data card from the Seeker has been recovered and processed. The resolution is better than the transmitted version. There is a small disc in several frames — moving against the stellar background. Consistent velocity. Consistent bearing. An orbit, calculated from the images, that matches the GRAVMAX perturbations exactly. Object A is real, and we have photographed it.

        // In space high around Kerbin
        InSpaceHigh = From high orbit, the Seeker has a cleaner view of the sky — less background noise, more stable pointing. The survey sweep covers the full celestial sphere over two orbits. The results contain a surprise: not one faint moving disc but two. The second is fainter, higher, moving at a different rate. Both are there. Both are real. Wernher has been staring at this image for forty minutes.
        InSpaceHighRecovered = The high-orbit imagery shows both objects clearly — Object A bright and distinct, Object B fainter but unmistakeable against the stellar background. Wernher has measured their angular sizes. They are not small. Object A is a world. Object B, he says, is a world too. He has written their estimated diameters on a notepad and stuck it to the mission board. Someone has already written names underneath: Mun. Minmus.

        // In space low around Mun
        InSpaceLowMun = The Seeker was not designed for this. But in low Mun orbit, with no atmosphere and perfect darkness, the optics are extraordinary. The surface fills the frame — craters, rilles, the sweep of ancient lava plains that someone on the ground has already named the Farside Basin. And in one pass, crossing the terminator into the sunlit hemisphere, something catches the auto-tracking algorithm. A feature that does not match the surrounding geology. Too regular. Too vertical. The telescope flags it. Wernher names the flag POTENTIAL_ANOMALY_1.
        InSpaceLowMunRecovered = Physical recovery of the Mun survey imagery reveals the flagged feature in extraordinary detail. It is not a geological formation. It is not impact debris. It is a single vertical structure, smooth-sided, casting a precise shadow. The length of the shadow, measured against the surrounding terrain, gives a height of approximately twelve metres. The same height as TMA-0 north of the KSC.

        // In space high around Mun
        InSpaceHighMun = Wide-field sweep of the Mun from high orbit. The whole near-side disc is mapped in a single pass. Several features are flagged as anomalous by the onboard algorithm — crater chains too regular, a basin with unusually reflective material at the centre. Most can be explained geologically. The flagged structure in the near-side highlands cannot.
        InSpaceHighMunRecovered = The high-orbit survey map of the Mun is complete. Mission planning now has a full picture of the near-side terrain. The flagged anomaly in the highlands is confirmed. Someone from the anomaly team has written on the printout: TMA-5. Someone else has added a question mark.

        // In space low around Minmus
        InSpaceLowMinmus = The flat seas of Minmus are unlike anything in the Kerbin system. From low orbit, the Seeker resolves them as vast crystalline plains — almost perfectly flat, reflecting sunlight like mirrors. The material is unlike any geological deposit in our database. Wernher is describing it as a naturally occurring crystal silicate of extraordinary purity. He has a name already: Glassmonite. He wants a sample.
        InSpaceLowMinmusRecovered = The physical survey imagery of Minmus confirms everything the transmitted data suggested. The flat seas cover approximately 30% of the surface and appear to be composed of a single mineral phase — the Glassmonite that Wernher identified. There is also a single anomalous feature in the Greater Flats: a vertical structure, same proportions as TMA-0, casting the same clean shadow. TMA-Minmus is logged. The signal network is larger than anyone expected.

        // Kerbol space
        InSpaceLowSun = The Seeker was never designed for solar observation, but from high Kerbin orbit it has an unobstructed view of Kerbol. The data is sparse — the instrument's optical filters were not optimised for this — but the background starfield is crystal clear, and the tracking algorithm has flagged seven objects moving against it. Not all of them are in the Kerbin system. Some are much, much further away.
        InSpaceHighSun = Wide-field solar system survey from high orbit. The tracking algorithm has identified positional shifts in background stars consistent with nearby moving objects. Two are the Mun and Minmus, already confirmed. The others are at greater distances — their proper motions consistent with orbits well beyond Kerbin's sphere of influence. Wernher has the Farreach. He is already pointing it.

        default = The Seeker's optical survey has been completed. The data has been transmitted to KASA ground control for analysis.
    }
}

// SCANsat visual experiment descriptions
// These patch the SCANsatVisual experiment that both VS-1 and VS-3 use
EXPERIMENT_DEFINITION:NEEDS[SCANsat]
{
    id = SCANsatVisual
    title = Visual Surface Survey
    baseValue = 8
    scienceCap = 8
    dataScale = 1
    requireAtmosphere = False
    situationMask = 16
    biomeMask = 0

    RESULTS
    {
        InSpaceLow = The visual imager is returning surface data. From low orbit the resolution is sufficient to map terrain at the scale needed for mission planning — individual craters, ridgelines, valley floors. The ground team is already overlaying the imagery with elevation data to build three-dimensional landing approach profiles.
        InSpaceHigh = Wide-area visual survey from high orbit. The coverage rate is good — the imager is sweeping large portions of the surface with each pass. The overall terrain picture is coming together. There are several features that mission planning has flagged for closer investigation on future low-orbit passes.

        InSpaceLowMun = The Watcher is imaging the Mun surface at mapping resolution. The detail is sufficient to characterise landing zone safety — rock density, slope angle, surface texture. Several candidate landing zones have been identified in the flatter mare regions. One flagged feature in the highlands does not match the surrounding geology. The anomaly team has been notified.
        InSpaceHighMun = High-altitude Mun survey. The near-side is being mapped systematically. Coverage is building. Ground team estimates full near-side coverage within the current survey window. The broad strokes of the Mun's terrain are now well understood — the details will come with lower orbit passes.

        InSpaceLowMinmus = The Watcher is mapping Minmus from low orbit. The flat seas are extraordinary under optical survey — the crystal surface reflects the imaging wavelengths almost perfectly, making the Glassmonite flats the brightest features on the entire surface. Wernher is delighted with the imagery. He says it confirms everything the orbital spectroscopy suggested. He wants a sample even more now.
        InSpaceHighMinmus = Minmus wide-area survey complete for this pass. The unusual surface composition is clearly visible even from high altitude — the flat seas are spectrally distinct from the highland terrain. Coverage is building. The surface is smaller than the Mun and maps faster.

        default = Visual surface survey data has been collected and transmitted to KASA for analysis.
    }
}


// ----------------------------------------------------------------
// kasaVisualSurvey — KVS-1 Watcher
// ----------------------------------------------------------------
EXPERIMENT_DEFINITION
{
    id = kasaVisualSurvey
    title = KVS-1 Visual Survey
    baseValue = 8
    scienceCap = 8
    dataScale  = 1
    requireAtmosphere = False
    situationMask = 16
    biomeMask     = 0

    RESULTS
    {
        InSpaceLow    = The Watcher's imager is sweeping the surface systematically from low orbit. The resolution is considerably better than anything the Seeker produced — individual terrain features are clearly resolved. Landing zone candidates are being flagged in real time. The ground team is already building approach profiles.
        InSpaceHigh   = Wide-field survey from high orbit. The Watcher covers large areas quickly at this altitude, building up an overview map of the surface geometry. The ground team will use this to prioritise where to focus the lower-orbit detailed passes.

        InSpaceLowMun    = The Watcher is imaging the Mun's near-side surface at mapping resolution from low orbit. Crater morphology, ridge profiles, flat mare expanses — all clearly resolved. Several features have been flagged for follow-up. One of them is in the highlands, isolated, regular, and completely inconsistent with the surrounding geology.
        InSpaceHighMun   = High-altitude Mun survey. The near-side is being mapped systematically pass by pass. Coverage is building well. The Watcher's wide-field optics are efficient at this altitude — a complete near-side map within the current survey window is achievable.

        InSpaceLowMinmus    = Minmus from low orbit in the Watcher. The crystalline flat seas are extraordinary — they reflect the imaging wavelengths so cleanly that the detector nearly saturates on the first pass. Wernher is looking at the same frames for the third time. He has written something on a notepad and turned it face-down on his desk.
        InSpaceHighMinmus   = Wide-area Minmus survey. The contrast between the crystal flats and the highland terrain is dramatic in the imagery. Coverage is accumulating. Whatever is in the Greater Flats will be clearly imaged before the survey window closes.

        default = KVS-1 visual survey data collected and transmitted to KASA ground control.
    }
}

// ----------------------------------------------------------------
// kasaMagneticSurvey — KMF-1 Harbinger
// ----------------------------------------------------------------
EXPERIMENT_DEFINITION
{
    id = kasaMagneticSurvey
    title = KMF-1 "Harbinger" Magnetic Survey
    baseValue = 10
    scienceCap = 10
    dataScale  = 1
    requireAtmosphere = False
    situationMask = 49
    biomeMask     = 1

    RESULTS
    {
        // Landed on Kerbin — biome-sensitive
        Landed                   = Surface magnetic field baseline established. The readings are consistent with what the textbooks describe — a rotating iron-rich core generating a dipole field that deflects the solar wind. Perfectly ordinary. Except: one reading, taken during a pass over the northern grasslands, is approximately 0.3% higher than the surrounding baseline. Wernher says it is within instrument noise. Nobody believes him.
        KSCLanded                = Magnetic field reading at the KSC. The launch complex generates some interference, but the instrument filters it cleanly. The underlying field strength is normal. The anomaly processing flag is not set. This is a clean measurement. Which makes it all the more puzzling that it was set on the last pass — over the grassland twelve kilometres north of here.
        LaunchpadLanded          = Field reading at the launchpad. Minor electromagnetic interference from launch infrastructure. Instrument filters it out. Baseline normal.
        RunwayLanded             = Runway measurement. Clean reading. No anomalous signal at this location.
        GrasslandsLanded         = The grasslands reading. This is the one. 0.3% above the surrounding baseline, consistent across multiple passes, not attributable to any known geological feature. The signal is faint. It is consistent. It comes from a specific location — the same coordinates every time. Wernher has marked it on the map. He has not told Mission Control yet.
        HighlandsLanded          = Highland surface magnetic reading. The subsurface geology here produces some variation from the lowland baseline, well within expected range for igneous terrain. Nothing anomalous in the highlands.
        ShoreLanded              = Shore measurement. The interface between continental crust and oceanic material produces a minor but textbook-normal magnetic gradient. Clean data.
        WaterLanded              = Ocean floor magnetic measurement. Normal oceanic crust field strength. No anomalies.
        DesertLanded             = Desert surface reading. Consistent with ancient sedimentary and aeolian deposits. Below the lowland baseline — expected for low-iron surface material. Clean.
        TundraLanded             = Tundra measurement. Normal. The instrument is functioning within spec. The interesting readings are elsewhere.
        IceLanded                = Ice cap measurement. The surface is predominantly water ice with minimal magnetic signature. The crustal reading beneath is weak but consistent. Nothing anomalous here.
        MountainsLanded          = Mountain range reading. Elevated iron content in the exposed igneous rock produces a slightly enhanced field. This is geology. This is the instrument working as designed. The anomaly north of KSC is not this.

        // In space low around Kerbin
        InSpaceLow               = The Harbinger is measuring the Kerbin magnetic field from low orbit. The dipole geometry is clean — the field lines map predictably from equatorial to polar regions. The instrument is also sensitive enough to detect anomalies on the surface below. Something in the northern grasslands, twelve kilometres from the KSC, is generating a faint electromagnetic signal. It is not geological. It has been there for every pass.
        InSpaceHighRecovered     = The physical data card from the low-orbit magnetic survey has been recovered. The processing team has run the surface anomaly signal through every filter available. It is not instrument noise. It is not a geological formation. The signal has a structured spectral profile — not random, not natural. Someone on the night shift has written "artificial?" in the margin of the printout and then crossed it out. The crossing-out is not convincing.

        // In space high around Kerbin
        InSpaceHigh              = Magnetic field survey from high orbit. The global field structure is clearly mapped — a clean dipole, tilted slightly from the rotation axis as expected. From this altitude the surface anomaly is only just detectable above the background, but it is there. The signal processing team has confirmed it in three independent analysis runs. Whatever is north of the KSC has a magnetic signature, and that signature is reaching us from two hundred kilometres up.
        InSpaceLowRecovered      = The high-orbit magnetic data has been recovered and processed. The global field model is complete. The surface anomaly is confirmed. Wernher has finally told Mission Control. Gene's response has not been shared with the wider team, but he was seen standing at the window of his office for a very long time afterwards, looking north.

        // In space low around the Mun
        InSpaceLowMun            = Magnetic field survey of the Mun from low orbit. The Mun has no global dipole field — the core is cool and static — but there are localised crustal anomalies, remnant magnetism frozen into ancient impact melt. The distribution is consistent with the Late Heavy Bombardment. All of it is geological. All of it, except one reading, in the near-side highlands, that the instrument flags as spectrally distinct from the surrounding crust. The flag sits there in the data. Wernher has not dismissed it.
        InSpaceHighMun           = High-orbit magnetic survey of the Mun. The global picture shows a magnetically quiet body with scattered crustal anomalies. One of them, in the near-side highlands, has a spectral profile that does not match any known rock type in the mineralogical database. The team has cross-referenced with the Gazer's visual flag for the same location. The coordinates match.

        // In space low around Minmus
        InSpaceLowMinmus         = Minmus magnetic field survey from low orbit. The body is magnetically very quiet — low iron content throughout, consistent with the unusual surface mineralogy. But the instrument detects something in the Greater Flats. A localised anomaly, deep in the crystal plains, that the spectral analysis cannot explain geologically. The Glassmonite itself is non-magnetic. Whatever is generating this signal is below the surface. Or above it.
        InSpaceHighMinmus        = Wide-area magnetic survey of Minmus. The body is largely magnetically inert, which makes the single anomaly in the Greater Flats all the more conspicuous. It stands out against the background like a lit room in a dark building. The coordinates have been forwarded to the anomaly team. They already knew.

        // Other bodies (generic fallback)
        default = Magnetic field survey data collected and transmitted to KASA ground control for analysis.
    }
}

// ----------------------------------------------------------------
// kasaVisualSurveyHR — KVS-3 Gazer
// ----------------------------------------------------------------
EXPERIMENT_DEFINITION
{
    id = kasaVisualSurveyHR
    title = KVS-3 High-Resolution Survey
    baseValue = 10
    scienceCap = 10
    dataScale  = 1
    requireAtmosphere = False
    situationMask = 16
    biomeMask     = 0

    RESULTS
    {
        InSpaceLow    = The Gazer is resolving surface features at a scale we have not seen before from orbit. Individual boulders. Vehicle tracks from old missions. And in several frames, structures — regular, geometric, impossible to explain as geology. Wernher is not surprised. He was expecting this. He says the monolith network is larger than any of us imagined.
        InSpaceHigh   = High-altitude survey with the Gazer. Even from high orbit the resolution is impressive — better than the Watcher's best low-orbit pass. Surface mapping is proceeding rapidly. The anomaly detection algorithm has flagged four sites for follow-up. Three are geological. One is not.

        InSpaceLowMun    = The Gazer is imaging the Mun in extraordinary detail from low orbit. The flagged structure in the highlands is resolved clearly now — a vertical form, smooth-sided, approximately twelve metres tall. It is casting a clean shadow. Wernher has the measurement. He has already written TMA-5 on the mission board before anyone asked him to.
        InSpaceHighMun   = High-altitude Gazer survey of the Mun. The whole near-side is being covered at a resolution sufficient to detect structures of the type we found north of the KSC. The anomaly detection algorithm has returned one flag. It is in the highlands. It is the same proportions as TMA-0. It is waiting for us.

        InSpaceLowMinmus    = From low Minmus orbit with the Gazer, the surface is extraordinary. The Glassmonite flats are resolved down to individual crystal facets — Wernher wants to frame one of these images. And in the Greater Flats, clearly visible, a vertical structure identical in form to TMA-0. Same proportions. Same clean shadow. Same impossible regularity. TMA-Minmus is logged. The network is complete within the Kerbin system. What else is out there?
        InSpaceHighMinmus   = Wide-area Gazer survey of Minmus. The flat seas cover a remarkable proportion of the surface. The anomaly detection algorithm has flagged one site in the Greater Flats. No geological explanation. The crew have already started calling it the Minmus monolith. Wernher says that is not an unreasonable name.

        default = KVS-3 high-resolution survey data collected and transmitted to KASA ground control.
    }
}
