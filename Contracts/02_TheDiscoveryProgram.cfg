// ================================================================
// KASA — THE DISCOVERY PROGRAMME
// ================================================================
// The science campaign that identifies and characterises the two
// unknown bodies orbiting Kerbin, then turns the programme's gaze
// outward to the rest of the Kerbol system.
//
// Narrative thread:
//   DP-01: First telescope — detects two distinct objects, places
//          them as bodies rather than artefacts. Reveals Mun and
//          Minmus as identifiable shapes (stage 3).
//   DP-02: Targeted observation + Kerbin science baseline.
//          Now we know what we are looking at, so the right
//          instruments can be chosen. Advances Mun and Minmus
//          to stage 4 (colour returns to the imagery). Also
//          confirms the GRAVMAX surface-anomaly flag is magnetic.
//   DP-03: Sentinel deployment. Activates the inner planets
//          detection system — bodies are revealed one at a time
//          as the Sentinel detects them.
// ================================================================


// ----------------------------------------------------------------
// DP-01: FIRST OBSERVATION TELESCOPE
// earlyBase x2.5  Stock: 125,000 total
// Uses the KVS-3 Gazer in low Kerbin orbit. Five-day campaign
// confirms two distinct bodies and reveals them at stage 3.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = DP_01_FirstObservation
    group           = TheDiscoveryProgram

    title           = Discovery: First Observation Campaign
    genericTitle    = Place a telescope in stable Kerbin orbit to identify the two objects
    description     = Commander Kerman's crewed orbit confirmed the two bright objects visually. Now we need instruments. A dedicated observation platform above the atmosphere, equipped with the KOP-1 "Seeker" telescope, transmitting continuously for two days. The telescope will track both objects directly while building a mass distribution model from their gravitational signatures.\n\nTwo days of uninterrupted measurement should give us orbital periods, approximate sizes, and a definitive count. Wernher is already drafting a paper. He says he has been waiting his entire career for this data.
    synopsis        = Launch an uncrewed Seeker-equipped probe to Kerbin orbit above 200km. Transmit science. Maintain orbit for 2 days.
    completedMessage = Two days of data. The results are unambiguous — two distinct bodies. The larger sits closer, on a near-circular path; the smaller rides a tilted, more distant orbit. We have their sizes, their periods, and a definitive count. What they actually are is the next campaign's job. Wernher's paper is already three drafts in.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 365

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 3.0 / 6.0 / 5000) * 5000
        step_transmit = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        step_duration = Round(@stepPool * 2.0 / 6.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 10
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name     = HasTelescope
        type     = PartValidation
        part     = kop1_seeker
        minCount = 1
        title    = The satellite must carry the KOP-1 "Seeker" orbital optics platform
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The satellite must carry deployable solar panels
    }

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 200000
        disableOnStateChange = True
        title                = Achieve stable orbit above 200km (telescope minimum operating altitude)
        rewardFunds          = @/step_orbit
        rewardReputation     = 3
    }

    PARAMETER
    {
        name           = TransmitScience
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit science data from low Kerbin orbit
        rewardFunds    = @/step_transmit
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = OrbitalDuration
        type           = Duration
        duration       = 2d
        preWaitText    = Waiting for stable orbit to be established.
        waitingText    = Gazer scanning the Kerbin system...
        completionText = 2-day observation campaign complete.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = AchieveOrbit
        rewardFunds    = @/step_duration
        rewardReputation = 2
    }

    // Reveal Mun and Minmus at stage 3 (telescope identification) on contract completion
    BEHAVIOUR
    {
        name  = RevealMunTelescope
        type  = KASAAdvanceDiscovery
        body  = Mun
        stage = telescope
    }

    BEHAVIOUR
    {
        name  = RevealMinmusTelescope
        type  = KASAAdvanceDiscovery
        body  = Minmus
        stage = telescope
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Two signatures confirmed
            condition = PARAMETER_COMPLETED
            parameter = OrbitalDuration

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = Two. Distinct. Bodies. The data is unambiguous — two separate gravitational signatures, two orbital periods, two solid objects. Object A completes its orbit in approximately 39 hours. Object B takes six days and is on a substantially inclined orbit relative to A. The mass estimates suggest A is approximately one-eightieth of Kerbin's mass; B is much smaller, perhaps a fortieth of A. We now have shapes — rough, but unmistakable. The next campaign will need different instruments. Now that we know what we are looking at, we can choose the right ones.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF04
        type         = CompleteContract
        contractType = FF_04_FirstCrewedOrbit
        title        = First Crewed Orbital Mission must be complete
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
// DP-02: DETAILED OBSERVATION + KERBIN SCIENCE BASELINE
// earlyBase x3.5  Stock: 175,000 total
// Now that we know what we are looking at, the right instruments
// can be chosen. The Gazer plus the Harbinger magnetometer give
// us spectral characterisation of Mun and Minmus, plus a Kerbin
// science baseline. The magnetometer also confirms the GRAVMAX-
// flagged surface anomaly is electromagnetic.
// Advances Mun and Minmus to stage 4 (colour returns).
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = DP_02_DetailedObservation
    group           = TheDiscoveryProgram

    title           = Discovery: Detailed Observation Campaign
    genericTitle    = Conduct detailed observations of the two bodies and a Kerbin baseline
    description     = The first campaign told us what we are looking at. The second tells us what they are made of. The Gazer is being relaunched with new spectral filters, and the KMF-1 Harbinger magnetometer added to the platform. Together they will give us surface composition signatures for both bodies and a comprehensive Kerbin baseline against which every future mission will be compared.\n\nWernher specifically requested the magnetometer. He wants a magnetic profile of the fixed surface anomaly the orbital survey already flagged, twelve kilometres north of the KSC, and he suspects the magnetometer will finally tell us what it is. He has been writing in his notebook with the door closed for two days.
    synopsis        = Collect science from low and high Kerbin orbit. Conduct a magnetic survey of Kerbin from orbit. Recover a physical science capsule.
    completedMessage = The baseline is complete, and the spectral returns finally settle it — the naming competition is over: the larger, closer body is the Mun; the smaller, tilted one, Minmus. The Kerbin system is characterised. And Mission Control has just issued a new contract.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal  = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 3.5 / 5000) * 5000
        advance        = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool       = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus          = Round(@contractTotal * 0.20 / 5000) * 5000
        step_lowsci    = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        step_hisci     = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        step_magsurvey = Round(@stepPool * 2.0 / 6.0 / 5000) * 5000
        step_capsule   = Round(@stepPool * 2.0 / 6.0 / 5000) * 5000
        requiredValue  = false
        title          = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    failureReputation = 4
    failureFunds      = 0

    PARAMETER
    {
        name     = HasGazer
        type     = PartValidation
        part     = kvs3_gazer
        minCount = 1
        title    = The satellite must carry the KVS-3 "Gazer" telescope
    }

    PARAMETER
    {
        name     = HasMagnetometer
        type     = PartValidation
        part     = kmb1_harbinger
        minCount = 1
        title    = The satellite must carry the KMF-1 "Harbinger" magnetometer boom
    }

    PARAMETER
    {
        name           = LowOrbitScience
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Collect and transmit science from low Kerbin orbit
        rewardFunds    = @/step_lowsci
        rewardReputation = 2
    }

    PARAMETER
    {
        name           = HighOrbitScience
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceHigh
        recoveryMethod = Transmit
        title          = Collect and transmit science from high Kerbin orbit
        rewardFunds    = @/step_hisci
        rewardReputation = 2
    }

    PARAMETER
    {
        name           = MagnetometerSurvey
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceHigh
        experiment     = kasaMagneticSurvey
        recoveryMethod = Transmit
        title          = Conduct a magnetic survey of Kerbin from high orbit
        rewardFunds    = @/step_magsurvey
        rewardReputation = 4
    }

        PARAMETER
    {
        name           = OrbitalDuration
        type           = Duration
        duration       = 3d
        preWaitText    = Waiting for stable orbit to be established.
        waitingText    = Gazer scanning the Kerbin system...
        completionText = 3-day observation campaign complete.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = AchieveOrbit
        rewardFunds    = @/step_duration
        rewardReputation = 2
    }

    // Advance Mun and Minmus to stage 4 (observation — colour returns)
    BEHAVIOUR
    {
        name  = RevealMunObservation
        type  = KASAAdvanceDiscovery
        body  = Mun
        stage = observation
    }

    BEHAVIOUR
    {
        name  = RevealMinmusObservation
        type  = KASAAdvanceDiscovery
        body  = Minmus
        stage = observation
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The baseline is complete
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_thumbUp
            }

            TEXT
            {
                text = The Kerbin system is mapped. Both moons are characterised. Mission planning is already preparing the probe programme. We are ready to go.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = One more thing
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = While I have your attention — the magnetometer data. You will recall the fixed surface anomaly the GRAVMAX flagged during our first orbital survey, twelve kilometres north of the KSC. The Harbinger has now profiled it magnetically, and I can confirm what I suspected. The signature is electromagnetic. It matches no geological formation. There is no record of any installation at those coordinates. This is not a natural deposit. If a ground team has not already reached it, they should.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedDP01
        type         = CompleteContract
        contractType = DP_01_FirstObservation
        title        = First Observation Campaign must be complete
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
// DP-03: SENTINEL TELESCOPE DEPLOYMENT
// Stock Sentinel Infrared Telescope in Kerbol orbit.
// Activates the planet detection system — inner planets are
// revealed one at a time as the Sentinel detects them.
// Gates on DP-02 (detailed observation) complete.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = DP_03_SentinelDeployment
    group           = TheDiscoveryProgram

    title           = Discovery: Sentinel Telescope
    genericTitle    = Deploy a Sentinel Infrared Telescope to Kerbol orbit
    genericDescription = Deploy the stock Sentinel Infrared Telescope to a Kerbol orbit to begin scanning for unknown planets.
    description     = The Kerbin system is characterised. Mun and Minmus are known, mapped, and ready for the probe programme. But the gravitational data has been telling a strange secondary story — faint perturbations that cannot be explained by two moons alone. Something unseen is influencing the orbits of every body in the system.\n\nThe Sentinel Infrared Telescope is designed for exactly this. Placed in Kerbol orbit, it will scan the inner face of the solar system for transit events — distant bodies passing in front of the sun. It cannot tell us what those bodies look like. It cannot tell us how many moons they have. But it can tell us they are there.\n\nLaunch the Sentinel. Point it at the sun. Wait.
    synopsis        = Deploy the Sentinel Infrared Telescope to a Kerbol orbit. The detection system will begin automatically.
    completedMessage = The Sentinel is in position and scanning. Wernher says we should expect the first detection within weeks. He is already calling it the "inner planets programme."

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Sun
    minExpiry  = 1
    maxExpiry  = 730

    advanceFunds      = 40000
    rewardFunds       = 120000
    rewardReputation  = 15
    failureReputation = 5
    failureFunds      = 0

    PARAMETER
    {
        name       = HasSentinel
        type       = PartValidation
        part       = InfraredTelescope
        minCount   = 1
        title      = The vessel must carry the Sentinel Infrared Telescope
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The vessel must carry deployable solar panels
    }

    PARAMETER
    {
        name                 = SentinelInOrbit
        type                 = Orbit
        targetBody           = Sun
        situation            = ORBITING
        minAltitude          = 1000000
        disableOnStateChange = True
        title                = Achieve a stable orbit of Kerbol
        rewardFunds          = 40000
        rewardReputation     = 5
    }

    BEHAVIOUR
    {
        name      = StartSentinelSurvey
        type      = KASAStartSentinelSurvey
        parameter = SentinelInOrbit
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The survey begins
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The Sentinel is operational. The detection algorithm is running. I have configured it to flag any transit event that repeats on a consistent orbital period — that is the signature of a planet rather than debris. The first detections should come within weeks — the inner worlds, the ones whose orbits carry them across the face of the sun. But anything orbiting beyond us will never transit from where we sit; the Sentinel is blind to it. Whatever is out there tugging on these orbits, we will not find it this way. For that, one day, we will need a different kind of eye. The inner system, though — that is about to open up.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedDP02
        type         = CompleteContract
        contractType = DP_02_DetailedObservation
        title        = Detailed Observation Campaign must be complete
    }

}


// ----------------------------------------------------------------
// DP-04: THE OUTER SURVEY  (relocate the Gazer beyond Kerbin)
// probeBase x4.0 — reward scale FLAGGED
// The Sentinel is transit-limited to the inner worlds. To find what
// lies beyond Kerbin we fall back on direct imaging: put the Gazer in
// a solar orbit outside Kerbin's and let it catch slow movers against
// the stars. Completing it fires KASAStartOuterSurvey, which schedules
// imaging detection for every undiscovered EXTERIOR body.
// Player may reuse their existing Gazer or launch a fresh one — the
// contract only checks for a Gazer in the right orbit.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = DP_04_OuterSurvey
    group           = TheDiscoveryProgram

    title           = Discovery: The Outer Survey
    genericTitle    = Relocate the Gazer to a solar orbit beyond Kerbin
    genericDescription = Place a Gazer telescope in a solar orbit outside Kerbin's to begin direct imaging of the outer system.
    description     = The Sentinel did its work: the inner worlds are on the map. But it was always going to fall silent at Kerbin's orbit — nothing beyond us ever crosses the sun's face, so transit photometry simply cannot see the outer dark. And the perturbation data still does not close. Something out there is still pulling on the orbits, and the Sentinel will never find it.\n\nSo we go back to the instrument that started all this: the Gazer. Move a Gazer telescope out to a solar orbit beyond Kerbin's, where it can stare into the outer system and catch the faint, slow points that drift against the background stars — the direct-imaging signature of a distant world. You can boost the Gazer you already have out there if it has the fuel to spare, or launch a fresh one; either works. Get it into an orbit outside Kerbin's, and let it watch.
    synopsis        = Place a Gazer telescope in a stable solar orbit beyond Kerbin's orbit. The outer detection survey will then begin automatically.
    completedMessage = The Gazer is on station in the outer dark and imaging. Wernher expects the first outer detections within weeks. The map is about to grow again — outward, this time.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Sun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x 4.0 (deploy tier) — FLAGGED, balance TBC
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 16
    failureReputation = 6
    failureFunds      = 0

    PARAMETER
    {
        name       = HasGazer
        type       = PartValidation
        part       = kvs3_gazer
        minCount   = 1
        title      = The vessel must carry a Gazer telescope
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The vessel must carry deployable solar panels
    }

    PARAMETER
    {
        name                 = GazerInOuterOrbit
        type                 = Orbit
        targetBody           = Sun
        situation            = ORBITING
        minAltitude          = 14000000000
        disableOnStateChange = True
        title                = Establish a stable solar orbit beyond Kerbin (periapsis above 14 Gm)
        rewardFunds          = @/stepPool
        rewardReputation     = 6
    }

    BEHAVIOUR
    {
        name      = StartOuterSurvey
        type      = KASAStartOuterSurvey
        parameter = GazerInOuterOrbit
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = A different kind of eye
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The Gazer is in position and staring outward. This is not transit work — there is no sun to pass in front of out here. We are watching for motion: a faint point that shifts against the fixed stars from one frame to the next. Anything that moves like that is bound to Kerbol and orbiting beyond us. The processing takes time, and the farther out a world is, the fainter and slower it moves — so the near ones will resolve first and the distant ones will trickle in over the months. But we will get them now. All of them.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedDP03
        type         = CompleteContract
        contractType = DP_03_SentinelDeployment
        title        = Sentinel Telescope must be deployed
    }

    REQUIREMENT
    {
        name         = CompletedMohoProbe
        type         = CompleteContract
        contractType = IP_01_MohoProbe
        title        = Moho must have been surveyed (inner system underway)
    }

    REQUIREMENT
    {
        name         = CompletedEveProbe
        type         = CompleteContract
        contractType = IP_02_EveProbe
        title        = Eve must have been surveyed (inner system underway)
    }
}
