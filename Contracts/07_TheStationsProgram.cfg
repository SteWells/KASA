// ================================================================
// KASA — THE STATIONS PROGRAMME
// ================================================================
// Three orbital stations, each with a distinct purpose:
//
// ST-K01  Kerbin Station    — staging depot, tourist destination,
//                             fed by Kerbin surface fuel base
// ST-M01  Mun Station       — Regocite processing depot, resupply
//                             point for Mun surface base
// ST-MM01 Minmus Station    — Glassmonite/Prismatic Gel depot,
//                             refuelling point for deep-space vessels
//
// Gate chain:
//   KSP_02 complete → ST-K01 + ST-M01 unlock (parallel)
//   KSP_04 complete → ST-MM01 unlocks
//   ST-M01 complete → Mun base resupply repeating contracts
//   ST-MM01 complete → deep-space refuelling repeating contracts
// ================================================================


// ----------------------------------------------------------------
// ST-K01: KERBIN ORBITAL STATION
// stationBase x1.0  Stock: ~200,000 total
// The Kerbin station serves as a staging point for Mun/Minmus
// missions, a tourist destination, and a refuelling depot fed by
// the Kerbin surface base in the Badlands.
// Minimum: 4 crew capacity, power, docking port, lab.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = ST_K01_KerbinStation
    group           = TheStationsProgram

    title           = Stations Programme: Kerbin Orbital Station
    genericTitle    = Establish a crewed orbital station around Kerbin
    genericDescription = Establish a permanent crewed orbital station around Kerbin with crew capacity, power generation, docking capability, and a science lab.
    description     = The Mun and Minmus missions have demonstrated that getting crews to other bodies is achievable. What we have not yet built is the infrastructure to make it routine. A permanent Kerbin orbital station solves two problems at once: it gives us a staging point for outbound missions, and a destination for the growing tourist programme.\\n\\nMortimer has pointed out that a "space hotel" framing could significantly increase the tourism revenue projections. We are calling it a research station. Mortimer is calling it the KASA Grand Orbital. We have agreed to disagree.
    synopsis        = Establish a permanent Kerbin orbital station with at least 4 crew capacity, power generation, a docking port, and a science lab.
    completedMessage = The Kerbin station is operational. The first crew rotation is in progress. Mortimer has already sold three tourist berths.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 15000.0) * 5000 * 1.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_launch   = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_duration = Round(@stepPool * 5.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 12
    failureReputation = 4
    failureFunds      = 0

    PARAMETER
    {
        name       = StationOrbit
        type       = Orbit
        targetBody = HomeWorld()
        minAltitude = 200000
        maxAltitude = 1000000
        disableOnStateChange = True
        title      = Establish the station in a stable orbit between 200km and 1,000km
        rewardFunds = @/step_launch
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The station must be crewed by at least 2 kerbals
    }

    PARAMETER
    {
        name       = HasCrewCapacity
        type       = HasCrewCapacity
        minCapacity = 4
        title      = The station must have capacity for at least 4 kerbals
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 2
        title      = The station must carry at least 2 solar panel arrays
    }

    PARAMETER
    {
        name       = HasDockingPort
        type       = PartValidation
        partModule = ModuleDockingNode
        minCount   = 2
        title      = The station must have at least 2 docking ports
    }

    PARAMETER
    {
        name       = HasLab
        type       = PartValidation
        partModule = ModuleScienceLab
        minCount   = 1
        title      = The station must include a science laboratory
    }

    PARAMETER
    {
        name           = StationDuration
        type           = Duration
        duration       = 30d
        preWaitText    = Station must be crewed and in orbit before the operational period begins.
        waitingText    = Station operational — crew conducting research and preparing for tourist rotation...
        completionText = 30-day initial operational period complete. Station certified for extended operations.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = HasCrew
        rewardFunds    = @/step_duration
        rewardReputation = 5
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Station operational
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_thumbsUp
            }

            TEXT
            {
                text = This is what the programme has been building toward. A permanent human presence in orbit. From here, Mun missions become routine resupply runs rather than expeditions. The tourist programme gets a real destination. This is the infrastructure that makes everything else cheaper.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP02
        type         = CompleteContract
        contractType = KSP_02_MunCrewed
        title        = Mun Crewed Mission must be complete
    }
}


// ----------------------------------------------------------------
// ST-M01: MUN ORBITAL CONSTRUCTION PLATFORM
// stationBase x3.0  Stock: ~600,000 total
// An orbital shipyard. Regocite mined at the Mun (plus Consumables
// shipped from Kerbin) feeds an Extraplanetary Launchpads construction
// dock to fabricate vessels in Mun orbit, rather than exporting the
// material back to Kerbin. The EL dock + engineer requirements are
// added by a NEEDS[Launchpad] patch below so the base contract still
// completes (material storage only) if EL is absent.
// Minimum: 4 crew capacity, power, docking ports, lab, dock, storage.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = ST_M01_MunStation
    group           = TheStationsProgram

    title           = Stations Programme: Mun Construction Platform
    genericTitle    = Establish an orbital construction platform around the Mun
    genericDescription = Establish a permanent crewed orbital construction platform around the Mun, able to fabricate vessels in orbit from locally-mined Regocite.
    description     = The Mun base is pulling Regocite out of the Midlands in quantity. Rather than haul that mass all the way back to Kerbin, we are going to use it where it is worth the most — in orbit. This station is a construction platform: fit it with an orbital construction dock, keep its tanks fed with Regocite from the surface and Consumables shipped up from Kerbin, and it can fabricate whole vessels in Mun orbit that never have to be lifted from Kerbin at all.\\n\\nAt minimum: an orbital construction dock, bulk Regocite and Consumables storage, four crew berths with at least one engineer to run the dock, two docking ports, a lab, and power generation sufficient for continuous operation.
    synopsis        = Establish a crewed orbital construction platform around the Mun with a construction dock, Regocite and Consumables storage, an engineer, 2 docking ports and a lab.
    completedMessage = Mun construction platform operational. For the first time we can build ships in Mun orbit from Regocite mined below — no longer bound by what we can lift from Kerbin in a single stack.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 15000.0) * 5000 * 3.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_duration = Round(@stepPool * 5.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    failureReputation = 5
    failureFunds      = 0

    PARAMETER
    {
        name       = StationOrbit
        type       = Orbit
        targetBody = Mun
        minAltitude = 20000
        maxAltitude = 500000
        disableOnStateChange = True
        title      = Establish the station in a stable Mun orbit (20–500km)
        rewardFunds = @/step_orbit
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The station must be crewed by at least 2 kerbals
    }

    PARAMETER
    {
        name        = HasCrewCapacity
        type        = HasCrewCapacity
        minCapacity = 4
        title       = The station must have capacity for at least 4 kerbals
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 2
        title      = The station must carry at least 2 solar panel arrays
    }

    PARAMETER
    {
        name       = HasDockingPorts
        type       = PartValidation
        partModule = ModuleDockingNode
        minCount   = 2
        title      = The station must have at least 2 docking ports
    }

    PARAMETER
    {
        name       = HasLab
        type       = PartValidation
        partModule = ModuleScienceLab
        minCount   = 1
        title      = The station must include a science laboratory
    }

    PARAMETER
    {
        name        = HasRegociteStorage
        type        = HasResourceCapacity
        resource    = Regocite
        minQuantity = 2500
        title       = The station must have storage capacity for at least 2500 units of Regocite
    }

    PARAMETER
    {
        name        = HasConsumablesStorage
        type        = HasResourceCapacity
        resource    = Consumables
        minQuantity = 1000
        title       = The station must have storage capacity for at least 1000 units of Consumables
    }

    PARAMETER
    {
        name           = StationDuration
        type           = Duration
        duration       = 30d
        preWaitText    = Station must be crewed and in Mun orbit before the operational period begins.
        waitingText    = Mun construction platform operational — dock crews running fabrication checkout...
        completionText = 30-day operational period complete. Mun construction platform certified for orbital fabrication.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = HasCrew
        rewardFunds    = @/step_duration
        rewardReputation = 6
    }

    REQUIREMENT
    {
        name         = CompletedKSP02
        type         = CompleteContract
        contractType = KSP_02_MunCrewed
        title        = Mun Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedMunBase
        type         = CompleteContract
        contractType = BAS_M01_MunBase
        title        = Mun surface base must be operational
    }
}

// EL-gated: turns the Mun station into a working orbital shipyard when
// Extraplanetary Launchpads is installed — adds the construction dock and the
// engineer needed to run it. Builder part is the ELOrbitalDock (ELLaunchpad
// module); engineers supply the native ELConstructionSkill. Without EL the base
// contract above still completes on material storage alone.
@CONTRACT_TYPE[ST_M01_MunStation]:NEEDS[Launchpad]:AFTER[KASA]
{
    PARAMETER
    {
        name       = HasConstructionDock
        type       = PartValidation
        partModule = ELLaunchpad
        minCount   = 1
        title      = The station must include an orbital construction dock (Extraplanetary Launchpads)
    }

    PARAMETER
    {
        name    = HasEngineer
        type    = HasCrew
        trait   = Engineer
        minCrew = 1
        title   = The station must be crewed by at least one Engineer to run the construction dock
    }
}


// ----------------------------------------------------------------
// ST-MM01: MINMUS ORBITAL STATION
// stationBase x4.0  Stock: ~800,000 total
// The Minmus station is the Prismatic Gel processing depot and
// the refuelling point for deep-space vessels. The most
// strategically important station in the programme.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = ST_MM01_MinmusStation
    group           = TheStationsProgram

    title           = Stations Programme: Minmus Orbital Station
    genericTitle    = Establish a crewed orbital station around Minmus
    genericDescription = Establish a permanent crewed orbital station around Minmus to serve as a Prismatic Gel fuel depot for deep-space vessels.
    description     = Wernher's analysis of the Glassmonite sample is conclusive. Prismatic Gel propellant is real, the specific impulse is real, and the Minmus deposits are more than sufficient to supply a full programme of deep-space missions. What we need now is the infrastructure to make it useful.\\n\\nThe surface base does the processing; the station is the depot. The Minmus station will receive finished Prismatic Gel from the surface base, hold it in bulk storage, and transfer it to outbound vessels. Any vessel departing for the inner or outer planets that stops here first gains a significant mission delta-V advantage. Build the station. This is the pivot point of the entire exploration programme.
    synopsis        = Establish a permanent crewed orbital station around Minmus. Minimum 4 crew capacity, 2 docking ports, Prismatic Gel storage, lab.
    completedMessage = Minmus station is operational. The first Prismatic Gel batch is in storage. The outer system is now within reach.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 15000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_duration = Round(@stepPool * 5.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    failureReputation = 6
    failureFunds      = 0

    PARAMETER
    {
        name       = StationOrbit
        type       = Orbit
        targetBody = Minmus
        minAltitude = 10000
        maxAltitude = 200000
        disableOnStateChange = True
        title      = Establish the station in a stable Minmus orbit (10–200km)
        rewardFunds = @/step_orbit
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The station must be crewed by at least 2 kerbals
    }

    PARAMETER
    {
        name        = HasCrewCapacity
        type        = HasCrewCapacity
        minCapacity = 4
        title       = The station must have capacity for at least 4 kerbals
    }

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 2
        title      = The station must carry at least 2 solar panel arrays
    }

    PARAMETER
    {
        name       = HasDockingPorts
        type       = PartValidation
        partModule = ModuleDockingNode
        minCount   = 2
        title      = The station must have at least 2 docking ports
    }

    PARAMETER
    {
        name        = HasPrismaticGelStorage
        type        = HasResourceCapacity
        resource    = PrismaticGel
        minQuantity = 2500
        title       = The station must have storage capacity for at least 2500 units of Prismatic Gel
    }

    PARAMETER
    {
        name       = HasLab
        type       = PartValidation
        partModule = ModuleScienceLab
        minCount   = 1
        title      = The station must include a science laboratory
    }

    PARAMETER
    {
        name           = StationDuration
        type           = Duration
        duration       = 30d
        preWaitText    = Station must be crewed and in Minmus orbit before operational period begins.
        waitingText    = Minmus station operational — receiving first Prismatic Gel deliveries from the surface base...
        completionText = 30-day operational period complete. First Prismatic Gel delivery received and certified in storage.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = HasCrew
        rewardFunds    = @/step_duration
        rewardReputation = 8
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Prismatic Gel depot online
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The first delivery from the surface base is in the tanks. Thirty-two units of Prismatic Gel, enough for a low-thrust deep-space engine to run for approximately four hundred days continuously. Any vessel that departs from Minmus station with a full Prismatic Gel tank can reach Eve, Duna, or the asteroid belt without a Kerbin launch window. We have just made every mission beyond Kerbin significantly cheaper to plan. I want to talk to the mission planning team about the implications for the inner planets programme.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP04
        type         = CompleteContract
        contractType = KSP_04_MinmusCrewed
        title        = Minmus Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedMinmusBase
        type         = CompleteContract
        contractType = BAS_MM01_MinmusBase
        title        = Minmus surface base must be operational
    }
}
