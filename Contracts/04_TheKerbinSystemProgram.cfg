{
    name            = KSP_03a_MinmusRecon
    group           = TheKerbinSystemProgram

    title           = Minmus Programme: Reconnaissance Pass
    genericTitle    = Complete a low-resolution reconnaissance survey
    description     = We have a name and an orbit, and that is all. We do not know what its surface is made of, whether it has distinct regions, or whether there is anything down there worth the cost of a proper survey campaign.\n\nMortimer has approved a cheap reconnaissance probe on one condition: it answers the question "is this worth going back to?" before we spend anything serious. Carry a low-resolution altimetry instrument and a low-resolution imager. Bring back pictures.
    synopsis        = Enter the SOI, achieve a scanning orbit, and complete 80% lo-res altimetry, lo-res visual, and biome coverage.
    completedMessage = We have pictures. Not detailed ones, but for the first time we can see it rather than infer it. The imaging team have put the first frame on the wall of the briefing room.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x1.5 — recon is deliberately cheap
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 1.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 8.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 8.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        step_visual   = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        step_biome    = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 5
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry solar panels for long-duration operation
    }

    PARAMETER
    {
        name        = EnterMinmusSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Minmus
        minAltitude = 1
        title       = Enter the sphere of influence
        rewardFunds = @/step_soi
        rewardReputation = 2
    }

    PARAMETER
    {
        name                 = OrbitMinmus
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Minmus
        minAltitude          = 20000
        maxAltitude          = 400000
        title                = Achieve a stable scanning orbit
        rewardFunds          = @/step_orbit
        rewardReputation     = 2
    }

    PARAMETER
    {
        name        = AltimetryLoScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Minmus
        title       = Achieve 80% LO-RES ALTIMETRY coverage
        rewardFunds = @/step_altim
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = VisualLoScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = VisualLoRes
        targetBody  = Minmus
        title       = Achieve 80% LO-RES VISUAL coverage
        rewardFunds = @/step_visual
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Minmus
        title       = Achieve 80% BIOME coverage
        rewardFunds = @/step_biome
        rewardReputation = 2
    }

    // Stage 5 = SEEN. Driven by the lo-res VISUAL scan only — appearance
    // changes only when we actually image the body (DESIGN-006).
    BEHAVIOUR
    {
        name      = RevealMinmusSeen
        type      = KASAAdvanceDiscovery
        body      = Minmus
        stage     = 5
        parameter = VisualLoScan
    }

    REQUIREMENT
    {
        name         = CompletedDP02
        type         = CompleteContract
        contractType = DP_02_DetailedObservation
        title        = Detailed Observation Campaign must be complete
    }

    REQUIREMENT
    {
        name  = MinmusKnown
        type  = KASABodyDiscovered
        body  = Minmus
        title = The body must be a known body
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_03_MinmusProbe
    group           = TheKerbinSystemProgram

    title           = Minmus Programme: Uncrewed Exploration
    genericTitle    = Complete an uncrewed probe survey of Minmus
    description     = Minmus. The small, pale oddity in an inclined orbit. The flat crystalline seas are visible even from Kerbin orbit through the Gazer — the detailed observation campaign named them, and the question of what they actually are has been on Wernher's whiteboard since the first image came back.\n\nThree scanning campaigns will answer it: terrain, biome distribution, and subsurface composition. Wernher has circled the flat sea biomes on every Minmus chart in the building. He is expecting the resource scanner to find something there.
    synopsis        = Enter Minmus SOI. Achieve orbit. Complete 80% altimetry, biome, and resource scan coverage. Land a probe and return surface science.
    completedMessage = All three scans complete, probe landed. The resource data from the flat seas is unlike anything in the geological catalogue. Wernher is calling it Glassmonite. He says it is the most interesting material he has ever seen.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x Minmus.Multiplier() = 75,000 x 4.0 = 300,000
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_visual   = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_land     = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 10
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry solar panels for long-duration operation
    }

    PARAMETER
    {
        name        = EnterMinmusSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Minmus
        minAltitude = 1
        title       = Enter Minmus's sphere of influence
        rewardFunds = @/step_soi
        rewardReputation = 2
    }

    PARAMETER
    {
        name                 = OrbitMinmus
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Minmus
        minAltitude          = 15000
        maxAltitude          = 200000
        title                = Achieve a stable scanning orbit (15–200km)
        rewardFunds          = @/step_orbit
        rewardReputation     = 3
    }

    PARAMETER
    {
        name        = AltimetryHiScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryHiRes
        targetBody  = Minmus
        title       = Achieve 80% HI-RES ALTIMETRY coverage
        rewardFunds = @/step_altim
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = VisualHiScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = VisualHiRes
        targetBody  = Minmus
        title       = Achieve 80% HI-RES VISUAL coverage
        rewardFunds = @/step_visual
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Minmus
        title       = Achieve 80% RESOURCE coverage
        rewardFunds = @/step_resource
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = LandOnMinmus
        type       = ReachState
        disableOnStateChange = True
        targetBody = Minmus
        situation  = LANDED
        title      = Land an uncrewed probe on Minmus
        rewardFunds = @/step_land
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = TransmitSurface
        type           = CollectScience
        targetBody     = Minmus
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Transmit surface science data to KASA
    }

    // Stage 6 = FULLY MAPPED. Driven by the HI-RES VISUAL scan — full
    // detail and Parallax terrain only once we have proper imagery.
    BEHAVIOUR
    {
        name      = RevealMinmusMapped
        type      = KASAAdvanceDiscovery
        body      = Minmus
        stage     = 6
        parameter = VisualHiScan
    }

    // Mark Minmus resource scan complete
    BEHAVIOUR
    {
        name      = MarkMinmusResourceScanned
        type      = KASAResourceScanned
        body      = Minmus
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The flat seas
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The flat seas are not ice. They are not salt flats. They are a crystalline mineral formation I cannot find in any planetary database — a mineral I am provisionally calling Glassmonite. The resource scanner shows extremely high concentrations throughout the Greater Flats, Lesser Flats, and Flats biomes. The optical properties of the crystal structure are extraordinary. I believe this material can be processed into a propellant with a specific impulse in excess of three thousand seconds. If that analysis is correct, Minmus is not just an interesting body. It is the most strategically valuable body in the Kerbin system.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedRecon
        type         = CompleteContract
        contractType = KSP_03a_MinmusRecon
        title        = The reconnaissance pass must be complete
    }

    REQUIREMENT
    {
        name  = MinmusKnown
        type  = KASABodyDiscovered
        body  = Minmus
        title = Minmus must be a known body
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
// KSP-03b: MINMUS PRACTICE LANDING (ICE CAPS BIOME)
// earlyBase x1.0  Stock: ~50,000 total
// Gates on KSP_03 complete. The Ice Caps are Kerbin's best analogue
// for Minmus — flat, featureless, low visual cues, tricky to judge
// vertical speed on landing. Two landings required.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_03b_MinmusPracticeLanding
    group           = TheKerbinSystemProgram

    title           = Minmus Training: Ice Cap Landing Practice
    genericTitle    = Practice Minmus-analogue landings on the Kerbin Ice Caps
    genericDescription = Practice landing on the Kerbin Ice Caps to train crews for Minmus surface operations.
    description     = Minmus is deceptive. The very low gravity and perfectly flat terrain of the crystalline seas make the descent feel easy — until you misjudge the vertical speed and bounce across three hundred metres of surface before stopping. The Kerbin Ice Caps offer the closest analogue we have: flat, featureless, hard surface, minimal visual cues on approach.\n\nOne landing on the Ice Caps. One EVA report from the surface. The crew will know what to expect on the flats before they are actually standing on them.
    synopsis        = Land on the Kerbin Ice Caps biome. Conduct an EVA report from the surface.
    completedMessage = Ice cap landing logged. The landing profile has been forwarded to the Minmus mission planning team.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    advanceFunds      = 5000
    rewardFunds       = 15000
    rewardReputation  = 4
    failureReputation = 1
    failureFunds      = 0

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name       = IceLanding1
        type       = ReachState
        targetBody = HomeWorld()
        situation  = LANDED
        biome      = Ice Caps
        disableOnStateChange = True
        title      = First ice cap landing
        rewardFunds = 4000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = IceEVA1
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Ice Caps
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = EVA report from the first ice cap landing
    }

    REQUIREMENT
    {
        name         = CompletedKSP03
        type         = CompleteContract
        contractType = KSP_03_MinmusProbe
        title        = Minmus Probe Mission must be complete
    }
}


// ----------------------------------------------------------------
// KSP-04: MINMUS CREWED MISSION
// crewedBase x4.0  Stock: 600,000 total
//   advance 120,000 | orbit 35,000 | EVA-orbit 70,000 | land 110,000 |
//   surface-EVA 110,000 | return 35,000 | bonus 120,000
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_04_MinmusCrewed
    group           = TheKerbinSystemProgram

    title           = Minmus Programme: Crewed Landing Mission
    genericTitle    = Land Kerbals on Minmus and return safely
    description     = The resource scanner found Glassmonite in the flat seas. Wernher's analysis suggests it can be processed into a propellant with a specific impulse above three thousand seconds. He needs a physical sample from the Greater Flats before he can confirm it.\n\nThe crewed Minmus mission has two objectives: put Kerbals on Minmus, and bring back a Glassmonite sample from the Greater Flats. If Wernher is right about the Isp, this sample will change the entire trajectory of the exploration programme.
    synopsis        = Fly a crewed mission to Minmus. Achieve orbit, EVA, land in the Greater Flats, recover a Glassmonite sample and return to Kerbin.
    completedMessage = They walked on Minmus and came home. Wernher has the sample. He is already talking about Prismatic Gel propellant, thousand-second burns, and vessels that can reach the outer system on a single tank. The programme just changed.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // crewedBase x Minmus.Multiplier() = 150,000 x 4.0 = 600,000
        contractTotal = Round(Round(HomeWorld().Radius() / 20000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_evaOrbit = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_land     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_evaSurf  = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_return   = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 25
    failureReputation = 12
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name        = OrbitMinmus
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Minmus
        minAltitude = 10000
        title       = Achieve stable orbit of Minmus
        rewardFunds = @/step_orbit
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = EVAInOrbit
        type           = CollectScience
        targetBody     = Minmus
        situation      = InSpaceHigh
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA in Minmus orbit and transmit an EVA report
        rewardFunds    = @/step_evaOrbit
        rewardReputation = 5
    }

    PARAMETER
    {
        name       = LandOnMinmus
        type       = ReachState
        disableOnStateChange = True
        targetBody = Minmus
        situation  = LANDED
        title      = Land on the Minmus surface
        rewardFunds = @/step_land
        rewardReputation = 8
    }

    PARAMETER
    {
        name           = SurfaceEVA
        type           = CollectScience
        targetBody     = Minmus
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Conduct a surface EVA and transmit an EVA report
        rewardFunds    = @/step_evaSurf
        rewardReputation = 6
    }

    PARAMETER
    {
        name           = GreaterFlatsScience
        type           = CollectScience
        targetBody     = Minmus
        biome          = Greater Flats
        situation      = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title          = Collect surface science from the Greater Flats (Glassmonite deposit)
    }

    // The Glassmonite sample must be physically returned for lab analysis, by
    // the same vessel that brings the crew home. Grouping the sample recovery
    // and the vessel recovery in a VesselParameterGroup ties "return the crew"
    // to the actual mission vessel: an unrelated recovery can no longer complete
    // it, and the grouping removes the completeInSequence race that previously
    // left ReturnHome stuck.
    PARAMETER
    {
        name  = MinmusReturn
        type  = VesselParameterGroup
        title = Return the Minmus mission vessel — with its Glassmonite sample and crew — to Kerbin

        PARAMETER
        {
            name           = GlassmoniteSample
            type           = CollectScience
            targetBody     = Minmus
            biome          = Greater Flats
            situation      = SrfLanded
            experiment     = surfaceSample
            recoveryMethod = Recover
            title          = Return a surface sample from the Greater Flats to Kerbin (the Glassmonite sample)
        }

        PARAMETER
        {
            name             = ReturnHome
            type             = RecoverVessel
            title            = Return the crew safely to Kerbin
            rewardFunds      = @/step_return
            rewardReputation = 5
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Glassmonite confirmed
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The sample confirms everything. The crystal structure is unlike any known mineral — a stable, high-energy lattice that breaks down under controlled thermal conditions to release a propellant gas with extraordinary specific impulse. I have run the numbers four times. A Prismatic Gel engine would produce a specific impulse of approximately thirty-five hundred seconds in vacuum. With a Minmus-based production facility and orbital fuel depot, we could reach every body in the Kerbin system without a Kerbin launch window constraint. I am recommending we establish a permanent Minmus base immediately.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP03
        type         = CompleteContract
        contractType = KSP_03_MinmusProbe
        title        = Minmus Probe Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedKSP03b
        type         = CompleteContract
        contractType = KSP_03b_MinmusPracticeLanding
        title        = Minmus ice-cap practice must be complete
    }

    REQUIREMENT
    {
        name     = MinmusOrbitMapped
        type     = KASABodyDiscoveryStage
        body     = Minmus
        minStage = 2
        title    = Minmus orbital survey must be complete
    }

    REQUIREMENT
    {
        name     = MinmusResourceScanned
        type     = KASABodyDiscoveryStage
        body     = Minmus
        minStage = 3
        title    = Minmus resource scan must be complete
    }
}
