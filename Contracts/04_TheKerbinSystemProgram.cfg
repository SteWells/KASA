// ================================================================
// KASA — THE KERBIN SYSTEM PROGRAMME
// ================================================================
// KSP_01  Mun Probe     — SOI, orbit, 80% survey coverage, land
// KSP_02  Mun Crewed    — orbit, EVA, land, surface EVA, return
// KSP_03  Minmus Probe  — SOI, orbit, 80% survey coverage, land
// KSP_04  Minmus Crewed — orbit, EVA, land, surface EVA, return
//
// Body names used directly (Mun, Minmus) — no @/ references.
// Per-parameter rewards in PARAMETER blocks.
// EVA tracked via evaReport CollectScience.
// ================================================================


// ----------------------------------------------------------------
// KSP-01: MUN PROBE MISSION
// probeBase x3.0  Stock: 225,000 total
//   advance 45,000 | SOI 15,000 | orbit 15,000 | altimetry 25,000 |
//   biome 20,000 | resource 30,000 | land 30,000 | bonus 45,000
// Three SCANsat coverage parameters replace the single duration.
// ----------------------------------------------------------------
// KSP-01a: MUN RECON — the lo-res pass
// probeBase x1.0  (deliberately cheap — see DESIGN-006)
// Gates on DP-02. Advances Mun to stage 5 (SEEN) on lo-res VISUAL
// coverage. Cheap, early: we do not yet know if this rock is worth
// the cost of a real survey. Mortimer signed this one off gladly.
// NOTE: scan TYPES only, never part names — any part providing the
// SCANtype qualifies.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_01a_MunRecon
    group           = TheKerbinSystemProgram

    title           = Mun Programme: Reconnaissance Pass
    genericTitle    = Complete a low-resolution reconnaissance survey
    description     = We have a name and an orbit, and that is all. We do not know what its surface is made of, whether it has distinct regions, or whether there is anything down there worth the cost of a proper survey campaign.\n\nMortimer has approved a cheap reconnaissance probe on one condition: it answers the question "is this worth going back to?" before we spend anything serious. Carry a low-resolution altimetry instrument and a low-resolution imager. Bring back pictures.
    synopsis        = Enter the SOI, achieve a scanning orbit, and complete 80% lo-res altimetry, lo-res visual, and biome coverage.
    completedMessage = We have pictures. Not detailed ones, but for the first time we can see it rather than infer it. The imaging team have put the first frame on the wall of the briefing room.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x1.0 — recon is deliberately cheap
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 1.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 8.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 8.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        step_visual   = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        step_biome    = Round(@stepPool * 2.0 / 8.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 5
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry solar panels for long-duration operation
    }

    PARAMETER
    {
        name        = EnterMunSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Mun
        minAltitude = 1
        title       = Enter the sphere of influence
        rewardFunds = @/step_soi
        rewardReputation = 2
    }

    PARAMETER
    {
        name                 = OrbitMun
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Mun
        minAltitude          = 25000
        maxAltitude          = 500000
        title                = Achieve a stable scanning orbit
        rewardFunds          = @/step_orbit
        rewardReputation     = 2
    }

    PARAMETER
    {
        name        = AltimetryLoScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Mun
        title       = Achieve 80% LO-RES ALTIMETRY coverage
        rewardFunds = @/step_altim
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = VisualLoScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = VisualLoRes
        targetBody  = Mun
        title       = Achieve 80% LO-RES VISUAL coverage
        rewardFunds = @/step_visual
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Mun
        title       = Achieve 80% BIOME coverage
        rewardFunds = @/step_biome
        rewardReputation = 2
    }

    // Stage 5 = SEEN. Driven by the lo-res VISUAL scan only — appearance
    // changes only when we actually image the body (DESIGN-006).
    BEHAVIOUR
    {
        name      = RevealMunSeen
        type      = KASAAdvanceDiscovery
        body      = Mun
        stage     = 5
        parameter = VisualLoScan
    }

    REQUIREMENT
    {
        name         = CompletedDP02
        type         = CompleteContract
        contractType = DP_02_DetailedObservation
        title        = Detailed Observation Campaign must be complete
    }

    REQUIREMENT
    {
        name  = MunKnown
        type  = KASABodyDiscovered
        body  = Mun
        title = The body must be a known body
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_01_MunProbe
    group           = TheKerbinSystemProgram

    title           = Mun Programme: Uncrewed Exploration
    genericTitle    = Complete an uncrewed probe survey of the Mun
    description     = Before we send anyone to the Mun, we must know it properly. Three orbital scanning campaigns will build our complete picture of the surface: a radar altimetry pass for terrain mapping, a multispectral pass for biome identification, and a resource scanner pass to survey the subsurface composition.\n\nWernher has been particularly insistent about the resource scanner. He has not said why. The mission brief just says: "make sure the resource scanner achieves full coverage." The same brief also notes that once all three scans are complete, he would like to see the data before it is filed.
    synopsis        = Enter the Mun SOI. Achieve orbit. Complete 80% altimetry, biome, and resource scan coverage. Land a probe and return surface science.
    completedMessage = All three scans complete, probe landed. Wernher has the resource data. He has been in his office with the door closed for two hours.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x Mun.Multiplier() = 75,000 x 3.0 = 225,000
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 3.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_visual   = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource = Round(@stepPool * 2.5 / 10.0 / 5000) * 5000
        step_land     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 10
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry solar panels for long-duration operation
    }

    // Entering Mun SOI means the vessel must be in orbit around Mun
    PARAMETER
    {
        name        = EnterMunSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Mun
        minAltitude = 1
        title       = Enter the Mun's sphere of influence
        rewardFunds = @/step_soi
        rewardReputation = 2
    }

    PARAMETER
    {
        name                 = OrbitMun
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Mun
        minAltitude          = 25000
        maxAltitude          = 500000
        title                = Achieve a stable scanning orbit (25–500km)
        rewardFunds          = @/step_orbit
        rewardReputation     = 3
    }

    // The probe must carry a SCANsat lo-res altimetry scanner.
    // This is what actually builds the surface map during the orbital survey.
    PARAMETER
    {
        name        = AltimetryHiScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryHiRes
        targetBody  = Mun
        title       = Achieve 80% HI-RES ALTIMETRY coverage
        rewardFunds = @/step_altim
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = VisualHiScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = VisualHiRes
        targetBody  = Mun
        title       = Achieve 80% HI-RES VISUAL coverage
        rewardFunds = @/step_visual
        rewardReputation = 2
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Mun
        title       = Achieve 80% RESOURCE coverage
        rewardFunds = @/step_resource
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = LandOnMun
        type       = ReachState
        disableOnStateChange = True
        targetBody = Mun
        situation  = LANDED
        title      = Land an uncrewed probe on the Mun surface
        rewardFunds = @/step_land
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = TransmitSurface
        type           = CollectScience
        targetBody     = Mun
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Transmit surface science data to KASA
    }

    // Stage 6 = FULLY MAPPED. Driven by the HI-RES VISUAL scan — full
    // detail and Parallax terrain only once we have proper imagery.
    BEHAVIOUR
    {
        name      = RevealMunMapped
        type      = KASAAdvanceDiscovery
        body      = Mun
        stage     = 6
        parameter = VisualHiScan
    }

    // Mark Mun resource scan complete when resource coverage done
    BEHAVIOUR
    {
        name      = MarkMunResourceScanned
        type      = KASAResourceScanned
        body      = Mun
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource data
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The resource scanner has returned data I was not expecting. There is a substance in the Mun subsurface — concentrated in the Midlands and Lowlands — that does not match any known geological catalogue entry. I am calling it Regocite, provisionally. The distribution suggests it formed from compressed ancient regolith under specific thermal conditions. It may have significant structural applications. I want a physical sample. The crewed mission will need to bring one back.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedRecon
        type         = CompleteContract
        contractType = KSP_01a_MunRecon
        title        = The reconnaissance pass must be complete
    }

    REQUIREMENT
    {
        name  = MunKnown
        type  = KASABodyDiscovered
        body  = Mun
        title = The body must be a known body
    }

    REQUIREMENT
    {
        name  = ReachSpace
        type  = ReachSpace
        title = Must have reached space
    }
}


// ----------------------------------------------------------------
// KSP-01b: MUN PRACTICE LANDING (DESERT BIOME)
// earlyBase x1.0  Stock: ~50,000 total
// Gates on KSP_01 complete. Narrative: the Mun surface resembles
// Kerbin's desert terrain. Land in the Deserts biome to train the
// crew for Mun surface operations before we send anyone there.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_01b_MunPracticeLanding
    group           = TheKerbinSystemProgram

    title           = Mun Training: Desert Landing Practice
    genericTitle    = Practice Mun-analogue landings in the Kerbin Deserts
    description     = The resource scanner has confirmed what our geology teams suspected: the Mun surface composition closely resembles Kerbin's desert terrain. Low-albedo regolith, sparse surface features, hard ground with minimal cushioning. Before we put a crew on the Mun, we want them to have practised landing and operating on the closest terrain analogue we have.\n\nLand in the Deserts biome, conduct surface science, and perform an EVA report from the surface.
    synopsis        = Land in the Kerbin Deserts biome. Conduct surface science and an EVA report from the surface.
    completedMessage = Desert landing complete. The crew has the muscle memory now. Mun surface operations training signed off.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    advanceFunds      = 5000
    rewardFunds       = 15000
    rewardReputation  = 4
    failureReputation = 1
    failureFunds      = 0

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name       = DesertLanding1
        type       = ReachState
        targetBody = HomeWorld()
        situation  = LANDED
        biome      = Deserts
        disableOnStateChange = True
        title      = First desert landing
        rewardFunds = 4000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = DesertEVA1
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Deserts
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = EVA report from the first desert landing
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Training rationale
            condition = CONTRACT_ACCEPTED

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = The Mun surface is not hospitable. Hard ground, no atmosphere, surface gravity about one-sixth of Kerbin. The crew needs to be comfortable operating in an environment where the landing cushion is zero and every EVA is a committed action. The Deserts are the closest analogue we have. One landing, one EVA report from the surface, and we sign off on Mun surface readiness.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP01
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = Mun Probe Mission must be complete
    }
}


// ----------------------------------------------------------------
// KSP-02: MUN CREWED MISSION
// crewedBase x3.0  Stock: 450,000 total
//   advance 90,000 | orbit 25,000 | EVA-orbit 55,000 | land 80,000 |
//   surface-EVA 80,000 | return 30,000 | bonus 90,000
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KSP_02_MunCrewed
    group           = TheKerbinSystemProgram

    title           = Mun Programme: Crewed Landing Mission
    genericTitle    = Land Kerbals on the Mun and return safely
    description     = The probes have done their job. The Mun is mapped. A probe sits on its surface. And the resource scanner has returned something unexpected — a subsurface material concentrated in the Midlands that Wernher cannot classify. He is calling it Regocite. He says he needs a physical sample before he can tell us what it actually is.\n\nThe crewed mission has two objectives: put Kerbals on the Mun, and bring back a Regocite sample from the Midlands. Everything else is secondary.
    synopsis        = Fly a crewed mission to the Mun. Achieve orbit, EVA, land in the Midlands, recover a surface sample and return to Kerbin.
    completedMessage = They walked on the Mun and came home. And they brought Wernher his sample. He has not slept since.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // crewedBase x Mun.Multiplier() = 150,000 x 3.0 = 450,000
        contractTotal = Round(Round(HomeWorld().Radius() / 20000.0) * 5000 * 3.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_evaOrbit = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_land     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_evaSurf  = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_return   = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 25
    failureReputation = 12
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name        = OrbitMun
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Mun
        minAltitude = 10000
        title       = Achieve stable orbit of the Mun
        rewardFunds = @/step_orbit
        rewardReputation = 4
    }

    // EVA in Mun orbit — tracked via EVA report
    PARAMETER
    {
        name           = EVAInOrbit
        type           = CollectScience
        targetBody     = Mun
        situation      = InSpaceHigh
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA in Mun orbit and transmit an EVA report
        rewardFunds    = @/step_evaOrbit
        rewardReputation = 5
    }

    PARAMETER
    {
        name       = LandOnMun
        type       = ReachState
        disableOnStateChange = True
        targetBody = Mun
        situation  = LANDED
        title      = Land on the Mun surface
        rewardFunds = @/step_land
        rewardReputation = 8
    }

    // Surface EVA — tracked via surface EVA report
    PARAMETER
    {
        name           = SurfaceEVA
        type           = CollectScience
        targetBody     = Mun
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Conduct a surface EVA and transmit an EVA report
        rewardFunds    = @/step_evaSurf
        rewardReputation = 6
    }

    PARAMETER
    {
        name           = MidlandsScience
        type           = CollectScience
        targetBody     = Mun
        biome          = Midlands
        situation      = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title          = Collect surface science from the Midlands (Regocite sample location)
    }

    // The Regocite sample must be physically returned by the same vessel that
    // brings the crew home — it cannot be transmitted. Grouping the sample
    // recovery and the vessel recovery in a VesselParameterGroup ties "return
    // the crew" to the actual mission vessel: an unrelated recovery (e.g. a
    // tourist flight) can no longer complete it, and the grouping removes the
    // completeInSequence race that previously left ReturnHome stuck.
    PARAMETER
    {
        name  = MunReturn
        type  = VesselParameterGroup
        title = Return the Mun mission vessel — with its Regocite sample and crew — to Kerbin

        PARAMETER
        {
            name           = RegociteSample
            type           = CollectScience
            targetBody     = Mun
            biome          = Midlands
            situation      = SrfLanded
            experiment     = surfaceSample
            recoveryMethod = Recover
            title          = Return a surface sample from the Midlands to Kerbin (the Regocite sample)
        }

        PARAMETER
        {
            name             = ReturnHome
            type             = RecoverVessel
            title            = Return the crew safely to Kerbin
            rewardFunds      = @/step_return
            rewardReputation = 5
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Regocite sample
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = It is exactly what I thought it was. Compacted ancient regolith, thermally processed under early Mun formation conditions, with a crystalline matrix structure I have never seen in any terrestrial mineral. The compressive strength alone makes it extraordinarily useful as a construction aggregate. We could build with this. We could build a lot with this. I am going to recommend we establish a permanent extraction facility in the Midlands.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP01
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = Mun Probe Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedKSP01b
        type         = CompleteContract
        contractType = KSP_01b_MunPracticeLanding
        title        = Mun desert-landing practice must be complete
    }

    REQUIREMENT
    {
        name     = MunOrbitMapped
        type     = KASABodyDiscoveryStage
        body     = Mun
        minStage = 2
        title    = Mun orbital survey must be complete
    }

    REQUIREMENT
    {
        name  = MunResourceScanned
        type  = KASABodyDiscoveryStage
        body  = Mun
        minStage = 3
        title = Mun resource scan must be complete
    }
}


// ----------------------------------------------------------------
// KSP-03: MINMUS PROBE MISSION
// probeBase x4.0  Stock: 300,000 total
//   advance 60,000 | SOI 20,000 | orbit 15,000 | altimetry 35,000 |
//   biome 25,000 | resource 45,000 | land 40,000 | bonus 60,000
// Three SCANsat coverage parameters replace the single duration.
// ----------------------------------------------------------------
// KSP-03a: MINMUS RECON — the lo-res pass
// probeBase x1.5  (deliberately cheap — see DESIGN-006)
// Gates on DP-02. Advances Minmus to stage 5 (SEEN) on lo-res VISUAL
// coverage. Cheap, early: we do not yet know if this rock is worth
// the cost of a real survey. Mortimer signed this one off gladly.
// NOTE: scan TYPES only, never part names — any part providing the
// SCANtype qualifies.
// ----------------------------------------------------------------
