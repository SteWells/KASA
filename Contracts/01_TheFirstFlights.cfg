// ================================================================
// KASA — THE FIRST FLIGHTS
// ================================================================
// The story begins here. Four milestone contracts, each one
// advancing the mystery of what is orbiting Kerbin — a mystery
// that the player will spend the entire career unravelling.
//
// Narrative thread:
//   FF-01: pure engineering — prove the design works, nothing more
//   FF-02: the signal persists at 70km, coming from outside
//   FF-03: orbital mechanics don't add up — something is pulling
//   FF-04: the crew see two bright objects with their own eyes
//
// DialogBox behaviours fire at PARAMETER_COMPLETED, giving each
// mission a narrative coda that advances the mystery.
// ================================================================


// ----------------------------------------------------------------
// FF-01: FIRST ATMOSPHERIC FLIGHT
// earlyBase x1.0  Stock: 50,000 total
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = FF_01_AtmosphericFlight
    group           = TheFirstFlights

    title           = First Flight: Reach the Upper Atmosphere
    genericTitle    = Reach the upper atmosphere and return safely
    description     = Our engineers have finished the first prototype parts capable of reaching significant altitude. The objective is straightforward: get something to 18 kilometres, demonstrate controlled flight, and bring it home in one piece.\n\nNo instruments. No experiments. No expectations beyond proving the design works. If it goes up and comes back, we have done our job.
    synopsis        = Reach 18,000m altitude over Kerbin and recover the vessel.
    completedMessage = A clean first flight. Engineering is satisfied. The design works. Now let us see what we can do with a bit more ambition.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    minExpiry = 1
    maxExpiry = 365

    DATA
    {
        type = double
        contractTotal = Round(HomeWorld().Radius() / 60000.0) * 5000 + 25000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_altitude = Round(@stepPool * 2.0 / 3.0 / 5000) * 5000
        step_recovery = Round(@stepPool * 1.0 / 3.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 3
    failureReputation = 1
    failureFunds      = 0

    PARAMETER
    {
        name                 = ReachUpperAtmosphere
        type                 = ReachState
        targetBody           = HomeWorld()
        minAltitude          = 18000
        disableOnStateChange = True
        title                = Reach 18,000m altitude
        rewardFunds          = @/step_altitude
        rewardReputation     = 1
    }

    PARAMETER
    {
        name        = RecoverVessel
        type        = RecoverVessel
        completeInSequence = true
        title       = Recover the vessel safely
        rewardFunds = @/step_recovery
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Altitude confirmed
            condition = PARAMETER_COMPLETED
            parameter = ReachUpperAtmosphere

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_thumbUp
            }

            TEXT
            {
                text = Eighteen kilometres. The vehicle is performing exactly as designed. Bring it home safely and we will call this one a complete success.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = First flight complete
            condition = PARAMETER_COMPLETED
            parameter = RecoverVessel

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_nodB
            }

            TEXT
            {
                text = Clean flight, clean recovery. The vehicle performed exactly as designed. Now that we know it works, let us talk about what we could carry on the next one.
            }
        }
    }
}


// ----------------------------------------------------------------
// FF-02: FIRST SUBORBITAL FLIGHT
// earlyBase x1.5  Stock: 75,000 total
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = FF_02_SuborbitalFlight
    group           = TheFirstFlights

    title           = First Steps to Space: Suborbital Flight
    genericTitle    = Reach space on a suborbital trajectory
    description     = We can reach 18 kilometres and come home. Now let us reach space itself — 70 kilometres — and do something useful while we are there.\n\nOur science team has requested we carry a GRAVMAX Negative Gravioli Detector. It is a standard gravitational survey instrument. They want a baseline reading from the edge of space before we begin orbital operations. Include one in the payload, reach 70km, transmit the data, and bring the vessel home safely.
    synopsis        = Reach 70,000m carrying a GRAVMAX Negative Gravioli Detector. Transmit the gravitational data. Recover the vessel.
    completedMessage = We have reached space. And the GRAVMAX data has given Wernher something to think about.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    minExpiry = 1
    maxExpiry = 365

    DATA
    {
        type = double
        // earlyBase x1.5 — slightly higher because it now carries an instrument
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 1.5 / 5000) * 5000 + 25000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        // Weights: altitude (2), transmit data (1) — total 3
        // Recovery has no separate reward (vessel must come back, no bonus for it)
        step_space    = Round(@stepPool * 2.0 / 3.0 / 5000) * 5000
        step_recovery = Round(@stepPool * 1.0 / 3.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 5
    failureReputation = 2
    failureFunds      = 0

    // Must carry a GRAVMAX — the instrument that will first detect the anomaly
    PARAMETER
    {
        name     = HasGravmax
        type     = PartValidation
        part     = sensorGravimeter
        minCount = 1
        title    = The vessel must carry a GRAVMAX Negative Gravioli Detector
    }

    PARAMETER
    {
        name                 = ReachSpace
        type                 = ReachState
        targetBody           = HomeWorld()
        minAltitude          = 70000
        disableOnStateChange = True
        title                = Reach 70,000m — the boundary of space
        rewardFunds          = @/step_space
        rewardReputation     = 2
    }

    PARAMETER
    {
        name           = TransmitGravData
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceLow
        experiment     = gravityScan
        recoveryMethod = Transmit
        title          = Transmit GRAVMAX gravitational scan data
        rewardFunds    = @/step_recovery
        rewardReputation = 1
    }

    PARAMETER
    {
        name        = RecoverVessel
        type        = RecoverVessel
        completeInSequence = true
        title       = Recover the vessel safely
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Anomalous readings
            condition = PARAMETER_COMPLETED
            parameter = TransmitGravData

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = false_disagreeC
            }

            TEXT
            {
                text = I have the GRAVMAX data from 70 kilometres. I have been through it twice. The gravitational readings do not match our models. There is a residual signal — faint, but consistent — that we cannot account for with Kerbin's gravity alone. Something else is out there. Something with mass. I need orbital data before I will say more.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Anomalous readings
            condition = PARAMETER_COMPLETED
            parameter = RecoverVessel

            INSTRUCTOR
            {
                name      = Strategy_Mortimer
                animation = false_disappointed
            }

            TEXT
            {
                text = Something else is out there? Do I want to know how much finding it is going to cost?
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF01
        type         = CompleteContract
        contractType = FF_01_AtmosphericFlight
        title        = First Atmospheric Flight must be complete
    }
}


// ----------------------------------------------------------------
// FF-03: FIRST UNCREWED ORBITAL MISSION
// earlyBase x2.0  Stock: 100,000 total
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = FF_03_FirstOrbit
    group           = TheFirstFlights

    title           = First Orbit: An Uncrewed Sentinel
    genericTitle    = Achieve stable orbit of Kerbin with a probe
    description     = The GRAVMAX data from 70 kilometres was anomalous. Wernher believes the only way to get a definitive answer is to place an instrument in stable orbit and let it run as it circles Kerbin. An uncrewed probe will carry the GRAVMAX into orbit above 70km, transmit continuous gravitational data, and maintain its position for at least one full revolution.\n\nWernher has been working late. He will not say what he expects to find. He says the data will speak for itself.
    synopsis        = Launch an uncrewed probe to stable orbit above 70km. Transmit data. Complete one full orbit. Return safely.
    completedMessage = The orbital data is in. Wernher looks like a man who has just confirmed something he was not entirely sure he wanted to confirm.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    minExpiry = 1
    maxExpiry = 365

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.0 / 5000) * 5000 + 50000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        // Weights: orbit(3), data(1), one-orbit duration(1), recovery(1) = 6
        step_orbit    = Round(@stepPool * 3.0 / 6.0 / 5000) * 5000
        step_data     = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        step_duration = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        step_recovery = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 8
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 70000
        disableOnStateChange = True
        title                = Achieve stable orbit above 70km
        rewardFunds          = @/step_orbit
        rewardReputation     = 3
    }

    PARAMETER
    {
        name           = TransmitData
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit scientific data from orbit
        rewardFunds    = @/step_data
    }

    PARAMETER
    {
        name           = CompleteOneOrbit
        type           = Duration
        duration       = 30m
        preWaitText    = Waiting for stable orbit to begin the orbital timer.
        waitingText    = Completing one full orbit of Kerbin...
        completionText = One full orbit complete.
        startCriteria  = PARAMETER_COMPLETION
        parameter      = AchieveOrbit
        rewardFunds    = @/step_duration
        rewardReputation = 1
    }

    PARAMETER
    {
        name        = RecoverProbe
        type        = RecoverVessel
        completeInSequence = true
        title       = Return the probe safely to Kerbin
        rewardFunds = @/step_recovery
        rewardReputation = 1
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The data is in
            condition = PARAMETER_COMPLETED
            parameter = CompleteOneOrbit

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = Our trajectory calculations required correction factors we cannot account for with Kerbin's gravity alone. Something is pulling on the probe. The signal has a clear periodicity — whatever it is, it completes one orbit every several hours. And there is a second signal. A fainter one, with a longer period and a different inclination. Both in stable orbit around Kerbin. Both real.\n\nAnd there is a third reading I cannot place. Not an orbiting body — something fixed to the surface, roughly twelve kilometres north of the KSC, that the GRAVMAX flags on every pass. Too localised, too regular to be a mass concentration. I do not know what it is. I am setting it aside for now. But I am not forgetting it.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Two objects
            condition = PARAMETER_COMPLETED
            parameter = RecoverVessel

            INSTRUCTOR
            {
                name      = Strategy_Mortimer
                animation = false_disappointed
            }

            TEXT
            {
                text = Two of them? Does this mean we have to fly twice as many missions? I am going to need a much larger budget.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF02
        type         = CompleteContract
        contractType = FF_02_SuborbitalFlight
        title        = First Suborbital Flight must be complete
    }
}


// ----------------------------------------------------------------
// FF-04: FIRST CREWED ORBITAL MISSION
// earlyBase x4.0  Stock: 200,000 total
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = FF_04_FirstCrewedOrbit
    group           = TheFirstFlights

    title           = First Crewed Orbit: A Kerbal Circles the World
    genericTitle    = Send a kerbal to orbit and return safely
    description     = Our probe has shown the way is safe. Now it is time to send one of our own. The mission objectives are clear: orbit, EVA, return safely.\n\nJebediah Kerman will be aboard. We considered selecting someone more cautious. But Jebediah has been in Wernher's office four times this week asking about Objects A and B. His words. Nobody told him about the objects.
    synopsis        = Achieve orbit with a crewed vessel above 70km. Perform an EVA and transmit an EVA report. Return the crew safely.
    completedMessage = They are home. And Jebediah has filed his first ever formal report.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    minExpiry = 1
    maxExpiry = 365

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 2.0 / 6.0 / 5000) * 5000
        step_eva      = Round(@stepPool * 3.0 / 6.0 / 5000) * 5000
        step_recovery = Round(@stepPool * 1.0 / 6.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    failureReputation = 8
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 70000
        disableOnStateChange = True
        title                = Achieve stable orbit above 70km
        rewardFunds          = @/step_orbit
        rewardReputation     = 4
    }

    PARAMETER
    {
        name           = DoEVA
        type           = CollectScience
        targetBody     = HomeWorld()
        situation      = InSpaceLow
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA and transmit an EVA report
        rewardFunds    = @/step_eva
        rewardReputation = 6
    }

    PARAMETER
    {
        name        = RecoverCrew
        type        = RecoverVessel
        completeInSequence = true
        title       = Return the crew safely to Kerbin
        rewardFunds = @/step_recovery
        rewardReputation = 3
    }

    BEHAVIOUR
    {
        name  = RevealMunPresence
        type  = KASAAdvanceDiscovery
        body  = Mun
        stage = presence
    }

    BEHAVIOUR
    {
        name  = RevealMinmusPresence
        type  = KASAAdvanceDiscovery
        body  = Minmus
        stage = presence
    }

    // Jeb's report — two dialog boxes for a conversation effect
    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Jebediah's report
            condition = PARAMETER_COMPLETED
            parameter = RecoverCrew

            KERBAL
            {
                characterName = Jebediah Kerman
            }

            TEXT
            {
                text = I saw them. Both of them. One was bright — really bright, like a moving star. I watched it cross the whole sky in about forty minutes. The other one was fainter and higher up, moving slower, more of an angle to it. Gene wants me to write a formal report. I have never written a formal report in my life but I will do it this once because those things were real and they were RIGHT THERE and I want to go and find out what they are.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Jebediah's report
            condition = PARAMETER_COMPLETED
            parameter = RecoverCrew

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_nodB
            }

            TEXT
            {
                text = Jebediah's report — which is, true to his word, his first — has been added to the growing file. Dr. von Kerman now has enough data to be confident: two bodies, stable orbits, significant mass. The science team has started a naming competition. Wernher disapproves. We are proceeding with the Discovery Programme.\n\nAnd Dr. von Kerman has formally logged the fixed surface anomaly the orbital survey flagged, twelve kilometres north of the KSC. He wants boots on it.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF03
        type         = CompleteContract
        contractType = FF_03_FirstOrbit
        title        = First Uncrewed Orbital Mission must be complete
    }

    REQUIREMENT
    {
        name       = Orbit
        type       = Orbit
        targetBody = HomeWorld()
        title      = Must have achieved orbit of Kerbin
    }
}
