    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = A foothold at the sun's doorstep
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The outpost is crewed and holding station over Moho. Between the surface base and this platform, we now have a self-sustaining presence at the closest world to the sun — extracting Moherium, staging it, and rotating crew without a constant lifeline from Kerbin. A few years ago we did not even know this world was here. Now we live here.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedIP05
        type         = CompleteContract
        contractType = IP_05_Base
        title        = Moho extraction base must be operational
    }

    REQUIREMENT
    {
