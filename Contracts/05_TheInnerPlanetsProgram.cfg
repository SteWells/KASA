{
    name            = IP_02_Probe
    group           = TheInnerPlanetsProgram

    title           = Inner Planets: Probe to Object S-II
    genericTitle    = Send a survey probe to the second Sentinel-detected body
    genericDescription = Send an uncrewed probe to the second Sentinel object, survey it from orbit, resolve its identity, and map its subsurface resources.
    description     = The Sentinel has flagged a second body — Object S-II — and this one is not subtle. Where the first object was a dark speck, this is a large world wrapped in a thick, hazy atmosphere that scatters the light violet. The orbital analysis puts it as the second world out from the sun, dense and deep-welled. We are cataloguing it as Object S-II.\n\nSend a survey probe. Reach it, settle into a high scanning orbit above the atmosphere, and run the full suite: altimetry, biome, and a resource pass. Do not attempt a landing — that atmosphere is a trap, and we want the probe alive and transmitting. Once the data is in, the science team can name it and tell us what it is made of.
    synopsis        = Send an uncrewed probe to Object S-II. Achieve a stable orbit above the atmosphere and complete 80% altimetry, biome, and resource coverage.
    completedMessage = Survey complete. Object S-II resolves as a vast violet ocean world under a crushing atmosphere — and the archives have a name waiting for it. Welcome to the map, Eve.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Eve
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x 8.0 deep-space multiplier (FLAGGED — balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_biome    = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource = Round(@stepPool * 2.5 / 10.0 / 5000) * 5000
        step_science  = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 18
    failureReputation = 8
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    PARAMETER
    {
        name        = EnterEveSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Eve
        minAltitude = 1
        title       = Enter the sphere of influence of Object S-II
        rewardFunds = @/step_soi
        rewardReputation = 3
    }

    PARAMETER
    {
        name                 = OrbitEve
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Eve
        minAltitude          = 100000
        maxAltitude          = 2000000
        title                = Achieve a stable scanning orbit above the atmosphere (100km–2000km)
        rewardFunds          = @/step_orbit
        rewardReputation     = 4
    }

    PARAMETER
    {
        name        = AltimetryScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Eve
        title       = Achieve 80% lo-res altimetry coverage of Object S-II
        rewardFunds = @/step_altim
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Eve
        title       = Achieve 80% biome scan coverage of Object S-II
        rewardFunds = @/step_biome
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Eve
        title       = Achieve 80% resource scan coverage of Object S-II
        rewardFunds = @/step_resource
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = ObservationScience
        type           = CollectScience
        targetBody     = Eve
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit science from low orbit of Object S-II
        rewardFunds    = @/step_science
        rewardReputation = 4
    }

    // Resolve the body: stage 4 (observation) reveals its real name.
    BEHAVIOUR
    {
        name  = RevealEveObservation
        type  = KASAAdvanceDiscovery
        body  = Eve
        stage = observation
    }

    // Altimetry scan -> stage 5, biome scan -> stage 6 (full detail).
    BEHAVIOUR
    {
        name      = RevealEveAltimetry
        type      = KASAAdvanceDiscovery
        body      = Eve
        stage     = altimetry
        parameter = AltimetryScan
    }

    BEHAVIOUR
    {
        name      = RevealEveBiome
        type      = KASAAdvanceDiscovery
        body      = Eve
        stage     = biome
        parameter = BiomeScan
    }

    // 80% resource coverage reveals Evonite and unlocks its drill.
    BEHAVIOUR
    {
        name      = MarkEveResourceScanned
        type      = KASAResourceScanned
        body      = Eve
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource data
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The resource pass came back with a hit — a compound in the lowlands and beneath the explodium sea, unlike anything in the catalogue. I am calling it Evonite. Before anyone gets excited: it sits at the bottom of the deepest gravity well we have ever surveyed, and nothing in its chemistry suggests it is worth the climb back out. File it as a curiosity. If we ever want it, it will cost us far more than it could ever give back.
            }
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Object S-II resolved
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The survey is unambiguous. An enormous world drowned in violet ocean, wrapped in an atmosphere so thick and heavy that landing on it and leaving again may be beyond us for a long time. It matches the archive designation: Eve. Our second inner planet, and a warning about the ones still out there.
            }
        }
    }

    REQUIREMENT
    {
        name     = EveDetected
        type     = KASABodyDiscoveryStage
        body     = Eve
        minStage = 1
        title    = The Sentinel must have detected this body
    }
}


// ----------------------------------------------------------------
// IP-03: CREWED LANDING ON MOHO
// crewedBase x8.0 — reward scale FLAGGED, balance TBC
//   orbit 1 | evaOrbit 2 | land 3 | evaSurf 3 | return 1 (of stepPool)
// Airless and returnable: full landing + Moherium sample return,
// which sets up the Moho extraction base (Moherium -> ThermicMix).
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = IP_03_Crewed
    group           = TheInnerPlanetsProgram

    title           = Inner Planets: Crewed Landing on Moho
    genericTitle    = Land Kerbals on Moho and return them safely
    genericDescription = Fly a crewed mission to Moho, land, recover a Moherium sample, and return the crew to Kerbin.
    description     = Moho is mapped, named, and the probe has confirmed Moherium concentrated in the lowlands. Now we go in person.\n\nThis is the hardest crewed target we have ever attempted — Moho sits so deep in the sun's gravity well that reaching it costs more delta-V than anything before it. But it is airless, so once you arrive, landing and lifting off again are honest, familiar problems. Put Kerbals on the surface, recover a Moherium sample from the lowlands, and bring the crew home. Wernher wants that sample in his hands.
    synopsis        = Fly a crewed mission to Moho. Achieve orbit, EVA, land in the Central Lowlands, recover a Moherium sample and return to Kerbin.
    completedMessage = Kerbals have stood on the closest world to the sun — and come home again, with Wernher's Moherium sample. The inner system is within reach.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Moho
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // crewedBase x 8.0 deep-space multiplier (FLAGGED — balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 20000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_evaOrbit = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_land     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_evaSurf  = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_return   = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 30
    failureReputation = 14
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name        = OrbitMoho
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Moho
        minAltitude = 20000
        title       = Achieve a stable orbit of Moho
        rewardFunds = @/step_orbit
        rewardReputation = 5
    }

    PARAMETER
    {
        name           = EVAInOrbit
        type           = CollectScience
        targetBody     = Moho
        situation      = InSpaceHigh
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA in Moho orbit and transmit an EVA report
        rewardFunds    = @/step_evaOrbit
        rewardReputation = 6
    }

    PARAMETER
    {
        name       = LandOnMoho
        type       = ReachState
        disableOnStateChange = True
        targetBody = Moho
        situation  = LANDED
        title      = Land on the Moho surface
        rewardFunds = @/step_land
        rewardReputation = 10
    }

    PARAMETER
    {
        name           = SurfaceEVA
        type           = CollectScience
        targetBody     = Moho
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Conduct a surface EVA and transmit an EVA report
        rewardFunds    = @/step_evaSurf
        rewardReputation = 8
    }

    PARAMETER
    {
        name           = LowlandsScience
        type           = CollectScience
        targetBody     = Moho
        biome          = Central Lowlands
        situation      = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title          = Collect surface science from the Central Lowlands (Moherium sample location)
    }

    // The Moherium sample must be physically returned by the crew vessel —
    // it cannot be transmitted. Grouped with the crew recovery so an
    // unrelated recovery cannot complete it.
    PARAMETER
    {
        name  = MohoReturn
        type  = VesselParameterGroup
        title = Return the Moho mission vessel — with its Moherium sample and crew — to Kerbin

        PARAMETER
        {
            name           = MoheriumSample
            type           = CollectScience
            targetBody     = Moho
            biome          = Central Lowlands
            situation      = SrfLanded
            experiment     = surfaceSample
            recoveryMethod = Recover
            title          = Return a surface sample from the Central Lowlands to Kerbin (the Moherium sample)
        }

        PARAMETER
        {
            name             = ReturnHome
            type             = RecoverVessel
            title            = Return the crew safely to Kerbin
            rewardFunds      = @/step_return
            rewardReputation = 6
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Moherium sample
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The sample confirms it. Moherium is a heat-forged metallic compound — it only forms under the thermal extremes this close to the sun, and it holds an enormous amount of energy in a remarkably stable lattice. Run it through a converter and it yields a dense reaction mass we can burn in the deep-space engines. The lowlands deposits are rich enough to justify a permanent extraction base. I am recommending we build one.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedIP01
        type         = CompleteContract
        contractType = IP_01_Probe
        title        = Moho Probe Survey must be complete
    }

    REQUIREMENT
    {
        name     = MohoResolved
        type     = KASABodyDiscoveryStage
        body     = Moho
        minStage = 4
        title    = Moho must be surveyed and resolved (IP-01 complete)
    }
}


