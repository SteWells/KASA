// ================================================================
// KASA — THE INNER PLANETS PROGRAMME   (DESIGN-002 implementation)
// ================================================================
// Two-phase exploration of Sentinel-detected bodies:
//
//   1. Detection (plugin, automatic): the Sentinel logs a transit
//      event and sets the body to discovery stage 1 — an "Unknown
//      Object" grey blob. No name, no contract yet. See the message
//      in KASADiscovery.cs (UpdateSentinelTimers).
//
//   2. Exploration (this file): once a body is at stage >= 1, an
//      exploration contract is offered. The narrative carries the
//      analysis beat ("we have worked out the orbit, we are calling
//      it [designation]"); the player sends a probe; and on completion
//      a KASAAdvanceDiscovery behaviour advances the body to stage 4
//      (observation) — its real name resolves in the tracking station.
//
// No new plugin bridge is needed: the gate is the existing
// KASABodyDiscoveryStage requirement (minStage = 1). The detection
// timer (5–180 days, scaled by SMA) already supplies the elapsed time
// for the "analysis beat", so the contract is offered as soon as the
// body reaches stage 1 and the narrative frames the wait.
//
// SCOPE: implements Moho (IP-01) and Eve (IP-02). NOTE a structural
// divergence pending sign-off: IP-01 is a LEAN name-resolve probe
// (orbit + science, no scans, no resource reveal); IP-02 is a
// COMPREHENSIVE survey (full altimetry/biome/resource suite that also
// reveals the body's resource + unlocks its drill, Mun-style). The
// intent is for all inner planets to use the comprehensive form so
// each contract doubles as its resource reveal — which means IP-01
// (Moho) should be upgraded to add its scan suite + Moherium reveal.
// Remaining Sentinel targets (Duna, Dres, Jool, Eeloo) still to write.
//
// DESIGN CHOICES MADE HERE (all provisional, flagged for review):
//   * Provisional designation scheme: bodies are referred to by a
//     Sentinel catalogue code until stage 4 resolves the real name.
//     Moho = "Object S-I".
//   * Reward multiplier 8.0 (vs Mun probe 3.0) — balance placeholder.
//   * Objectives: SOI -> orbit -> orbital science (advances to stage 4,
//     "named"). Deeper characterisation (altimetry/biome -> stage 5/6)
//     is left for a possible follow-up survey contract.
// ----------------------------------------------------------------


// ----------------------------------------------------------------
// IP-01: PROBE TO OBJECT S-I  (Moho)
// probeBase x8.0  — reward scale FLAGGED, balance TBC
//   advance 20% | SOI 18% | orbit 24% | science 18% | bonus 20%
// Gates on Moho stage >= 1 (Sentinel detection).
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = IP_01_Probe
    group           = TheInnerPlanetsProgram

    title           = Inner Planets: Probe to Object S-I
    genericTitle    = Send a probe to the first Sentinel-detected body
    genericDescription = Send an uncrewed probe to the inner Sentinel object, achieve orbit, and resolve its identity.
    description     = The Sentinel logged a transit event weeks ago — an uncharted body on a tight, fast orbit close to the sun. The team has spent the time since working the orbital data, and we now have it pinned down: a small, dense world, the innermost object in the system. We are cataloguing it as Object S-I until we get a proper look at it.\n\nSend a survey probe. Reach the object, settle into a scanning orbit, and run the full suite — altimetry, biome, and a resource pass — then transmit science from up close. Once we have direct observation data, the science team can finally tell us what we are looking at, and what it is made of.
    synopsis        = Send an uncrewed probe to Object S-I. Achieve a scanning orbit and complete 80% altimetry, biome, and resource coverage.
    completedMessage = Direct observation resolves Object S-I as a small, dark, heavily cratered world — and the science team has formally catalogued it. Welcome to the map, Moho.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Moho
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // probeBase x 8.0 deep-space multiplier (FLAGGED — balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi      = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit    = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_altim    = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_biome    = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource = Round(@stepPool * 2.5 / 10.0 / 5000) * 5000
        step_science  = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 18
    failureReputation = 8
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    // Entering Object S-I's SOI means the vessel must be orbiting it.
    PARAMETER
    {
        name        = EnterMohoSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Moho
        minAltitude = 1
        title       = Enter the sphere of influence of Object S-I
        rewardFunds = @/step_soi
        rewardReputation = 3
    }

    PARAMETER
    {
        name                 = OrbitMoho
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Moho
        minAltitude          = 20000
        maxAltitude          = 500000
        title                = Achieve a stable scanning orbit of Object S-I (20–500km)
        rewardFunds          = @/step_orbit
        rewardReputation     = 4
    }

    PARAMETER
    {
        name        = AltimetryScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Moho
        title       = Achieve 80% lo-res altimetry coverage of Object S-I
        rewardFunds = @/step_altim
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Moho
        title       = Achieve 80% biome scan coverage of Object S-I
        rewardFunds = @/step_biome
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Moho
        title       = Achieve 80% resource scan coverage of Object S-I
        rewardFunds = @/step_resource
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = ObservationScience
        type           = CollectScience
        targetBody     = Moho
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit science from low orbit of Object S-I
        rewardFunds    = @/step_science
        rewardReputation = 4
    }

    // On completion, resolve the body: stage 4 (observation) reveals its
    // real name in the tracking station.
    BEHAVIOUR
    {
        name  = RevealMohoObservation
        type  = KASAAdvanceDiscovery
        body  = Moho
        stage = observation
    }

    // Altimetry scan -> stage 5, biome scan -> stage 6 (full detail).
    BEHAVIOUR
    {
        name      = RevealMohoAltimetry
        type      = KASAAdvanceDiscovery
        body      = Moho
        stage     = altimetry
        parameter = AltimetryScan
    }

    BEHAVIOUR
    {
        name      = RevealMohoBiome
        type      = KASAAdvanceDiscovery
        body      = Moho
        stage     = biome
        parameter = BiomeScan
    }

    // 80% resource coverage reveals Moherium and unlocks its drill.
    BEHAVIOUR
    {
        name      = MarkMohoResourceScanned
        type      = KASAResourceScanned
        body      = Moho
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource data
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The resource pass has flagged something in the subsurface — concentrated in the lowlands, dense and heat-fused in a way that only makes sense this close to the sun. It matches nothing in the catalogue. I am calling it Moherium. If we can reach it and pull it out, it will be worth the trip. File the distribution.
            }
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Object S-I resolved
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The probe data is unambiguous. A small, dense, airless world — baked on the sunward side, frozen on the other, orbiting closer to the sun than anything else we have found. It matches the old designation in the archive star charts: Moho. We have our first inner planet. The team is already asking what else the Sentinel has flagged out there.
            }
        }
    }

    REQUIREMENT
    {
        name     = MohoDetected
        type     = KASABodyDiscoveryStage
        body     = Moho
        minStage = 1
        title    = The Sentinel must have detected this body
    }
}


// ----------------------------------------------------------------
