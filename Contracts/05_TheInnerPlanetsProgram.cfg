// probeBase x8.0  — reward scale FLAGGED, balance TBC
//   advance 20% | soi 1 | orbit 1.5 | altim 2 | biome 1.5 |
//   resource 2.5 | science 1.5  (of stepPool) | bonus 20%
// Gates on Eve stage >= 1 (Sentinel detection).
// Comprehensive survey: resolves the name AND reveals Evonite +
// unlocks its drill via the 80% resource scan (KASAResourceScanned).
// No landing objective — Eve's atmosphere is a one-way trip.
// ----------------------------------------------------------------
