    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Eve
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // crewedBase x 8.0 deep-space multiplier (FLAGGED — balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 20000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 4.0 / 10.0 / 5000) * 5000
        step_evaOrbit = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_return   = Round(@stepPool * 4.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 30
    failureReputation = 14
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name        = OrbitEve
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Eve
        minAltitude = 100000
        title       = Achieve a stable orbit of Eve
        rewardFunds = @/step_orbit
        rewardReputation = 8
    }

    PARAMETER
    {
        name           = EVAInOrbit
        type           = CollectScience
        targetBody     = Eve
        situation      = InSpaceHigh
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA in Eve orbit and transmit an EVA report
        rewardFunds    = @/step_evaOrbit
        rewardReputation = 6
    }

    PARAMETER
    {
        name  = EveReturn
        type  = VesselParameterGroup
        title = Return the Eve mission vessel and its crew to Kerbin

        PARAMETER
        {
            name             = ReturnHome
            type             = RecoverVessel
            title            = Return the crew safely to Kerbin
            rewardFunds      = @/step_return
            rewardReputation = 8
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = A world best admired from orbit
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = We have orbited Eve and returned a crew alive — and I want that on the record as one of the hardest things this agency has done. As for the surface: the resource pass found Evonite down there, but between the gravity well and the fact that the substance does nothing useful, I see no reason to ever go down for it. Eve is a world we visit, photograph, and leave. Some places are worth more as a warning than as a destination.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedIP02
        type         = CompleteContract
        contractType = IP_02_Probe
        title        = Eve Probe Survey must be complete
    }

    REQUIREMENT
    {
        name     = EveResolved
        type     = KASABodyDiscoveryStage
        body     = Eve
        minStage = 4
        title    = Eve must be surveyed and resolved (IP-02 complete)
    }
}


// ----------------------------------------------------------------
// IP-05: MOHO LOWLANDS EXTRACTION BASE
// baseBase x8.0 — reward scale FLAGGED, balance TBC
//   land 2 | crew 2 | produce 6 (of stepPool)
// Gated on IP-03 (crewed sample) + Moho resource scan. Moherium is
// useful (-> ThermicMix), so unlike Eve this loop is worth building.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = IP_05_Base
    group           = TheInnerPlanetsProgram

    title           = Inner Planets: Moho Lowlands Extraction Base
    genericTitle    = Establish a Moherium extraction base in the Moho lowlands
    genericDescription = Establish a staffed surface base in the Moho Central Lowlands to extract Moherium at scale.
    description     = The Moherium sample checked out: dense, energy-rich, and convertible into deep-space reaction mass. The Central Lowlands deposit is extensive, and we have already landed crew there once. Now we do it permanently.\n\nEstablish a staffed base in the Moho Central Lowlands with drilling and bulk storage. Extract 500 units of Moherium straight from the surface to prove the chain works at Moho's gravity and thermal extremes. Once we have the first batch in storage, we will commission an orbital station to support the operation.
    synopsis        = Establish a staffed surface base in the Moho Central Lowlands. Extract and store 500 units of Moherium.
    completedMessage = Moho base operational. First Moherium batch in storage. The orbital station contract is now available.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Moho
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // baseBase x 8.0 deep-space multiplier (FLAGGED — balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 12000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_land     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_produce  = Round(@stepPool * 6.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 22
    failureReputation = 8
    failureFunds      = 0

    PARAMETER
    {
        name       = BaseLanded
        type       = ReachState
        targetBody = Moho
        situation  = LANDED
        biome      = Central Lowlands
        disableOnStateChange = True
        title      = Land the base in the Moho Central Lowlands (Moherium concentration zone)
        rewardFunds = @/step_land
        rewardReputation = 4
    }

    PARAMETER
    {
        name       = HasDrills
        type       = PartValidation
        partModule = ModuleResourceHarvester
        minCount   = 1
        title      = The base must include at least one drill
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The base must be staffed by at least 2 Kerbals
        rewardFunds = @/step_crew
        rewardReputation = 4
    }

    PARAMETER
    {
        name        = StoreMoherium
        type        = HasResource
        resource    = Moherium
        minQuantity = 500
        title       = Store at least 500 units of Moherium in the base
        rewardFunds = @/step_produce
        rewardReputation = 10
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = First Moherium batch
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = Five hundred units of Moherium, pulled from the closest surface to the sun and sitting in storage. Run through a converter it yields a dense, stable reaction mass — the kind of propellant that makes the outer system reachable rather than theoretical. This is the payoff for the whole inner-planets programme. We should commission an orbital station to support the base and stage the material.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedIP03
        type         = CompleteContract
        contractType = IP_03_Crewed
        title        = Moho Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedMunBase
        type         = CompleteContract
        contractType = BAS_M01_MunBase
        title        = Mun surface extraction base must be operational (extraction experience)
    }

    REQUIREMENT
    {
        name  = MohoResourceScanned
        type  = IsResourceScanned
        body  = Moho
        title = Moho resource scan must be complete
    }
}


