    description     = With the Moho base producing Moherium, the operation needs an anchor in orbit. This station is a straightforward outpost: a crew rotation hub for the surface base, a science platform, and bulk storage to stage Moherium off the surface for the return leg or on-site conversion.\n\nAt minimum: four crew berths, two docking ports, a science lab, bulk Moherium storage, and power for continuous operation. Establish it in a stable Moho orbit and keep it crewed through a shakedown period.
    synopsis        = Establish a crewed orbital outpost around Moho with 4 crew capacity, 2 docking ports, a lab, and Moherium storage. Keep it crewed for 30 days.
