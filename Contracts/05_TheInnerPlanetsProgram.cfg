        preWaitText    = Outpost must be crewed and in Moho orbit before the operational period begins.
        waitingText    = Moho outpost operational — crew running shakedown and base-support checkout...
        completionText = 30-day operational period complete. Moho outpost certified for continuous operation.
        rewardFunds    = @/step_duration
        rewardReputation = 8
