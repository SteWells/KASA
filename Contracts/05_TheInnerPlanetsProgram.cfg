    rewardReputation  = 20
    failureReputation = 6
    failureFunds      = 0

    PARAMETER
    {
        name       = StationOrbit
        type       = Orbit
        targetBody = Moho
        minAltitude = 20000
        maxAltitude = 500000
        disableOnStateChange = True
        title      = Establish the outpost in a stable Moho orbit (20–500km)
        rewardFunds = @/step_orbit
        rewardReputation = 4
    }

    PARAMETER
    {
        name       = HasCrew
