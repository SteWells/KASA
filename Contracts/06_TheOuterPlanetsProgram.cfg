// ================================================================
// KASA - THE OUTER PLANETS PROGRAMME
// ================================================================
// Bodies EXTERIOR to Kerbin, revealed by the outer survey (DP-04,
// direct imaging) rather than the Sentinel (transit, inner only).
// Moons are revealed on entering their parent's SOI.
//
// RESOURCE ROLES - each outer world unlocks a CAPABILITY:
//   Duna    Ferrosite -> Structural Feedstock  (build ships out here)
//   Ike     Kerium    -> Dense Oxidiser
//   Laythe  Laythite  -> Consumables           (cuts the Kerbin tether)
//   Eeloo   Elysium   -> Aetherium, endgame propellant (5000s Isp)
//   Dres / Jool / Vall / Tylo have no resource: exploration only.
//
// Bop and Pol belong to the anomaly arc (10c_TheConvergence), which
// deliberately does NOT depend on this file.
//
// NOTE: Vall and Tylo are crewed-landing milestones gated on the Jool
// system probe rather than on their own probes - the Jool probe is
// the system survey. A slight bend of probes-before-crew, by design.
//
// All reward multipliers FLAGGED (x10 outer tier) - balance TBC.
// Paragraph breaks use single-backslash \n\n (matches file 05).
// ================================================================


// ----------------------------------------------------------------
// OP-01: PROBE TO Object O-I (Duna)
// probe tier x10.0 - reward scale FLAGGED
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = OP_01_Probe
    group           = TheOuterPlanetsProgram

    title           = Outer Planets: Probe to Object O-I
    genericTitle    = Send a survey probe to Object O-I
    genericDescription = Send an uncrewed probe to Object O-I, survey it from orbit, resolve its identity and map its resources.
    description     = The outer survey has its first catch: a slow mover, rust-red even at this distance, tracking against the stars just beyond our own orbit. We are cataloguing it as Object O-I.\n\nSend a survey probe. Reach it, settle into a scanning orbit, and run the full suite - altimetry, biome, and a resource pass. It has an atmosphere, thin but real, so aerobraking may save you fuel. Once the data is in, we can name it and learn what it is made of.
    synopsis        = Send an uncrewed probe to Object O-I. Achieve orbit and complete 80% altimetry, biome, and resource coverage.
    completedMessage = Survey complete. Object O-I resolves as a cold, rust-coloured desert world with polar ice and a whisper of atmosphere. The archives name it Duna. The outer system is open.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Duna
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // outer-planet tier x10.0 (FLAGGED - balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 10.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi       = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit     = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_altim     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_biome     = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_science   = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource  = Round(@stepPool * 2.5 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    failureReputation = 8
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    PARAMETER
    {
        name        = EnterDunaSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Duna
        minAltitude = 1
        title       = Enter the sphere of influence of Object O-I
        rewardFunds = @/step_soi
        rewardReputation = 3
    }

    PARAMETER
    {
        name                 = OrbitDuna
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Duna
        minAltitude          = 60000
        maxAltitude          = 1000000
        title                = Achieve a stable scanning orbit of Object O-I
        rewardFunds          = @/step_orbit
        rewardReputation     = 4
    }

    PARAMETER
    {
        name        = AltimetryScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Duna
        title       = Achieve 80% lo-res altimetry coverage of Duna
        rewardFunds = @/step_altim
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Duna
        title       = Achieve 80% biome scan coverage of Duna
        rewardFunds = @/step_biome
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Duna
        title       = Achieve 80% resource scan coverage of Duna
        rewardFunds = @/step_resource
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = ObservationScience
        type           = CollectScience
        targetBody     = Duna
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit science from low orbit of Object O-I
        rewardFunds    = @/step_science
        rewardReputation = 4
    }

    BEHAVIOUR
    {
        name  = RevealDunaObservation
        type  = KASAAdvanceDiscovery
        body  = Duna
        stage = observation
    }

    BEHAVIOUR
    {
        name  = RevealDunaAltimetry
        type  = KASAAdvanceDiscovery
        body  = Duna
        stage = altimetry
        parameter = AltimetryScan
    }

    BEHAVIOUR
    {
        name  = RevealDunaBiome
        type  = KASAAdvanceDiscovery
        body  = Duna
        stage = biome
        parameter = BiomeScan
    }

    BEHAVIOUR
    {
        name      = MarkDunaResourceScanned
        type      = KASAResourceScanned
        body      = Duna
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource data
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }
            TEXT
            {
                text = The rust is not decoration - it is the whole crust. An iron-rich compound, concentrated at the poles and across the northern basin. I am calling it Ferrosite. Smelt it and you get structural feedstock: the same material we lift from the Mun to build with. Do you understand what that means? We would not have to carry our shipyards with us. We could build them out here.
            }
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Object O-I resolved
            condition = CONTRACT_SUCCESS
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }
            TEXT
            {
                text = A desert world with ice caps and an atmosphere too thin to breathe but thick enough to slow a lander. Cold, quiet, and reachable. The archives call it Duna. Every world we have named so far, we found by watching it cross the sun. This one we found by watching it move. That is a different kind of seeing, and it has just opened everything beyond us.
            }
        }
    }

    REQUIREMENT
    {
        name         = OuterSurveyActive
        type         = CompleteContract
        contractType = DP_04_OuterSurvey
        title        = The outer survey must be operational
    }

    REQUIREMENT
    {
        name         = DunaDetected
        type         = KASABodyDiscoveryStage
        body     = Duna
        minStage = 1
        title    = The outer survey must have detected this body
    }

}


// ----------------------------------------------------------------
// OP-02: CREWED LANDING ON DUNA
// crewed tier x10.0 - reward scale FLAGGED
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = OP_02_Crewed
    group           = TheOuterPlanetsProgram

    title           = Outer Planets: Crewed Landing on Duna
    genericTitle    = Land Kerbals on Duna and return them safely
    genericDescription = Fly a crewed mission to Duna, land, and return the crew to Kerbin.
    description     = Duna is mapped, named, and the probe has confirmed Ferrosite at the poles and across the northern basin. Now we go in person.\n\nThe atmosphere is thin - thick enough to need a heat shield, too thin to land on parachutes alone. Plan for both chutes and retro-thrust. Put Kerbals on the surface, recover a Ferrosite sample from the Northern Basin, and bring the crew home.
    synopsis        = Fly a crewed mission to Duna. Achieve orbit, EVA, land in the Northern Basin, recover a Ferrosite sample and return to Kerbin.
    completedMessage = Kerbals have walked on Duna and come home, with Wernher's Ferrosite sample. The outer system is no longer a place we look at. It is a place we go.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Duna
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // outer-planet tier x10.0 (FLAGGED - balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 20000.0) * 5000 * 10.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit     = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_evaOrbit  = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_land      = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_evaSurf   = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_return    = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 32
    failureReputation = 15
    failureFunds      = Round(-@/advance * 0.5 / 1000) * 1000

    PARAMETER
    {
        name    = HasCrew
        type    = HasCrew
        minCrew = 1
        title   = The vessel must carry at least one kerbal
    }

    PARAMETER
    {
        name        = OrbitDuna
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Duna
        minAltitude = 60000
        title       = Achieve a stable orbit of Duna
        rewardFunds = @/step_orbit
        rewardReputation = 5
    }

    PARAMETER
    {
        name           = EVAInOrbit
        type           = CollectScience
        targetBody     = Duna
        situation      = InSpaceHigh
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Perform an EVA in Duna orbit and transmit an EVA report
        rewardFunds    = @/step_evaOrbit
        rewardReputation = 6
    }

    PARAMETER
    {
        name       = LandOnDuna
        type       = ReachState
        disableOnStateChange = True
        targetBody = Duna
        situation  = LANDED
        title      = Land on the Duna surface
        rewardFunds = @/step_land
        rewardReputation = 10
    }

    PARAMETER
    {
        name           = SurfaceEVA
        type           = CollectScience
        targetBody     = Duna
        situation      = SrfLanded
        experiment     = evaReport
        recoveryMethod = Transmit
        title          = Conduct a surface EVA and transmit an EVA report
        rewardFunds    = @/step_evaSurf
        rewardReputation = 8
    }

    PARAMETER
    {
        name           = BiomeScience
        type           = CollectScience
        targetBody     = Duna
        biome          = Northern Basin
        situation      = SrfLanded
        recoveryMethod = RecoverOrTransmit
        title          = Collect surface science from the Northern Basin (Ferrosite concentration zone)
    }

    PARAMETER
    {
        name  = DunaReturn
        type  = VesselParameterGroup
        title = Return the Duna mission vessel and its crew to Kerbin

        PARAMETER
        {
            name           = FerrositeSample
            type           = CollectScience
            targetBody     = Duna
            biome          = Northern Basin
            situation      = SrfLanded
            experiment     = surfaceSample
            recoveryMethod = Recover
            title          = Return a surface sample from the Northern Basin to Kerbin (the Ferrosite sample)
        }

        PARAMETER
        {
            name             = ReturnHome
            type             = RecoverVessel
            title            = Return the crew safely to Kerbin
            rewardFunds      = @/step_return
            rewardReputation = 6
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Boots on Duna
            condition = CONTRACT_SUCCESS
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }
            TEXT
            {
                text = The sample is iron oxide, and it is nearly pure. Smelt it and you get structural feedstock - the same material we lift from the Mun to build ships with. A base at Duna would not merely mine. It would build. Everything beyond this point gets easier if we put a shipyard here.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedOP01
        type         = CompleteContract
        contractType = OP_01_Probe
        title        = OP_01 Probe Survey must be complete
    }

    REQUIREMENT
    {
        name         = DunaResolved
        type         = KASABodyDiscoveryStage
        body     = Duna
        minStage = 4
        title    = Duna must be surveyed and resolved
    }

}


