        rewardFunds = @/step_land
        rewardReputation = 4
    }

    PARAMETER
    {
        name       = HasDrills
        type       = PartValidation
        partModule = ModuleResourceHarvester
        minCount   = 1
        title      = The base must include at least one drill
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The base must be staffed by at least 2 Kerbals
        rewardFunds = @/step_crew
        rewardReputation = 4
    }

    PARAMETER
    {
        name        = StoreFerrosite
        type        = HasResource
        resource    = Ferrosite
        minQuantity = 500
        title       = Store at least 500 units of Ferrosite in the base
        rewardFunds = @/step_produce
        rewardReputation = 10
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = First Ferrosite batch
            condition = CONTRACT_SUCCESS
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }
            TEXT
            {
                text = Five hundred units, and the smelter is already running. This is the moment the programme stops being an expedition and becomes a presence. We can make structural feedstock out here now. Ships built at Duna never have to climb out of Kerbin's well at all.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedOP02
        type         = CompleteContract
        contractType = OP_02_Crewed
        title        = Duna Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = DunaResourceScanned
        type         = IsResourceScanned
        body  = Duna
        title = Duna resource scan must be complete
    }

}


