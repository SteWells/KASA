// ----------------------------------------------------------------
// OP-15: PROBE TO Object O-IV (Eeloo)
// probe tier x10.0 - reward scale FLAGGED
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = OP_15_Probe
    group           = TheOuterPlanetsProgram

    title           = Outer Planets: Probe to Object O-IV
    genericTitle    = Send a survey probe to Object O-IV
    genericDescription = Send an uncrewed probe to Object O-IV, survey it from orbit, resolve its identity and map its resources.
    description     = The last of them. The faintest thing the survey has ever caught - a point so dim and so slow that it took months of imaging to prove it was moving at all. It sits at the outer edge of everything, on an orbit that crosses the giant's and then runs far beyond it. We are cataloguing it as Object O-IV.\n\nThis is the longest journey we have ever asked anyone to plan. Survey it: altimetry, biome, resources. If there is nothing there, we will at least have drawn the last line on the map.
    synopsis        = Send an uncrewed probe to Object O-IV. Achieve orbit and complete 80% altimetry, biome, and resource coverage.
    completedMessage = Survey complete. Object O-IV is a bright, frozen world at the edge of the system. The archives name it Eeloo - and it is not empty. Not remotely.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Eeloo
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        // outer-planet tier x10.0 (FLAGGED - balance TBC)
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 10.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_soi       = Round(@stepPool * 1.0 / 10.0 / 5000) * 5000
        step_orbit     = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_altim     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_biome     = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_science   = Round(@stepPool * 1.5 / 10.0 / 5000) * 5000
        step_resource  = Round(@stepPool * 2.5 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    failureReputation = 8
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    PARAMETER
    {
        name        = EnterEelooSOI
        type        = Orbit
        disableOnStateChange = True
        targetBody  = Eeloo
        minAltitude = 1
        title       = Enter the sphere of influence of Object O-IV
        rewardFunds = @/step_soi
        rewardReputation = 3
    }

    PARAMETER
    {
        name                 = OrbitEeloo
        type                 = Orbit
        disableOnStateChange = True
        targetBody           = Eeloo
        minAltitude          = 30000
        maxAltitude          = 500000
        title                = Achieve a stable scanning orbit of Object O-IV
        rewardFunds          = @/step_orbit
        rewardReputation     = 4
    }

    PARAMETER
    {
        name        = AltimetryScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = Eeloo
        title       = Achieve 80% lo-res altimetry coverage of Eeloo
        rewardFunds = @/step_altim
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = BiomeScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = Eeloo
        title       = Achieve 80% biome scan coverage of Eeloo
        rewardFunds = @/step_biome
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = ResourceScan
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = Eeloo
        title       = Achieve 80% resource scan coverage of Eeloo
        rewardFunds = @/step_resource
        rewardReputation = 4
    }

    PARAMETER
    {
        name           = ObservationScience
        type           = CollectScience
        targetBody     = Eeloo
        situation      = InSpaceLow
        recoveryMethod = Transmit
        title          = Transmit science from low orbit of Object O-IV
        rewardFunds    = @/step_science
        rewardReputation = 4
    }

    BEHAVIOUR
    {
        name  = RevealEelooObservation
        type  = KASAAdvanceDiscovery
        body  = Eeloo
        stage = observation
    }

    BEHAVIOUR
    {
        name  = RevealEelooAltimetry
        type  = KASAAdvanceDiscovery
        body  = Eeloo
        stage = altimetry
        parameter = AltimetryScan
    }

    BEHAVIOUR
    {
        name  = RevealEelooBiome
        type  = KASAAdvanceDiscovery
        body  = Eeloo
        stage = biome
        parameter = BiomeScan
    }

    BEHAVIOUR
    {
        name      = MarkEelooResourceScanned
        type      = KASAResourceScanned
        body      = Eeloo
        parameter = ResourceScan
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource data
            condition = PARAMETER_COMPLETED
            parameter = ResourceScan
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }
            TEXT
            {
                text = I want you to look at these numbers twice, because I did. The lowlands of that frozen little world hold the richest deposit this agency has ever recorded - richer than Regocite on the Mun, richer than Glassmonite on Minmus, richer than anything. I am calling it Elysium. Refine it and it yields a propellant of a kind we have only theorised: five thousand seconds of specific impulse. The furthest place we have ever found is also the most valuable. That does not feel like an accident.
            }
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Object O-IV resolved
            condition = CONTRACT_SUCCESS
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }
            TEXT
            {
                text = Eeloo. Ice and rock, bright as a mirror, at the cold edge of everything. It took the longest flight in our history to get a probe there. And it turns out the reward for going the furthest is the fuel to go further still.
            }
        }
    }

    REQUIREMENT
    {
        name         = OuterSurveyActive
        type         = CompleteContract
        contractType = DP_04_OuterSurvey
        title        = The outer survey must be operational
    }

    REQUIREMENT
    {
        name         = EelooDetected
        type         = KASABodyDiscoveryStage
        body     = Eeloo
        minStage = 1
        title    = The outer survey must have detected this body
    }

}


