// ================================================================
// KASA — THE BASES PROGRAMME
// ================================================================
// Surface bases for resource extraction and crew support.
// Each base gates on the relevant crewed landing being complete
// and the body's resource scan done.
//
// BAS-K01  Kerbin Badlands Base  — Ore extraction, proving ground
// BAS-M01  Mun Midlands Base     — Regocite extraction
// BAS-MM01 Minmus Greater Flats  — Glassmonite extraction
//
// Gate chain:
//   KSP_02 + Mun resource scanned  → BAS-K01 + BAS-M01 unlock
//   KSP_04 + Minmus resource scanned → BAS-MM01 unlocks
//   BAS-M01 produces 500t Regocite  → ST-M01 station unlocks
//   BAS-MM01 produces 200t Glassmonite → ST-MM01 station unlocks
//
// Note: the production threshold trigger for stations is handled
// via a repeating HasResource check in the station contracts.
// ================================================================


// ----------------------------------------------------------------
// BAS-K01: KERBIN BADLANDS BASE (PROVING GROUND)
// baseBase x0.5  Stock: ~125,000 total
// Establish a staffed Ore extraction base in the Badlands.
// Narrative: proving the base design works before we trust it on
// the Mun. Produce 1000 units of Ore to prove viability.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = BAS_K01_KerbinBase
    group           = TheBasesProgram

    title           = Bases Programme: Kerbin Badlands Proving Ground
    genericTitle    = Establish a surface base in the Kerbin Badlands
    genericDescription = Establish a staffed surface base in the Kerbin Badlands to prove the base design before deploying to the Mun.
    description     = Before we commit to building permanent infrastructure on the Mun, we want to know that our base design actually works. Landing a base on Kerbin and running it through a full extraction cycle here, where we can reach it in an hour if something goes wrong, is the prudent approach.\\n\\nThe Badlands resource scan shows a high-concentration Ore deposit in the southern basin. Set up a base there: drills, a Convert-O-Tron, fuel storage, and a crew to run it. Extract 1000 units of Ore. Prove it works. Then we build the same thing on the Mun.
    synopsis        = Establish a staffed surface base in the Kerbin Badlands. Drill and store 1000 units of Ore.
    completedMessage = Kerbin proving ground operational and producing. The base design is validated. The Mun base contract is now available.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 12000.0) * 5000 * 0.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_land     = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_produce  = Round(@stepPool * 5.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 10
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name       = BaseLanded
        type       = ReachState
        targetBody = HomeWorld()
        situation  = LANDED
        biome      = Badlands
        disableOnStateChange = True
        title      = Land the base in the Kerbin Badlands
        rewardFunds = @/step_land
        rewardReputation = 2
    }

    PARAMETER
    {
        name       = HasDrills
        type       = PartValidation
        partModule = ModuleResourceHarvester
        minCount   = 1
        title      = The base must include at least one drill
    }

    PARAMETER
    {
        name       = HasConverter
        type       = PartValidation
        partModule = ModuleResourceConverter
        minCount   = 1
        title      = The base must include a Convert-O-Tron
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The base must be staffed by at least 2 Kerbals
        rewardFunds = @/step_crew
        rewardReputation = 2
    }

    PARAMETER
    {
        name          = ProduceOre
        type          = ResourceConsumption
        resource      = Ore
        minRate       = -1.0
        title         = Extract at least 1000 units of Ore from the Badlands
    }

    PARAMETER
    {
        name        = StoreOre
        type        = HasResource
        resource    = Ore
        minQuantity = 1000
        title       = Store at least 1000 units of Ore in the base
        rewardFunds = @/step_produce
        rewardReputation = 4
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Proving ground validated
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = The extraction rate, the conversion efficiency, the crew workflow — all of it matches the models. More importantly, nothing broke. The drills brought up the full thousand units without a single stoppage. The Convert-O-Tron is operating within two percent of theoretical efficiency. I am satisfied that we understand how to build and operate a surface extraction base. The same design, modified for Mun gravity and surface conditions, is what I am recommending we deploy to the Midlands.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP02
        type         = CompleteContract
        contractType = KSP_02_MunCrewed
        title        = Mun Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name  = MunResourceScanned
        type  = IsResourceScanned
        body  = Mun
        title = Mun resource scan must be complete
    }
}


// ----------------------------------------------------------------
// BAS-M01: MUN MIDLANDS BASE (REGOCITE EXTRACTION)
// baseBase x3.0  Stock: ~750,000 total
// Extract Regocite from the Mun Midlands. Produce 500 units to
// trigger the Mun station contract.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = BAS_M01_MunBase
    group           = TheBasesProgram

    title           = Bases Programme: Mun Midlands Extraction Base
    genericTitle    = Establish a Regocite extraction base in the Mun Midlands
    genericDescription = Establish a staffed surface base in the Mun Midlands to extract Regocite and prove the extraction chain is viable.
    description     = Wernher's analysis of the Regocite sample was unambiguous: the material is valuable, the Midlands deposit is extensive, and the extraction process is understood. What we need now is the infrastructure to do it at scale.\\n\\nEstablish a permanent base in the Mun Midlands with drilling and bulk storage capability. Extract 500 units of Regocite straight from the surface. Once we have demonstrated that the extraction chain works at Mun gravity and conditions, we will commission the orbital station to receive the mined material.
    synopsis        = Establish a staffed surface base in the Mun Midlands. Extract and store 500 units of Regocite.
    completedMessage = Mun base operational. First Regocite batch in storage. The orbital station contract is now available.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 12000.0) * 5000 * 3.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_land     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_produce  = Round(@stepPool * 6.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 18
    failureReputation = 6
    failureFunds      = 0

    PARAMETER
    {
        name       = BaseLanded
        type       = ReachState
        targetBody = Mun
        situation  = LANDED
        biome      = Midlands
        disableOnStateChange = True
        title      = Land the base in the Mun Midlands (Regocite concentration zone)
        rewardFunds = @/step_land
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = HasDrills
        type       = PartValidation
        partModule = ModuleResourceHarvester
        minCount   = 1
        title      = The base must include at least one drill
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The base must be staffed by at least 2 Kerbals
        rewardFunds = @/step_crew
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = StoreRegocite
        type        = HasResource
        resource    = Regocite
        minQuantity = 500
        title       = Store at least 500 units of Regocite in the base
        rewardFunds = @/step_produce
        rewardReputation = 8
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = First Regocite batch
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = Five hundred units of Regocite, extracted from the Mun Midlands and ready for transfer. The compressive strength of the raw material exceeds our best projections. This is not just an interesting mineral — it is a construction aggregate that could significantly reduce the mass we need to launch from Kerbin for any future base expansion work. I am already in discussion with the mission planning team about using Regocite concrete for habitat module construction. We need to get that orbital station built so we can start the transfer pipeline.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP02
        type         = CompleteContract
        contractType = KSP_02_MunCrewed
        title        = Mun Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedKerbinBase
        type         = CompleteContract
        contractType = BAS_K01_KerbinBase
        title        = Kerbin Badlands proving ground must be complete
    }

    REQUIREMENT
    {
        name  = MunResourceScanned
        type  = IsResourceScanned
        body  = Mun
        title = Mun resource scan must be complete
    }
}


// ----------------------------------------------------------------
// BAS-MM01: MINMUS GREATER FLATS BASE (GLASSMONITE EXTRACTION)
// baseBase x4.0  Stock: ~1,000,000 total
// Extract Glassmonite from the Greater Flats. Produce 200 units
// to trigger the Minmus station contract.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = BAS_MM01_MinmusBase
    group           = TheBasesProgram

    title           = Bases Programme: Minmus Greater Flats Production Base
    genericTitle    = Establish a Prismatic Gel production base in the Minmus Greater Flats
    genericDescription = Establish a staffed surface base in the Minmus Greater Flats to mine Glassmonite and refine it into Prismatic Gel on-site.
    description     = The Minmus Greater Flats contain the highest Glassmonite concentration in the Kerbin system, and Glassmonite is the feedstock for Prismatic Gel — the propellant that makes every deep-space mission the programme will ever run viable.\\n\\nThis is the most strategically important base we have ever built. Establish it in the Greater Flats, mine the Glassmonite, refine it into Prismatic Gel on-site with an onboard Convert-O-Tron, and produce the first 250 units. Once the orbital station is receiving regular Prismatic Gel deliveries, the entire interplanetary programme becomes viable.
    synopsis        = Establish a staffed surface base in the Minmus Greater Flats. Mine Glassmonite, refine it on-site, and produce 250 units of Prismatic Gel.
    completedMessage = Minmus base operational. First Prismatic Gel refined on-site and in storage. The orbital station contract is now available. The interplanetary programme begins here.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 12000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_land     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_crew     = Round(@stepPool * 2.0 / 10.0 / 5000) * 5000
        step_produce  = Round(@stepPool * 6.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 22
    failureReputation = 7
    failureFunds      = 0

    PARAMETER
    {
        name       = BaseLanded
        type       = ReachState
        targetBody = Minmus
        situation  = LANDED
        biome      = Greater Flats
        disableOnStateChange = True
        title      = Land the base in the Minmus Greater Flats (Glassmonite concentration zone)
        rewardFunds = @/step_land
        rewardReputation = 3
    }

    PARAMETER
    {
        name       = HasDrills
        type       = PartValidation
        partModule = ModuleResourceHarvester
        minCount   = 1
        title      = The base must include at least one drill
    }

    PARAMETER
    {
        name       = HasConverter
        type       = PartValidation
        partModule = ModuleResourceConverter
        minCount   = 1
        title      = The base must include a Convert-O-Tron to refine Glassmonite into Prismatic Gel
    }

    PARAMETER
    {
        name       = HasCrew
        type       = HasCrew
        minCrew    = 2
        title      = The base must be staffed by at least 2 Kerbals
        rewardFunds = @/step_crew
        rewardReputation = 3
    }

    PARAMETER
    {
        name        = ProducePrismaticGel
        type        = HasResource
        resource    = PrismaticGel
        minQuantity = 250
        title       = Refine and store at least 250 units of Prismatic Gel at the base
        rewardFunds = @/step_produce
        rewardReputation = 10
    }

    PARAMETER
    {
        name        = HasPrismaticGelStorage
        type        = HasResourceCapacity
        resource    = PrismaticGel
        minQuantity = 1500
        title       = The base must have storage capacity for at least 1500 units of Prismatic Gel
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Prismatic Gel production confirmed
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = The refinery is running and the first batch is in the tanks. The Glassmonite in the Greater Flats is denser and purer than the survey data suggested — possibly because this region had the lowest thermal variation during Minmus's formation period — so the conversion yield is better than the model predicted. We are producing roughly twelve units of Prismatic Gel per day, enough to fuel a deep-space transfer vehicle every forty days. I want the orbital station operational as soon as possible. The interplanetary programme is waiting on this pipeline.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKSP04
        type         = CompleteContract
        contractType = KSP_04_MinmusCrewed
        title        = Minmus Crewed Mission must be complete
    }

    REQUIREMENT
    {
        name         = CompletedKerbinBase
        type         = CompleteContract
        contractType = BAS_K01_KerbinBase
        title        = Kerbin Badlands proving ground must be complete
    }

    REQUIREMENT
    {
        name  = MinmusResourceScanned
        type  = IsResourceScanned
        body  = Minmus
        title = Minmus resource scan must be complete
    }
}
