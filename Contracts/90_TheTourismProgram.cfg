// ================================================================
// KASA — THE TOURISM PROGRAMME
// ================================================================
// Space tourism integrated into the KASA narrative. Mortimer
// introduces the programme after the first crewed orbital mission,
// framing it as the answer to the programme's growing costs.
//
// Tourism contracts serve two purposes:
//   1. Generate funds throughout the career, especially during
//      the waiting periods of the Discovery Programme contracts
//   2. Provide a reason to build space stations (tourists want
//      somewhere to stay once we have the orbital infrastructure)
//
// Contracts in this file:
//   TM_01_FirstPassenger   — one wealthy kerbal, one-time only
//   TM_02_SubOrbital       — repeatable, 1–2 tourists, suborbital
//   TM_03_LowOrbit         — repeatable, 1–4 tourists, low orbit
//   TM_04_MunFlyby         — repeatable, tourists to Mun and back
//   TM_05_Station          — repeatable, tourists to a station
//
// Gate chain:
//   FF_04 complete → TM_01
//   TM_01 complete → TM_02 + TM_03 (both unlock)
//   KSP_02 complete → TM_04 (Mun must have been visited by crew)
//   Station exists → TM_05 (requires player-built orbital station)
// ================================================================


// ----------------------------------------------------------------
// TM-01: THE FIRST PASSENGER
// One-time only. Mortimer's great idea.
// Unlocks after the first crewed orbital mission.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = TM_01_FirstPassenger
    group           = TheTourismProgram

    title           = Tourism: The First Passenger
    genericTitle    = Take a paying passenger to orbit
    description     = Mortimer Kerman has been doing the numbers. The discovery programme is expensive, the anomaly investigations are expensive, and the orbital science campaigns are expensive. He has, however, identified an opportunity.\n\nA wealthy Kerbal — a Juno Kerman, industrialist — has approached KASA with a considerable sum of money. He wants to go to space. He has been very clear that he does not want to go to space as an astronaut — he wants to go as a passenger. He will sit in a seat, experience orbit for a few hours, and come home.\n\nMortimer's view: this is free money. Gene's view: this sets a precedent. Wernher's view: as long as he stays out of the instrument bay, fine.
    synopsis        = Take Juno Kerman to low Kerbin orbit. Keep him there for at least two hours. Bring him home safely.
    completedMessage = Juno Kerman is back on the ground and reportedly very happy. Mortimer is already fielding enquiries from others who heard about the flight. A new revenue stream has opened.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    // Fixed reward — this is a one-off narrative moment
    advanceFunds      = 30000
    rewardFunds       = 120000
    rewardReputation  = 10
    failureReputation = 15
    failureFunds      = -10000

    PARAMETER
    {
        name  = TouristFlight
        type  = VesselParameterGroup
        title = Take Juno Kerman to orbit and bring him home

        PARAMETER
        {
            name    = HasCrew
            type    = HasCrew
            minCrew = 1
            trait   = Pilot
            title   = The vessel must have a qualified pilot
        }

        PARAMETER
        {
            name  = HasPassengers
            type  = HasPassengers
            title = Juno Kerman must be aboard
        }

        PARAMETER
        {
            name                 = AchieveOrbit
            type                 = Orbit
            targetBody           = HomeWorld()
            minAltitude          = 80000
            disableOnStateChange = True
            title                = Reach stable orbit above 80km
        }

        PARAMETER
        {
            name           = StayInOrbit
            type           = Duration
            duration       = 2h
            preWaitText    = Waiting to reach orbit.
            waitingText    = Juno is enjoying the view...
            completionText = Two hours complete. Time to go home.
            startCriteria  = PARAMETER_COMPLETION
            parameter      = AchieveOrbit
        }
    }

    PARAMETER
    {
        name               = RecoverPassenger
        type               = RecoverKerbal
        completeInSequence = true
        completeInSequence = true
        title              = Recover Juno Kerman safely
    }

    BEHAVIOUR
    {
        name  = SpawnPassengers
        type  = SpawnPassengers
        kerbal = NewKerbal(Male, "Juno Kerman")
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = A new revenue stream
            condition = PARAMETER_COMPLETED
            parameter = RecoverPassenger

            INSTRUCTOR
            {
                name      = Strategy_Mortimer
                animation = true_thumbUp
            }

            TEXT
            {
                text = Juno's funds have cleared. I have already had three more enquiries since his flight made the news. I am setting up a proper booking system. KASA Tourism is open for business.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF04
        type         = CompleteContract
        contractType = FF_04_FirstCrewedOrbit
        title        = First Crewed Orbital Mission must be complete
    }
}


// ----------------------------------------------------------------
// TM-02: SUBORBITAL TOURISM
// Repeatable. 1–2 tourists on a suborbital hop.
// Cheaper to operate than orbital, quicker turnaround.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = TM_02_SubOrbitalTourism
    group           = TheTourismProgram

    title              = Tourism: Suborbital Sightseeing — @/touristCount.Print() @/touristWord
    genericTitle       = Take tourists on a suborbital flight
    genericDescription = Take a group of tourists on a suborbital flight above 80km and return them safely.
    description        = Word has spread since Juno Kerman's flight. These @/touristWord want the experience — the view from the edge of space, a few minutes of weightlessness — but they are on a tighter schedule than our orbital passengers. A suborbital hop is exactly what they need. Get them to 80km, give them a few minutes to look out the window, and bring them home safely.\n\nMortimer says we should charge extra for window seats. We are not doing that.
    synopsis        = Take @/touristCount.Print() @/touristWord on a suborbital flight above 80km and return them safely.
    completedMessage = The @/touristWord are back and already telling their friends. Mortimer has updated the booking calendar.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 90

    DATA
    {
        type = int
        touristCount = Random(1, 2)
        requiredValue = false
    }

    DATA
    {
        type = string
        touristWord = @/touristCount == 1 ? "tourist" : "tourists"
        requiredValue = false
    }

    DATA
    {
        type = double
        baseReward    = 50000
        advancePay    = Round(@baseReward * 0.20 * @/touristCount / 5000) * 5000
        completePay   = Round(@baseReward * 0.80 * @/touristCount / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advancePay
    rewardFunds       = @/completePay
    rewardReputation  = 1
    failureReputation = 5
    failureFunds      = Round(-@/advancePay * 0.5 / 1000) * 1000

    PARAMETER
    {
        name  = SubOrbitalFlight
        type  = VesselParameterGroup
        title = Take the @/touristWord above 80km

        PARAMETER
        {
            name  = HasCrew
            type  = HasCrew
            trait = Pilot
            title = A qualified pilot must be aboard
        }

        PARAMETER
        {
            name  = HasPassengers
            type  = HasPassengers
        }

        PARAMETER
        {
            name                 = ReachAltitude
            type                 = ReachState
            targetBody           = HomeWorld()
            minAltitude          = 80000
            disableOnStateChange = True
            title                = Reach 80km altitude
        }
    }

    PARAMETER
    {
        name               = RecoverTourists
        type               = RecoverKerbal
        completeInSequence = true
        completeInSequence = true
        title              = Return the @/touristWord safely
    }

    BEHAVIOUR
    {
        name  = SpawnPassengers
        type  = SpawnPassengers
        count = Max(1, @/touristCount)
    }

    REQUIREMENT
    {
        name         = CompletedTM01
        type         = CompleteContract
        contractType = TM_01_FirstPassenger
        title        = First Passenger must have flown
    }

    REQUIREMENT
    {
        name             = Cooldown
        type             = CompleteContract
        contractType     = TM_02_SubOrbitalTourism
        cooldownDuration = Random(3d, 7d)
        minCount         = 0
        title            = Cooldown between orbital tourist flights
    }
}

// ----------------------------------------------------------------
// TM-03: LOW ORBIT TOURISM
// Repeatable. 1–4 tourists, low orbit, minimum 1 hour.
// The main repeatable income source through mid-game.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = TM_03_LowOrbitTourism
    group           = TheTourismProgram

    title              = Tourism: Low Orbit Flight — @/touristCount.Print() @/touristWord
    genericTitle       = Take tourists to low Kerbin orbit
    genericDescription = Take a group of tourists to low Kerbin orbit and return them safely.
    description        = The orbital tourism package. @/touristCount.Print() @/touristWord want the full experience — the view of Kerbin from orbit, the sunrise every 30 minutes, the feeling of true weightlessness for an extended period. Reach stable orbit above 100km, keep them up there for at least an hour, and bring them home with all limbs attached.\n\nThey have been told they cannot open the hatch. Mortimer insisted on the waiver.
    synopsis        = Take @/touristCount.Print() @/touristWord to orbit above 100km. Keep them there for at least 1 hour. Return them safely.
    completedMessage = All @/touristWord recovered safely. Mortimer reports that the orbital package is now our most popular offering. He is already asking about expanding capacity.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 90

    DATA
    {
        type = bool
        hasTwoSeats  = AllParts().Where(p => p.IsUnlocked() && p.CrewCapacity() >= 2).Count() > 0
        hasFourSeats = AllParts().Where(p => p.IsUnlocked() && p.CrewCapacity() >= 4).Count() > 0
        requiredValue = false
    }

    DATA
    {
        type = int
        maxTourists  = @/hasFourSeats ? 3 : @/hasTwoSeats ? 1 : 0
        touristCount = @/maxTourists > 0 ? Random(1, @/maxTourists) : 1
        requiredValue = false
    }

    DATA
    {
        type = string
        touristWord = @/touristCount == 1 ? "tourist" : "tourists"
        requiredValue = false
    }

    DATA
    {
        type = double
        orbBase          = 30000
        perPassenger     = 50000
        totalReward      = @orbBase + @perPassenger * @/touristCount
        advancePay       = Round(@totalReward * 0.20 / 5000) * 5000
        completePay      = Round(@totalReward * 0.80 / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advancePay
    rewardFunds       = @/completePay
    rewardReputation  = 2
    failureReputation = 8
    failureFunds      = Round(-@/advancePay * 0.5 / 1000) * 1000

    PARAMETER
    {
        name  = OrbitalFlight
        type  = VesselParameterGroup
        title = Take the @/touristWord to orbit

        duration = 1h

        PARAMETER
        {
            name  = HasCrew
            type  = HasCrew
            trait = Pilot
            title = A qualified pilot must be aboard
        }

        PARAMETER
        {
            name  = HasPassengers
            type  = HasPassengers
        }

        PARAMETER
        {
            name                 = AchieveOrbit
            type                 = Orbit
            targetBody           = HomeWorld()
            minAltitude          = 100000
            disableOnStateChange = True
            title                = Reach stable orbit above 100km
        }
    }

    PARAMETER
    {
        name               = RecoverTourists
        type               = RecoverKerbal
        completeInSequence = true
        completeInSequence = true
        title              = Return the @/touristWord safely
    }

    BEHAVIOUR
    {
        name  = SpawnPassengers
        type  = SpawnPassengers
        count = Max(1, @/touristCount)
    }

    REQUIREMENT
    {
        name         = CompletedTM01
        type         = CompleteContract
        contractType = TM_01_FirstPassenger
        title        = First Passenger must have flown
    }

    REQUIREMENT
    {
        name  = CanCarryPassenger
        type  = Expression
        expression = @/maxTourists > 0
        title = Must have an unlocked part capable of carrying at least 2 crew
    }

    REQUIREMENT
    {
        name             = Cooldown
        type             = CompleteContract
        contractType     = TM_03_LowOrbitTourism
        cooldownDuration = Random(3d, 7d)
        minCount         = 0
        title            = Cooldown between orbital tourist flights
    }
}


// ----------------------------------------------------------------
// TM-04: MUN FLYBY TOURISM
// Repeatable. 1–2 tourists on a Mun flyby.
// Unlocks after the first crewed Mun landing.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = TM_04_MunFlyby
    group           = TheTourismProgram

    title              = Tourism: Mun Flyby — @/touristCount.Print() @/touristWord
    genericTitle       = Take tourists on a Mun flyby
    genericDescription = Take a group of tourists on a Mun flyby and return them safely to Kerbin.
    description        = The Mun flyby package. Since our crewed mission put Kerbals on the surface, demand for Mun tourism has been considerable. These @/touristWord want to fly close to the Mun — close enough to see the craters clearly — and come home with the story. They are not astronauts. They do not need to land. They just want to get close enough that the Mun fills the window.\n\nMortimer has named this package the "Mun Express." We did not consult anyone before he printed the brochures.
    synopsis        = Take @/touristCount.Print() @/touristWord on a Mun flyby (enter the Mun's SOI) and return them safely to Kerbin.
    completedMessage = The @/touristWord are home and reportedly have very good photographs. The Mun Express is now our premium offering.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 180

    DATA
    {
        type = int
        touristCount = Random(1, 2)
        requiredValue = false
    }

    DATA
    {
        type = string
        touristWord = @/touristCount == 1 ? "tourist" : "tourists"
        requiredValue = false
    }

    DATA
    {
        type = double
        munFixedBase = 50000
        munPerPax    = 60000
        munTotal     = @munFixedBase + @munPerPax * @/touristCount
        advancePay   = Round(@munTotal * 0.20 / 5000) * 5000
        completePay  = Round(@munTotal * 0.80 / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advancePay
    rewardFunds       = @/completePay
    rewardReputation  = 4
    failureReputation = 12
    failureFunds      = Round(-@/advancePay * 0.5 / 1000) * 1000

    PARAMETER
    {
        name  = MunFlybyGroup
        type  = VesselParameterGroup
        title = Take the @/touristWord to the Mun

        PARAMETER
        {
            name  = HasCrew
            type  = HasCrew
            trait = Pilot
            title = A qualified pilot must be aboard
        }

        PARAMETER
        {
            name  = HasPassengers
            type  = HasPassengers
        }

        PARAMETER
        {
            name                 = EnterMunSOI
            type                 = ReachState
            targetBody           = Mun
            situation            = ORBITING
            disableOnStateChange = True
            title                = Enter the Mun's sphere of influence
        }
    }

    PARAMETER
    {
        name               = RecoverTourists
        type               = RecoverKerbal
        completeInSequence = true
        completeInSequence = true
        title              = Return the @/touristWord safely to Kerbin
    }

    BEHAVIOUR
    {
        name  = SpawnPassengers
        type  = SpawnPassengers
        count = Max(1, @/touristCount)
    }

    REQUIREMENT
    {
        name         = CompletedMunCrewed
        type         = CompleteContract
        contractType = KSP_02_MunCrewed
        title        = Crewed Mun landing must be complete
    }
    REQUIREMENT
    {
        name             = Cooldown
        type             = CompleteContract
        contractType     = TM_04_MunFlyby
        cooldownDuration = Random(10d, 15d)
        minCount         = 0
        title            = Cooldown between Mun tourist flights
    }
}


// ----------------------------------------------------------------
// TM-05: SPACE STATION TOURISM
// Repeatable. Requires a player-built orbital station.
// Connects the tourism programme to the stations programme.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = TM_05_StationTourism
    group           = TheTourismProgram

    title              = Tourism: Station Visit — @/touristCount.Print() @/touristWord to @/targetVessel
    genericTitle       = Take tourists to a Kerbin orbital station
    genericDescription = Transport tourists to an orbital station and return them safely.
    description        = Having a permanent station in orbit changes things. It is no longer just a relay point or a science platform — it is a destination. These @/touristWord want to visit @/targetVessel, spend some time aboard, and come home with the experience of living in space, even briefly.\n\nMortimer views the station as a captive hotel. He is not entirely wrong.
    synopsis        = Transport @/touristCount.Print() @/touristWord to @/targetVessel. Keep them aboard for at least 4 hours. Return them safely.
    completedMessage = The @/touristWord are home. Mortimer is already calculating the per-docking revenue on the station. He has a spreadsheet.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxSimultaneous = 2
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 90

    DATA
    {
        type = Vessel
        requiredValue = true
        uniquenessCheck = CONTRACT_ACTIVE
        title = Must have a Kerbin orbital station with empty crew space
        targetVessel = AllVessels().Where(v => v.VesselType() == Station && v.CelestialBody() == HomeWorld() && v.IsOrbiting() && v.EmptyCrewSpace() >= 1).Random()
    }

    DATA
    {
        type = int
        touristCount = Random(1, Min(3, @/targetVessel.EmptyCrewSpace()))
        requiredValue = false
    }

    DATA
    {
        type = string
        touristWord = @/touristCount == 1 ? "tourist" : "tourists"
        requiredValue = false
    }

    DATA
    {
        type = double
        stationBase = Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.0
        advancePay  = Round(@stationBase * 0.20 * @/touristCount / 5000) * 5000
        completePay = Round(@stationBase * 0.80 * @/touristCount / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advancePay
    rewardFunds       = @/completePay
    rewardReputation  = 3
    failureReputation = 10
    failureFunds      = Round(-@/advancePay * 0.5 / 1000) * 1000

    PARAMETER
    {
        name   = StationVisit
        type   = VesselParameterGroup
        vessel = @/targetVessel
        title  = Bring the @/touristWord to @/targetVessel

        duration = 4h

        PARAMETER
        {
            name  = HasPassengers
            type  = HasPassengers
        }
    }

    PARAMETER
    {
        name               = RecoverTourists
        type               = RecoverKerbal
        completeInSequence = true
        completeInSequence = true
        title              = Return the @/touristWord safely to Kerbin
    }

    BEHAVIOUR
    {
        name  = SpawnPassengers
        type  = SpawnPassengers
        count = Max(1, @/touristCount)
    }

    REQUIREMENT
    {
        name         = CompletedTM01
        type         = CompleteContract
        contractType = TM_01_FirstPassenger
        title        = First Passenger must have flown
    }

    REQUIREMENT
    {
        name  = StationExists
        type  = Expression
        expression = AllVessels().Where(v => v.VesselType() == Station && v.CelestialBody() == HomeWorld() && v.IsOrbiting() && v.EmptyCrewSpace() >= 1).Count() > 0
        title = Must have an orbital station with available crew space
    }

    REQUIREMENT
    {
        name             = Cooldown
        type             = CompleteContract
        contractType     = TM_05_StationTourism
        cooldownDuration = Random(15d, 20d)
        minCount         = 0
        title            = Cooldown between station tourist flights
    }

}
