// ================================================================
// KASA — THE ANOMALY PROGRAMME: KERBIN
// ================================================================
// Coordinates and anomaly data sourced from the AnomalySurveyor
// contract pack by nightingale (MIT licence). Narrative and
// integration into the KASA story arc are original to this pack.
//
// Contracts in this file:
//   KA_IslandAirfield  — the abandoned airfield on the island
//   KA_Pyramids        — ancient structures in the western desert
//   KA_TMA0            — the KSC-area monolith (main TMA thread)
//   KA_TMA1to4         — four further Kerbin monoliths (DATA_EXPAND)
//   KA_UFO_Kerbin      — the arctic crash site
//
// Gate chain:
//   FF_04 complete     → KA_IslandAirfield
//   KA_IslandAirfield  → KA_Pyramids
//   FF_04 complete     → KA_TMA0
//   KA_TMA0 complete   → KA_TMA1to4 (all four in parallel)
//   KA_Pyramids        → KA_UFO_Kerbin
//
// The TMA thread connects Kerbin → Mun → Minmus → outer system.
// After visiting TMA-0, the monolith broadcasts a signal traced to
// additional sites on Kerbin. After all Kerbin TMAs are visited,
// the signal triangulates to the Mun — seeding the Mun anomaly
// contracts in 10b_TheMunMinmusAnomalies.cfg.
//
// SCANsat integration: where present, anomaly locations require
// a scan of the relevant coordinates before the contract appears.
// Uses :NEEDS[SCANsat] conditional blocks throughout.
//
// Icons: this file references KASA/Icons/ — bundle the icon
// PNG files from ContractPacks/AnomalySurveyor/Icons/ into
// GameData/KASA/Icons/ if AnomalySurveyor is not installed.
// ================================================================


// ----------------------------------------------------------------
// KA: ISLAND AIRFIELD
// Early flavour contract. No gate except first launch.
// The Island Airfield predates KASA — a mystery in itself.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KA_IslandAirfield
    group           = TheAnomalyProgram

    title           = Anomaly: The Island Airfield
    genericTitle    = Investigate the abandoned airfield on the island
    description     = Jebediah Kerman filed a note after his orbital flight. Between the instrument checks and the EVA, he spent a considerable amount of time looking out the window. He says he spotted something on a small island to the southwest of the KSC — a runway, a hangar, what looked like launch infrastructure. Kerbal-made, he said, but not ours.\n\nWe checked the records. There is no KASA installation on that island. There is no record of any installation. The runway is intact. The hangar is intact. Nobody can tell us who built it or when it was last used. Jebediah cannot let it go, and frankly neither can we.\n\nBetween launches, we would like you to take a look.
    synopsis        = Visit the control tower and the hangar at the island airfield.
    completedMessage = The airfield has been investigated. Gene has some thoughts.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    // Reward: earlyBase x0.5
    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 0.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_tower    = Round(@contractTotal * 0.30 / 5000) * 5000
        step_hangar   = Round(@contractTotal * 0.30 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 5
    rewardScience     = 5
    failureReputation = 1
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitTower
        type  = All
        title = Climb to the top of the control tower

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = Tower
            type     = VisitWaypoint
            index    = 0
            distance = 5
        }

        rewardFunds = @/step_tower
    }

    PARAMETER
    {
        name  = VisitHangar
        type  = All
        title = Investigate the burned-out pod in the hangar

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = Hangar
            type     = VisitWaypoint
            index    = 1
            distance = 25
        }

        rewardFunds = @/step_hangar
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        PQS_CITY
        {
            name     = Control Tower
            icon     = KASA/Icons/unknown
            pqsCity  = IslandAirfield
            pqsOffset = -25.5440407030383, -180.724966497429, 59.493380329812
            altitude = 59.493380329812
        }

        PQS_CITY
        {
            name     = Hangar
            icon     = KASA/Icons/unknown
            pqsCity  = IslandAirfield
            pqsOffset = -102.891933658238, -107.91985303655, 18.1263730936462
            altitude = 18.1263730936462
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The view from the tower
            condition = PARAMETER_COMPLETED
            parameter = VisitTower

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_smileA
            }

            TEXT
            {
                text = Good view from up here. You could watch a rocket all the way to the horizon. Whoever built this was serious about their work.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Kerpollo One
            condition = PARAMETER_COMPLETED
            parameter = VisitHangar

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = false_sadA
            }

            TEXT
            {
                text = There is a burned-out command pod in that hangar. Scorched on re-entry. Someone made it to space — or tried to — before any of us. There is no record of this programme anywhere. Whoever they were, they never made it home. We carry on for them.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF04
        type         = CompleteContract
        contractType = FF_04_FirstCrewedOrbit
        title        = First Crewed Orbital Mission must be complete
        // Jeb spotted the airfield during his orbital flight
    }
}


// ----------------------------------------------------------------
// KA: DESERT PYRAMIDS
// Unlocks after reaching space. Ancient structures — separate
// thread from the TMA story, but tantalises the player with
// the question of who built them.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KA_Pyramids
    group           = TheAnomalyProgram

    title           = Anomaly: Structures in the Western Desert
    genericTitle    = Investigate ancient structures in Kerbin's desert
    description     = From orbit, our reconnaissance data shows something unusual in the western desert — geometric structures, clearly not natural, in an area so remote it has never been surveyed on the ground. The Kerbin Archaeological Society has been petitioning KASA for access since we first imaged them.\n\nWe have agreed to take a look on our next available mission. The Society is calling the site Tut-Un Jeb-Ahn, after the ancient Kerbal ruler supposedly buried there.
    synopsis        = Visit the desert pyramid structures on foot.
    completedMessage = The team has seen the pyramids. The crew have questions.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 1.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_pyramids = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    rewardScience     = 10
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitPyramids
        type  = All
        title = Investigate the pyramid structures

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = Pyramids
            type     = VisitWaypoint
            index    = 0
            distance = 15
        }

        rewardFunds = @/step_pyramids
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = Tut-Un Jeb-Ahn
            icon      = KASA/Icons/pyramids
            latitude  = -6.49976362801318
            longitude = -141.68024760056
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Tut-Un Jeb-Ahn
            condition = PARAMETER_COMPLETED
            parameter = VisitPyramids

            KERBAL
            {
                characterName = Jebediah Kerman
            }

            TEXT
            {
                text = There is a statue here. An enormous one, half-sunk into the sand. It looks like a Kerbal — but the proportions are off. And there is writing on the base.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Tut-Un Jeb-Ahn
            condition = PARAMETER_COMPLETED
            parameter = VisitPyramids

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = true_nodA
            }

            TEXT
            {
                text = Can you read the inscription?
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Tut-Un Jeb-Ahn
            condition = PARAMETER_COMPLETED
            parameter = VisitPyramids

            KERBAL
            {
                characterName = Jebediah Kerman
            }

            TEXT
            {
                text = My name is Tut-Un Jeb-Ahn, king of kings: Look on my works, ye Mighty, and despair. ...There is a lot of sand. That is mostly what there is.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedIslandAirfield
        type         = CompleteContract
        contractType = KA_IslandAirfield
        title        = Island Airfield investigation must be complete
    }
}


// ----------------------------------------------------------------
// KA: TMA-0 — THE KSC MONOLITH
// The main TMA thread begins here. Unlocks after FF_04 (first
// crewed orbit). The GRAVMAX orbital survey flagged a fixed surface
// anomaly during First Flights; the magnetometer (DP-02) later
// confirms it is electromagnetic.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KA_TMA0
    group           = TheAnomalyProgram

    title           = Anomaly: TMA-0 — Investigate the Ground Signal
    genericTitle    = Investigate the surface anomaly north of the KSC
    description     = During our first orbital survey, the GRAVMAX flagged a fixed anomaly approximately 12 kilometres north of the KSC — a localised signature, present on every pass, that corresponds to no terrain or mass concentration we can identify. Initial analysis dismissed it as instrument error. Subsequent passes do not support that conclusion.\n\nThe signature matches no known geological formation. There is no KASA installation at those coordinates. There is no record of any installation. We are provisionally designating it TMA-0 — Tycho Magnetic Anomaly zero, the name a wager on Dr. von Kerman's part that the magnetometer survey will tell us more. We need someone on the ground.
    synopsis        = Investigate the anomaly source 12km north of the KSC.
    completedMessage = TMA-0 has been found. Wernher is trying to stay calm about this.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_tma0     = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 20
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitTMA0
        type  = All
        title = Investigate TMA-0

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = TMA0
            type     = VisitWaypoint
            index    = 0
            distance = 15
        }

        rewardFunds = @/step_tma0
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = TMA-0
            icon      = KASA/Icons/monolith
            latitude  = 0.10227297919058
            longitude = -74.5684338987643
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-0
            condition = PARAMETER_COMPLETED
            parameter = VisitTMA0

            KERBAL
            {
                characterName = Jebediah Kerman
            }

            TEXT
            {
                text = There is a... structure here. A tall black rectangular object. Perfectly smooth. No seams. No markings. It is warm to the touch, which does not make any sense given how cold it is out here. Our instruments are going haywire.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-0
            condition = PARAMETER_COMPLETED
            parameter = VisitTMA0

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = Remarkable. The structure is artificial — clearly artificial — and of a material our instruments cannot immediately classify. The emission matches the signature our orbital survey flagged exactly. And now that you are standing next to it... the signal has changed. It is broadcasting. Multiple new signals, going in different directions. This object just became aware that we found it.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF04
        type         = CompleteContract
        contractType = FF_04_FirstCrewedOrbit
        title        = First Crewed Orbital Mission must be complete
    }
}


// ----------------------------------------------------------------
// KA: TMA-1 THROUGH TMA-4
// Four further Kerbin monoliths. The signals from TMA-0 point
// to these locations. All four unlock in parallel after TMA-0.
// Uses DATA_EXPAND to generate one contract per anomaly.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KA_TMA1to4
    group           = TheAnomalyProgram

    title           = Anomaly: Investigate @/anomalyName on Kerbin
    genericTitle    = Investigate a monolith signal site on Kerbin

    description     = After our team made contact with TMA-0, it began broadcasting signals in multiple directions. We have triangulated four separate destinations on Kerbin's surface — TMA-1 through TMA-4. The signals are going through the planet. They are not communicating with us. They are communicating with each other.
    synopsis        = Investigate @/anomalyName.
    completedMessage = @/anomalyName + " has been investigated. The signal network is becoming clearer."

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Trivial

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA_EXPAND
    {
        type         = int
        anomalyIndex = [0, 1, 2, 3]
    }

    DATA
    {
        type = List<string>
        anomalyNames = [ "TMA-1", "TMA-2", "TMA-3", "TMA-4" ]
        requiredValue = false
    }

    DATA
    {
        type = List<double>
        latitudes  = [ -0.640167416590071, 20.6708959294282, -28.8083154046288, 35.5705099080007 ]
        longitudes = [ 279.233233547805,   213.503158424511, -13.4401155804507, -74.9770427670473 ]
        rewardList = [ 40000.0, 60000.0, 80000.0, 100000.0 ]
        requiredValue = false
    }

    DATA
    {
        type        = string
        anomalyName = @/anomalyNames.ElementAt(@/anomalyIndex)
        uniquenessCheck = CONTRACT_ALL
    }

    DATA
    {
        type      = double
        latitude  = @/latitudes.ElementAt(@/anomalyIndex)
        longitude = @/longitudes.ElementAt(@/anomalyIndex)
        contractReward = @/rewardList.ElementAt(@/anomalyIndex)
        advance   = Round(@/contractReward * 0.20 / 5000) * 5000
        stepPay   = Round(@/contractReward * 0.60 / 5000) * 5000
        bonus     = Round(@/contractReward * 0.20 / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 40
    failureReputation = 2
    failureFunds      = 0

    // TMA-1
    PARAMETER
    {
        name  = VisitWP1
        type  = All
        title = Investigate TMA-1

        PARAMETER
        {
            name       = OnEVA1
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = WP1
            type     = VisitWaypoint
            index    = 0
            distance = 50
        }

        REQUIREMENT
        {
            type       = Expression
            expression = @/anomalyIndex == 0
        }

        rewardFunds = @/stepPay
    }

    // TMA-2
    PARAMETER
    {
        name  = VisitWP2
        type  = All
        title = Investigate TMA-2

        PARAMETER
        {
            name       = OnEVA2
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = WP2
            type     = VisitWaypoint
            index    = 0
            distance = 15
        }

        REQUIREMENT
        {
            type       = Expression
            expression = @/anomalyIndex == 1
        }

        rewardFunds = @/stepPay
    }

    // TMA-3
    PARAMETER
    {
        name  = VisitWP3
        type  = All
        title = Investigate TMA-3

        PARAMETER
        {
            name       = OnEVA3
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = WP3
            type     = VisitWaypoint
            index    = 0
            distance = 35
        }

        REQUIREMENT
        {
            type       = Expression
            expression = @/anomalyIndex == 2
        }

        rewardFunds = @/stepPay
    }

    // TMA-4
    PARAMETER
    {
        name  = VisitWP4
        type  = All
        title = Investigate TMA-4

        PARAMETER
        {
            name       = OnEVA4
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = WP4
            type     = VisitWaypoint
            index    = 0
            distance = 35
        }

        REQUIREMENT
        {
            type       = Expression
            expression = @/anomalyIndex == 3
        }

        rewardFunds = @/stepPay
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = @/anomalyName
            icon      = KASA/Icons/monolith
            latitude  = @/latitude
            longitude = @/longitude
            altitude  = 0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-1
            condition = PARAMETER_COMPLETED
            parameter = VisitWP1

            KERBAL
            {
                characterName = Jebediah Kerman
            }
            TEXT { text = This one is buried — only the top is visible, sticking out of the ground. As if something or someone pushed it down. The signal profile matches TMA-0 exactly. }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-2
            condition = PARAMETER_COMPLETED
            parameter = VisitWP2

            INSTRUCTOR { name = Instructor_Gene; animation = idle_lookAround }
            TEXT { text = There is infrastructure here. Old launch equipment, mostly buried. Rail tracks. A gantry, collapsed. Whoever built this was not just making objects — they were trying to get somewhere. We were not the first. }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-3
            condition = PARAMETER_COMPLETED
            parameter = VisitWP3

            KERBAL
            {
                characterName = Jebediah Kerman
            }
            TEXT { text = It is really cold up here, even in the EVA suit. But the monolith is warm. Same as TMA-0. Same material. Same emissions. And it started broadcasting the moment I got close. Whatever they are waiting for, they know we are here. }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = TMA-4
            condition = PARAMETER_COMPLETED
            parameter = VisitWP4

            INSTRUCTOR { name = Instructor_Wernher; animation = true_nodB }
            TEXT { text = I have now analysed the emission patterns from all five sites. TMA-0 through TMA-4. They are not broadcasting to each other anymore. They are broadcasting outward. Upward. To the Mun and to Minmus. I suggest we go and look. }
        }
    }

    REQUIREMENT
    {
        name         = CompletedTMA0
        type         = CompleteContract
        contractType = KA_TMA0
        title        = TMA-0 must have been investigated
    }
}


// ----------------------------------------------------------------
// KA: ARCTIC UFO CRASH SITE
// Unlocks after orbit achieved. Requires anomaly scan if
// SCANsat is installed. Connects to the Mun UFO later.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KA_UFO_Kerbin
    group           = TheAnomalyProgram

    title           = Anomaly: Arctic Crash Site
    genericTitle    = Investigate a crashed vessel in the arctic
    description     = There are reports of a vessel going down over the arctic ice. The trajectory data suggests it came in at hypersonic velocity from above — not a conventional aircraft descent. It is not one of ours. We have searched every record and it is not anyone's.\n\nWe would like to know what it is.
    synopsis        = Investigate the crashed vessel in the arctic.
    completedMessage = The crash site has been investigated. The implications are significant.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 1.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_ufo      = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    rewardScience     = 20
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitCrashSite
        type  = All
        title = Investigate the crashed vessel

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = UFO
            type     = VisitWaypoint
            index    = 0
            distance = 15
        }

        rewardFunds = @/step_ufo
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = Crash site
            icon      = KASA/Icons/unknown
            latitude  = 81.9551567431472
            longitude = 231.482239565662
            altitude  = 5.34037477325178
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = We are not alone
            condition = PARAMETER_COMPLETED
            parameter = VisitCrashSite

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = false_disagreeC
            }

            TEXT
            {
                text = The hull material is unlike anything we manufacture. The internal geometry does not correspond to any Kerbal ergonomic standard. Whatever was flying this vessel was not built the way we are built. This did not come from Kerbin.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedPyramids
        type         = CompleteContract
        contractType = KA_Pyramids
        title        = Desert Pyramids investigation must be complete
    }

}

