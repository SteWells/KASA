// ================================================================
// KASA — THE KERBIN SCAN PROGRAMME
// ================================================================
// Three contracts that run concurrently with the Discovery
// Programme's long orbital durations, giving the player
// meaningful work during DP-01 through DP-03.
//
// Narrative thread:
//   The orbital science campaign has been running above Kerbin,
//   but we know less about our own surface than we should.
//   The scan programme systematically fixes that — terrain,
//   resources, and ground-truth science from multiple biomes —
//   giving mission planning the complete picture of our own
//   planet that every later programme is built on.
//
// KS-01  Kerbin Altimetry Survey  — polar orbit, 80% coverage
// KS-02  Kerbin Resource Survey   — dedicated probe, 80% coverage
// KS-03  Kerbin Biome Catalogue   — surface science, 5 biomes
//
// Gate chain:
//   DP_01 complete → KS-01 + KS-03 (both unlock in parallel)
//   KS-01 complete → KS-02
// ================================================================


// ----------------------------------------------------------------
// KS-01: KERBIN ALTIMETRY SURVEY
// earlyBase x1.5  Stock: ~75,000 total
//
// A SCANsat radar scanner in polar orbit builds the terrain model
// mission planning needs before designing approach profiles for later targets.
// Runs concurrently with DP-02.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KS_01_KerbinAltimetry
    group           = TheKerbinScanProgram

    title           = Kerbin Scan: Altimetry Survey
    genericTitle    = Map Kerbin's surface with a radar altimetry scanner
    genericDescription = Deploy a radar altimetry scanner to polar Kerbin orbit and map 80% of the surface.
    description     = We have a probe in orbit. The first gravitational survey confirmed two bodies in the night sky; while the teams work out what they are, there is no reason we cannot also point instruments downward in the meantime. The radar altimetry campaign will build the first complete terrain model of Kerbin's surface — something mission planning has needed for years, and exactly the baseline we will want before we start designing approach and landing profiles for wherever we go next.
    synopsis        = Deploy a lo-res altimetry scanner to a polar Kerbin orbit. Achieve 80% surface coverage.
    completedMessage = Altimetry coverage complete. Kerbin's terrain model is built. Mission planning now has the baseline it needs for everything that comes next.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 1.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_polar    = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_survey   = Round(@stepPool * 4.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 6
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels for long-duration operation
    }

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 150000
        disableOnStateChange = True
        title                = Achieve a stable orbit above 150km
        rewardFunds          = @/step_orbit
        rewardReputation     = 2
    }

    PARAMETER
    {
        name                 = PolarOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        minAltitude          = 150000
        minInclination       = 80.0
        maxInclination       = 100.0
        disableOnStateChange = True
        title                = Establish a polar orbit (80–100 degrees inclination) for full surface coverage
        rewardFunds          = @/step_polar
        rewardReputation     = 2
    }

    PARAMETER
    {
        name        = AltimetryCampaign
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = AltimetryLoRes
        targetBody  = HomeWorld()
        title       = Achieve 80% lo-res altimetry coverage of Kerbin
        rewardFunds = @/step_survey
        rewardReputation = 3
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Terrain model complete
            condition = PARAMETER_COMPLETED
            parameter = AltimetryCampaign

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = The terrain model is excellent. Mission planning has everything they need — full-resolution coverage, every major landform catalogued, elevation accurate to within a few metres. This is the baseline we have been missing for years, and proof the technique works: the same scanner that mapped home will map wherever we point it next.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedFF03
        type         = CompleteContract
        contractType = FF_03_FirstOrbit
        title        = First uncrewed orbit must be complete
    }

    REQUIREMENT
    {
        name  = ScannerUnlocked
        type  = PartUnlocked
        part  = scansat-radar-poseidon-3b-1
        title = SCANsat lo-res altimetry scanner must be unlocked
    }
}


// ----------------------------------------------------------------
// KS-02: KERBIN RESOURCE SURVEY
// earlyBase x1.5  Stock: ~75,000 total
//
// A dedicated resource scanner probe maps the surface for ore
// and mineral deposits. Unlocks after KS-01 — sequenced so the
// player has the terrain model before the resource overlay.
// Narrative: a full subsurface composition map of Kerbin, so we
// know where the extractable resources are before we build out.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KS_02_KerbinResourceSurvey
    group           = TheKerbinScanProgram

    title           = Kerbin Scan: Resource Survey
    genericTitle    = Map Kerbin's surface resources from orbit
    genericDescription = Deploy a dedicated resource scanner probe to Kerbin orbit and complete an 80%-coverage resource mapping campaign.
    description     = The altimetry data is in. Now we go deeper — literally. An orbital resource scanner will build a subsurface composition map of the entire surface: ore deposits, mineral concentrations, and the broad distribution of extractable material that will matter enormously when we start thinking about surface operations beyond Kerbin. The sooner we know where the resources are, the sooner we can plan the mining and refuelling infrastructure that every later programme will depend on.
    synopsis        = Deploy a dedicated resource scanner probe to Kerbin orbit. Achieve 80% resource scan coverage of Kerbin.
    completedMessage = Resource survey complete. The surface composition map is built. We now know where every major ore concentration on Kerbin sits — and mission planning has what it needs to start siting surface operations.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 1.5 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        stepPool      = Round(@contractTotal * 0.60 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_orbit    = Round(@stepPool * 3.0 / 10.0 / 5000) * 5000
        step_survey   = Round(@stepPool * 7.0 / 10.0 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 6
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 150000
        disableOnStateChange = True
        title                = Achieve a stable orbit above 150km
        rewardFunds          = @/step_orbit
        rewardReputation     = 2
    }

    PARAMETER
    {
        name        = ResourceCampaign
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = ResourceLoRes
        targetBody  = HomeWorld()
        title       = Achieve 80% resource scan coverage of Kerbin
        rewardFunds = @/step_survey
        rewardReputation = 3
    }

    BEHAVIOUR
    {
        name      = MarkKerbinResourceScanned
        type      = KASAResourceScanned
        body      = Kerbin
        parameter = ResourceCampaign
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The resource map
            condition = PARAMETER_COMPLETED
            parameter = ResourceCampaign

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = The resource map is better than I expected. There are workable ore concentrations in several biomes — more than enough to support surface mining once we are ready to build out there. I am flagging the highest-grade deposits for mission planning now. When the time comes to put extraction hardware on the ground, on Kerbin or anywhere else, this is the survey that tells us where to put it.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKS01
        type         = CompleteContract
        contractType = KS_01_KerbinAltimetry
        title        = Kerbin Altimetry Survey must be complete
    }
}


// ----------------------------------------------------------------
// KS-03a: KERBIN BIOME SCAN
// Requires a SCANsat multispectral (biome) scanner in orbit.
// Gates KS-03b — must know where the biomes are before collecting
// science from them. Unlocks after KS_01 (we have the terrain
// model; now we map the biome distribution).
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KS_03a_KerbinBiomeScan
    group           = TheKerbinScanProgram

    title           = Kerbin Scan: Biome Survey
    genericTitle    = Map Kerbin's surface biomes from orbit
    genericDescription = Deploy a SCANsat multispectral scanner to Kerbin orbit and achieve 80% biome coverage of the surface.
    description     = The altimetry scan has given us a terrain model. But terrain is not the same as biome — we need to know what kind of surface we are looking at, not just its shape. The multispectral scanner will map the biome distribution across Kerbin's entire surface, giving our science teams the data they need to plan targeted collection missions.\n\nOnce we know how the biomes are distributed, the science teams can prioritise which surface sites are worth a dedicated collection mission and which can wait.
    synopsis        = Deploy a SCANsat multispectral scanner to Kerbin orbit. Achieve 80% biome scan coverage.
    completedMessage = Biome survey complete. The full surface distribution map is in. The science teams have their target list and can start planning ground-truth collection.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    advanceFunds      = 8000
    rewardFunds       = 20000
    rewardReputation  = 5
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name       = HasPower
        type       = PartValidation
        partModule = ModuleDeployableSolarPanel
        minCount   = 1
        title      = The probe must carry deployable solar panels
    }

    PARAMETER
    {
        name                 = AchieveOrbit
        type                 = Orbit
        targetBody           = HomeWorld()
        situation            = ORBITING
        minAltitude          = 150000
        disableOnStateChange = True
        title                = Achieve a stable orbit above 150km
        rewardFunds          = 5000
        rewardReputation     = 1
    }

    PARAMETER
    {
        name        = BiomeCampaign
        type        = SCANsatCoverage
        coverage    = 80.0
        scanType    = Biome
        targetBody  = HomeWorld()
        title       = Achieve 80% biome scan coverage of Kerbin
        rewardFunds = 15000
        rewardReputation = 3
    }

    REQUIREMENT
    {
        name         = CompletedKS01
        type         = CompleteContract
        contractType = KS_01_KerbinAltimetry
        title        = Kerbin Altimetry Survey must be complete
    }

    // SCANsatCoverage with scanType=Biome implicitly requires the biome scanner
    // to be in orbit — no separate PartValidation needed. Coverage won't
    // register until the correct scanner has passed over.
}


// ----------------------------------------------------------------
// KS-03b: KERBIN SURFACE SCIENCE SURVEY
// Collect surface science from all 9 natural Kerbin biomes.
// Each biome is a separate completion step — any order is fine.
// Gates on KS_03a complete (we know where the biomes are now).
//
// Biomes: Grasslands, Highlands, Shores, Water, Deserts,
//         Tundra, Ice Caps, Mountains, Badlands
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = KS_03b_KerbinScienceSurvey
    group           = TheKerbinScanProgram

    title           = Kerbin Scan: Surface Science Survey
    genericTitle    = Collect surface science from all nine Kerbin biomes
    genericDescription = Collect and transmit science data from all nine natural Kerbin surface biomes.
    description     = The biome map is complete. Now we ground-truth it. Each of Kerbin's nine natural biomes has its own surface conditions, composition, and baseline signature. We want science data from all of them: landed instruments, surface samples, EVA reports.\n\nThe science teams want the full set — a complete baseline of what is normal across every biome, so that anything unusual we encounter later, anywhere in the Kerbin system, can be measured against solid ground-truth from home.
    synopsis        = Collect and transmit science data from all nine natural Kerbin biomes.
    completedMessage = All nine biomes surveyed. The dataset is complete. We now have a full ground-truth baseline for every surface type on Kerbin — exactly the reference the science teams wanted.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = HomeWorld()
    minExpiry  = 1
    maxExpiry  = 730

    advanceFunds      = 5000
    rewardFunds       = 10000
    rewardReputation  = 8
    failureReputation = 1
    failureFunds      = 0

    PARAMETER
    {
        name           = ScienceGrasslands
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Grasslands
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Grasslands
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceHighlands
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Highlands
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Highlands
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceShores
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Shores
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Shores
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceWater
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Water
        situation      = SrfSplashed
        recoveryMethod = Transmit
        title          = Collect surface science from the Water (splashdown)
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceDeserts
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Deserts
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Deserts
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceTundra
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Tundra
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Tundra
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceIceCaps
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Ice Caps
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Ice Caps
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceMountains
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Mountains
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Mountains
        rewardFunds    = 2000
        rewardReputation = 1
    }

    PARAMETER
    {
        name           = ScienceBadlands
        type           = CollectScience
        targetBody     = HomeWorld()
        biome          = Badlands
        situation      = SrfLanded
        recoveryMethod = Transmit
        title          = Collect surface science from the Badlands
        rewardFunds    = 2000
        rewardReputation = 1
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Ground truth
            condition = CONTRACT_SUCCESS

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = Nine biomes, every one ground-truthed against the orbital maps. The surface readings line up with what the instruments predicted from orbit — which means we can trust those instruments when we point them at the Mun and Minmus. We finally understand our own planet well enough to go and measure someone else's.
            }
        }
    }

    REQUIREMENT
    {
        name         = CompletedKS03a
        type         = CompleteContract
        contractType = KS_03a_KerbinBiomeScan
        title        = Kerbin Biome Scan must be complete
    }
}