// ================================================================
// KASA — THE MUN & MINMUS ANOMALIES
// ================================================================
// Bonus exploration contracts for the surface anomalies on the
// Mun and Minmus. These unlock once the relevant body has been
// fully surface-mapped (biome scan complete, stage 6), so the
// player has "spotted them in the survey data" before being
// sent to investigate.
//
// Contracts:
//   MA_Memorial    — the Armstrong-analogue memorial (standalone)
//   MA_Monoliths   — 3 Mun monoliths (DATA_EXPAND), ties to TMA net
//   MA_Arches      — 3 Mun arches (DATA_EXPAND), fly-through
//   MA_UFO         — the crashed saucer at the south pole
//   MN_Monolith    — the lone Minmus monolith
//
// Gating:
//   KSP_01 (Mun biome scan)     → MA_Memorial, MA_Arches, MA_UFO
//   KSP_01 + KA_TMA0 (network)  → MA_Monoliths
//   KSP_03 (Minmus biome scan)  → MN_Monolith
//
// Coordinates sourced from stock KSP 1.12.x anomaly locations.
// ================================================================


// ----------------------------------------------------------------
// MA-MEMORIAL: THE MUN MEMORIAL
// A quiet, non-TMA contract. A memorial plaque to a lost kerbal.
// earlyBase x2.0 on the Mun multiplier.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = MA_Memorial
    group           = TheAnomalyProgram

    title           = Anomaly: The Mun Memorial
    genericTitle    = Investigate the regular object in the Mun's eastern mare
    description     = The Mun survey returned something unexpected in one of the eastern mare regions — a small, regular object sitting alone on the flat basalt. It is not a monolith; the profile is wrong, too low and too flat. It is not natural either. The imaging team enhanced the frames and found what appears to be a flat plate mounted on a low platform, with markings on its surface.\n\nThere is no record of any mission to this location. There is no record of anyone reaching the Mun at all before our programme. And yet someone left something here, deliberately, a long time ago. Gene wants a kerbal on the ground to read what the plate says.
    synopsis        = Land a kerbal near the object in the eastern mare and investigate it on foot.
    completedMessage = The plate has been read. Nobody at KASA is saying much right now.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    rewardScience     = 15
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitMemorial
        type  = All
        title = Investigate the Mun Memorial on foot

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = AtMemorial
            type     = VisitWaypoint
            index    = 0
            distance = 20
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = Mun Memorial
            icon      = KASA/Icons/unknown
            latitude  = 0.709317
            longitude = 22.736462
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Mun Memorial
            condition = PARAMETER_COMPLETED
            parameter = VisitMemorial

            KERBAL
            {
                characterName = Bob Kerman
            }

            TEXT
            {
                text = It's a plaque. Mounted on a little descent stage, the kind you'd build for a one-way trip you already knew you weren't coming back from. The metal's older than anything we make. There's a name on it, a kerbal name, one that isn't in any of our records, and a date from before KASA existed. And a line underneath. It reads: "We followed the markers as far as we could carry ourselves. Let whoever comes after finish the road." I'm going to sit here a minute.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Mun Memorial
            condition = PARAMETER_COMPLETED
            parameter = VisitMemorial

            INSTRUCTOR
            {
                name      = Instructor_Gene
                animation = idle
            }

            TEXT
            {
                text = We always assumed we were first. Every kerbal who ever looked up assumed that. But somebody stood where you're standing, before any of us — following something, reaching for something, far enough out to build that and leave it behind. Markers, the plaque said. I don't know yet what they were following. But I have a feeling we are going to find out we're following it too. Bring back the imagery, all of it. And — Bob — take your time up there. They earned that much from us.
            }
        }
    }

    REQUIREMENT
    {
        name         = MunMapped
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = The Mun must be fully surveyed (KSP-01 complete)
    }
}


// ----------------------------------------------------------------
// MA-MONOLITHS: THE MUN MONOLITHS
// Three monoliths, one contract each via DATA_EXPAND.
// Ties into the TMA network — the Kerbin monolith pointed here.
// Gated on KA_TMA0 (network activation) plus Mun mapping.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = MA_Monoliths
    group           = TheAnomalyProgram

    title           = Anomaly: Investigate @/anomalyName on the Mun
    genericTitle    = Investigate a monolith signal site on the Mun

    description     = When the team made contact with TMA-0 on Kerbin, it broadcast in several directions at once. Three of those signals terminated here, on the Mun. We have the coordinates. Each one corresponds to a surface object matching the TMA-0 profile exactly — tall, black, rectangular, radiating the same electromagnetic signature. The network did not just span Kerbin. It reaches across space, and the Mun is part of it.
    synopsis        = Land a kerbal at @/anomalyName and investigate it on foot.
    completedMessage = @/anomalyName + " investigated. Another node in the network confirmed."

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 3
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA_EXPAND
    {
        type         = int
        anomalyIndex = [0, 1, 2]
    }

    DATA
    {
        type = List<string>
        anomalyNames = [ "Mun Monolith Alpha", "Mun Monolith Beta", "Mun Monolith Gamma" ]
        requiredValue = false
    }

    DATA
    {
        type = List<double>
        latitudes  = [ -9.831389, 57.66,     -82.206111 ]
        longitudes = [ 25.9175,   9.142222,  102.928611 ]
        requiredValue = false
    }

    DATA
    {
        type        = string
        anomalyName = @/anomalyNames.ElementAt(@/anomalyIndex)
        uniquenessCheck = CONTRACT_ALL
    }

    DATA
    {
        type      = double
        latitude  = @/latitudes.ElementAt(@/anomalyIndex)
        longitude = @/longitudes.ElementAt(@/anomalyIndex)
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 3.0 / 5000) * 5000
        advance   = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus     = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 30
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitMonolith
        type  = All
        title = Investigate @/anomalyName on foot

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = AtMonolith
            type     = VisitWaypoint
            index    = 0
            distance = 20
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = @/anomalyName
            icon      = KASA/Icons/monolith
            latitude  = @/latitude
            longitude = @/longitude
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = @/anomalyName
            condition = PARAMETER_COMPLETED
            parameter = VisitMonolith

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = Identical. Down to the proportions, down to the material, down to the emission frequency. This is the same object as TMA-0, manufactured to the same specification, placed here deliberately. And as before — the moment your kerbal got close, it changed its broadcast. It knows we are expanding. It is updating the network. Whoever built these has been waiting a very long time for someone to start connecting the dots, and we have just obliged them.
            }
        }
    }

    REQUIREMENT
    {
        name         = MunMapped
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = The Mun must be fully surveyed (KSP-01 complete)
    }

    REQUIREMENT
    {
        name         = NetworkActive
        type         = CompleteContract
        contractType = KA_TMA0
        title        = TMA-0 contact must have been made
    }
}


// ----------------------------------------------------------------
// MA-ARCHES: THE MUN ARCHES
// Three arches, one contract each via DATA_EXPAND.
// Fly-through rather than land-and-EVA (Option A: waypoint at
// arch centre at mid-height; vessel must pass within 40m while
// flying). Wernher speculates they are gateways.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = MA_Arches
    group           = TheAnomalyProgram

    title           = Anomaly: Fly through @/anomalyName
    genericTitle    = Fly a vessel through one of the Mun arches

    description     = The survey found three more structures on the Mun, and these are nothing like the monoliths. They are arches — vast curved spans of dark material, each over a hundred metres tall, standing alone on the surface with nothing supporting the curve. They emit no signal. They do nothing. They simply stand there, open, like doorways with nothing on either side.\n\nWernher has a theory, and for once he is reluctant to say it out loud. He thinks they are gateways — markers left to be passed through rather than visited. He wants to test it the only way he can think of: fly a vessel through the opening and see what the instruments record on the other side.
    synopsis        = Fly a vessel through the opening of @/anomalyName.
    completedMessage = Transit of @/anomalyName confirmed. Wernher is reviewing the telemetry very carefully.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 3
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA_EXPAND
    {
        type         = int
        anomalyIndex = [0, 1, 2]
    }

    DATA
    {
        type = List<string>
        anomalyNames = [ "the Eastern Arch", "the Western Arch", "the Highland Arch" ]
        requiredValue = false
    }

    DATA
    {
        type = List<double>
        latitudes  = [ 12.450556, -12.471667,  2.463056 ]
        longitudes = [ 39.195833, -140.961111, 81.530833 ]
        requiredValue = false
    }

    DATA
    {
        type        = string
        anomalyName = @/anomalyNames.ElementAt(@/anomalyIndex)
        uniquenessCheck = CONTRACT_ALL
    }

    DATA
    {
        type      = double
        latitude  = @/latitudes.ElementAt(@/anomalyIndex)
        longitude = @/longitudes.ElementAt(@/anomalyIndex)
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 2.0 / 5000) * 5000
        advance   = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus     = Round(@contractTotal * 0.20 / 5000) * 5000
        step_fly  = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 15
    rewardScience     = 25
    failureReputation = 2
    failureFunds      = 0

    PARAMETER
    {
        name  = FlyThrough
        type  = All
        title = Fly through @/anomalyName

        PARAMETER
        {
            name        = IsFlying
            type        = VesselIsType
            vesselType  = Ship
        }

        PARAMETER
        {
            name     = ThroughArch
            type     = VisitWaypoint
            index    = 0
            distance = 40
            showMessages = true
        }

        rewardFunds = @/step_fly
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = @/anomalyName
            icon      = KASA/Icons/arch
            latitude  = @/latitude
            longitude = @/longitude
            altitude  = 60.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Transit confirmed
            condition = PARAMETER_COMPLETED
            parameter = FlyThrough

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodA
            }

            TEXT
            {
                text = You passed through. And for a fraction of a second, as the vessel crossed the plane of the arch, every instrument on board recorded the same anomaly — a momentary spike, then nothing. No damage. No change to trajectory. But the timestamp on the spike does not match the timestamp on the surrounding telemetry. By a margin too small to be an error and too large to be coincidence. I do not yet know what these arches are. But they are not decorative. Bring me more passes. I need to understand what just happened.
            }
        }
    }

    REQUIREMENT
    {
        name         = MunMapped
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = The Mun must be fully surveyed (KSP-01 complete)
    }
}


// ----------------------------------------------------------------
// MA-UFO: THE CRASHED SAUCER
// Single contract, south polar region. Links to the Kerbin
// arctic UFO crash site (KA_UFO_Kerbin).
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = MA_UFO
    group           = TheAnomalyProgram

    title           = Anomaly: The Mun Crash Site
    genericTitle    = Investigate the crashed object near the Mun's south pole
    description     = There is a second one.\n\nWhen we found the crashed saucer in Kerbin's arctic, we assumed it was unique — a one-off, a fluke. The Mun survey has found another, near the south pole, and it is the same craft. Same disc profile, same scorched hull, same impossible geometry. Two identical wrecks, one on Kerbin and one on the Mun, both crashed, both ancient.\n\nWhoever they were, there were enough of them to lose two craft. Get a kerbal down to the south pole and document everything.
    synopsis        = Land a kerbal at the crash site near the Mun's south pole and investigate it.
    completedMessage = The second wreck has been documented. The picture is getting stranger, not clearer.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Mun
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 3.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 30
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitUFO
        type  = All
        title = Investigate the crash site on foot

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = AtUFO
            type     = VisitWaypoint
            index    = 0
            distance = 20
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = Mun Crash Site
            icon      = KASA/Icons/unknown
            latitude  = -70.945484
            longitude = -68.122603
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Mun Crash Site
            condition = PARAMETER_COMPLETED
            parameter = VisitUFO

            KERBAL
            {
                characterName = Valentina Kerman
            }

            TEXT
            {
                text = It's the same ship. I've seen the arctic photos a hundred times and this is identical, right down to the way the hull split on impact. Except this one's been here longer — a lot longer. There's micrometeorite pitting all over it that the Kerbin one doesn't have. Whatever these things were, they came here first, and they came to Kerbin second. We weren't being visited. We were being approached.
            }
        }

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Mun Crash Site
            condition = PARAMETER_COMPLETED
            parameter = VisitUFO

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }

            TEXT
            {
                text = Two craft. The monoliths on Kerbin and the Mun, all networked. The arches. The memorial from a mission that predates recorded history. Valentina is right — this is not a series of isolated curiosities. It is a pattern, and the pattern has a direction. Everything points outward, away from Kerbol. I think the monoliths are not the end of this story. I think they are directions.
            }
        }
    }

    REQUIREMENT
    {
        name         = MunMapped
        type         = CompleteContract
        contractType = KSP_01_MunProbe
        title        = The Mun must be fully surveyed (KSP-01 complete)
    }

    // This contract is the synthesis: its closing dialogue ties together the
    // arctic crash, the monoliths, the arches and the memorial. Gate it behind
    // all of them so nothing is referenced before the player has seen it.
    REQUIREMENT
    {
        name         = ArcticCrashFound
        type         = CompleteContract
        contractType = KA_UFO_Kerbin
        title        = The Kerbin arctic crash site must have been investigated
    }

    REQUIREMENT
    {
        name         = MemorialFound
        type         = CompleteContract
        contractType = MA_Memorial
        title        = The Mun Memorial must have been investigated
    }

    // MA_Monoliths / MA_Arches use DATA_EXPAND, so they exist only as the
    // expanded children MA_Monoliths.0/.1/.2 and MA_Arches.0/.1/.2 --
    // CompleteContract cannot resolve the parent name. Require each child.
    REQUIREMENT
    {
        name         = MonolithsFound0
        type         = CompleteContract
        contractType = MA_Monoliths.0
        title        = Mun Monolith Alpha must have been investigated
    }

    REQUIREMENT
    {
        name         = MonolithsFound1
        type         = CompleteContract
        contractType = MA_Monoliths.1
        title        = Mun Monolith Beta must have been investigated
    }

    REQUIREMENT
    {
        name         = MonolithsFound2
        type         = CompleteContract
        contractType = MA_Monoliths.2
        title        = Mun Monolith Gamma must have been investigated
    }

    REQUIREMENT
    {
        name         = ArchesFound0
        type         = CompleteContract
        contractType = MA_Arches.0
        title        = The first Mun arch must have been investigated
    }

    REQUIREMENT
    {
        name         = ArchesFound1
        type         = CompleteContract
        contractType = MA_Arches.1
        title        = The second Mun arch must have been investigated
    }

    REQUIREMENT
    {
        name         = ArchesFound2
        type         = CompleteContract
        contractType = MA_Arches.2
        title        = The third Mun arch must have been investigated
    }
}


// ----------------------------------------------------------------
// MN-MONOLITH: THE MINMUS MONOLITH
// Single contract. The lone monolith in the Minmus flats.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = MN_Monolith
    group           = TheAnomalyProgram

    title           = Anomaly: The Minmus Monolith
    genericTitle    = Investigate the monolith on Minmus
    description     = One more signal terminated somewhere we did not expect: Minmus. The little frozen oddity has a monolith of its own, standing alone on one of the great crystalline flats. It matches the TMA profile exactly, like the others.\n\nMinmus is the gentlest landing in the whole system — low gravity, flat ground, no atmosphere to fight. If there is an easy node in this network to reach, this is it. Send a kerbal to stand beside it and find out what it has to say.
    synopsis        = Land a kerbal beside the Minmus monolith and investigate it on foot.
    completedMessage = The Minmus monolith has been investigated. The network grows.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Minmus
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 4.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 30
    failureReputation = 3
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitMonolith
        type  = All
        title = Investigate the Minmus Monolith on foot

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = AtMonolith
            type     = VisitWaypoint
            index    = 0
            distance = 20
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator

        WAYPOINT
        {
            name      = Minmus Monolith
            icon      = KASA/Icons/monolith
            latitude  = 23.776944
            longitude = 60.045833
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The Minmus Monolith
            condition = PARAMETER_COMPLETED
            parameter = VisitMonolith

            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_nodB
            }

            TEXT
            {
                text = Another node, and the same behaviour — it sensed the kerbal and updated its broadcast. But this one is different in one respect. The signal it sent after contact was stronger, and it was aimed. Not scattered across the surface like the others. It pointed up and out, at a fixed bearing, into deep space. I have been plotting these vectors as we find them, and they are beginning to converge. Whatever lies at the point they are all aiming toward, I believe that is where this network wants us to go.
            }
        }
    }

    REQUIREMENT
    {
        name         = MinmusMapped
        type         = CompleteContract
        contractType = KSP_03_MinmusProbe
        title        = Minmus must be fully surveyed (KSP-03 complete)
    }

    // "One more signal" / converging vectors only make sense once the wider
    // network is established. Requiring the Mun monoliths also guarantees
    // TMA-0 contact (MA_Monoliths itself gates on KA_TMA0).
    // MA_Monoliths is DATA_EXPAND -- require its expanded children.
    // (Any one of them establishes the network; requiring Alpha keeps the
    // gate light while still guaranteeing TMA-0 contact transitively.)
    REQUIREMENT
    {
        name         = MunMonolithsFound
        type         = CompleteContract
        contractType = MA_Monoliths.0
        title        = A Mun monolith must have been investigated
    }
}
