// ================================================================
// KASA — THE CONVERGENCE  (outer anomaly arc + climax)
// ================================================================
// The monolith network's vectors point outward. Three outer bearings
// triangulate the convergence point; collecting all three unlocks the
// finale at the wreck on Bop.
//
// TRAIL ORDER:
//   MN_Monolith (inner trail ends) ->
//     AN_DunaFace + AN_DresMonolith + AN_PolMonolith (bearings, any order) ->
//       AN_BopWreck (finale — the crashed vessel, the grave)
//
// >>> PLACEHOLDER COORDINATES — VERIFY / RETUNE AGAINST YOUR INSTALL <<<
//   AN_DunaFace : the STOCK Duna Face easter egg. Coords below are a
//                 placeholder — set them to the real Face location (or
//                 swap the WAYPOINT for a PQS_CITY node if you know the
//                 pqsCity name, the way KA_IslandAirfield does it).
//   AN_DresMonolith / AN_PolMonolith : Dres and Pol have NO stock
//                 monolith. These are NARRATIVE waypoints — the player
//                 lands at the spot and the story places a monolith
//                 there; there is no physical object to see. If you want
//                 real objects later, that's a PQSCity/Kerbal Konstructs
//                 static job (out of scope for config). Coords are an
//                 evocative placeholder; move them wherever reads best.
//   AN_BopWreck : the STOCK "dead Kraken" on Bop. Coords are a
//                 placeholder — set them to the real wreck location.
//
// All reward multipliers FLAGGED (deep-space anomaly tier), balance TBC.
// ================================================================


// ----------------------------------------------------------------
// AN-DUNAFACE — first outer bearing (the Duna Face)
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = AN_DunaFace
    group           = TheAnomalyProgram

    title           = Anomaly: The Face at Duna
    genericTitle    = Investigate the structure the vectors point through at Duna
    genericDescription = Reach the anomalous structure on Duna that lies along one of the converging monolith vectors.
    description     = Ever since the Minmus monolith, the team has been plotting the signal vectors from the whole network, and they do not scatter — they lean, together, outward. One of them runs clean through Duna.\n\nAnd there is something on Duna to run through. The survey frames show a structure in the highlands — not a monolith, something larger and stranger, a formation with a symmetry that no wind or impact makes. It sits exactly on the vector. Get a craft down beside it and record everything. Each of these we reach is a bearing; enough bearings and we can fix where all of this is pointing.
    synopsis        = Land a craft at the anomalous structure on Duna and record it. This fixes the first outer bearing.
    completedMessage = The Duna structure is logged and the bearing is fixed. One line on the chart. It needs at least two more to cross.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Duna
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        // anomaly deep-space tier x6.0 (FLAGGED)
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 6.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 18
    rewardScience     = 20
    failureReputation = 4
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitFace
        type  = All
        title = Reach the structure on Duna and record it

        PARAMETER
        {
            name       = LandedOnDuna
            type       = ReachState
            targetBody = Duna
            situation  = LANDED
        }

        PARAMETER
        {
            name     = AtFace
            type     = VisitWaypoint
            index    = 0
            distance = 100
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator
        WAYPOINT
        {
            name      = The Face
            icon      = KASA/Icons/monolith
            latitude  = 0.72       // PLACEHOLDER — real Duna Face location
            longitude = 0.0        // PLACEHOLDER
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = First bearing
            condition = PARAMETER_COMPLETED
            parameter = VisitFace
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }
            TEXT
            {
                text = It is carved. Not weathered into shape — carved, and old past reckoning, and it sits on the vector to the tenth of a degree. Whatever laid the monoliths laid this too, and it points the same way they all point. I have drawn the line through it and out into the dark. Bring me two more and I will tell you where the lines cross.
            }
        }
    }

    REQUIREMENT
    {
        name         = InnerTrailDone
        type         = CompleteContract
        contractType = MN_Monolith
        title        = The Minmus monolith must have been investigated (inner trail complete)
    }

    REQUIREMENT
    {
        name     = DunaDetected
        type     = KASABodyDiscoveryStage
        body     = Duna
        minStage = 1
        title    = Duna must have been detected
    }
}


// ----------------------------------------------------------------
// AN-DRESMONOLITH — second outer bearing (narrative monolith)
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = AN_DresMonolith
    group           = TheAnomalyProgram

    title           = Anomaly: The Dres Monolith
    genericTitle    = Investigate the monolith signal site on Dres
    genericDescription = Reach the monolith on Dres that lies along one of the converging vectors.
    description     = A second vector runs through Dres — the little grey world almost nobody had a reason to visit until now. The network says there is a monolith down in the canyon country, sitting on the line. Nobody put it there. Nobody has ever been to Dres.\n\nGet a craft down to it. Record the site. This is the second bearing, and two lines crossing is already more than we had.
    synopsis        = Land a craft at the monolith on Dres and record it. This fixes the second outer bearing.
    completedMessage = Dres bearing fixed. Two lines now, and they cross somewhere far out. One more will turn a crossing into a point.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Dres
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 6.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 18
    rewardScience     = 20
    failureReputation = 4
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitDresMonolith
        type  = All
        title = Reach the monolith on Dres and record it

        PARAMETER
        {
            name       = LandedOnDres
            type       = ReachState
            targetBody = Dres
            situation  = LANDED
        }

        PARAMETER
        {
            name     = AtDresMonolith
            type     = VisitWaypoint
            index    = 0
            distance = 100
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator
        WAYPOINT
        {
            name      = Dres Monolith
            icon      = KASA/Icons/monolith
            latitude  = 0.0        // PLACEHOLDER — narrative site (e.g. the canyon)
            longitude = 90.0       // PLACEHOLDER
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = Second bearing
            condition = PARAMETER_COMPLETED
            parameter = VisitDresMonolith
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = idle_wonder
            }
            TEXT
            {
                text = The same stone, the same silence, the same impossible alignment — on a world no one had ever set foot on. It has been waiting here, on the line, for longer than we have had names for the stars. Two bearings now. They cross far out, past Dres, past everything we have charted. One more and I will have a point, not a guess.
            }
        }
    }

    REQUIREMENT
    {
        name         = InnerTrailDone
        type         = CompleteContract
        contractType = MN_Monolith
        title        = The Minmus monolith must have been investigated (inner trail complete)
    }

    REQUIREMENT
    {
        name     = DresDetected
        type     = KASABodyDiscoveryStage
        body     = Dres
        minStage = 1
        title    = Dres must have been detected
    }
}


// ----------------------------------------------------------------
// AN-POLMONOLITH — third outer bearing (narrative monolith, Jool moon)
// Pol is revealed on Jool SOI entry, so reaching it here is the gate.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = AN_PolMonolith
    group           = TheAnomalyProgram

    title           = Anomaly: The Pol Monolith
    genericTitle    = Investigate the monolith signal site on Pol
    genericDescription = Reach the monolith on Pol that lies along the last of the converging vectors.
    description     = The last vector runs out into the Jool system and terminates on Pol — the small, strange, mustard-coloured moon out at the edge of the giant's grip. The network says there is a monolith on it. Getting there means crossing to Jool and working your way out to its farthest useful moon, but the line is unambiguous.\n\nReach the monolith. Record it. This is the third bearing — and with three, the guessing ends.
    synopsis        = Land a craft at the monolith on Pol and record it. This fixes the final bearing and resolves the convergence.
    completedMessage = Third bearing fixed. The lines have stopped being lines. They are a point now, and it has an address.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Significant

    targetBody = Pol
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        contractTotal = Round(Round(HomeWorld().Radius() / 60000.0) * 5000 * 6.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.60 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 20
    rewardScience     = 22
    failureReputation = 4
    failureFunds      = 0

    PARAMETER
    {
        name  = VisitPolMonolith
        type  = All
        title = Reach the monolith on Pol and record it

        PARAMETER
        {
            name       = LandedOnPol
            type       = ReachState
            targetBody = Pol
            situation  = LANDED
        }

        PARAMETER
        {
            name     = AtPolMonolith
            type     = VisitWaypoint
            index    = 0
            distance = 100
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator
        WAYPOINT
        {
            name      = Pol Monolith
            icon      = KASA/Icons/monolith
            latitude  = 0.0        // PLACEHOLDER — narrative site
            longitude = 0.0        // PLACEHOLDER
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.5
            title     = The point resolves
            condition = PARAMETER_COMPLETED
            parameter = VisitPolMonolith
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = true_smileA
            }
            TEXT
            {
                text = Three bearings. Three lines. And they meet — cleanly, unarguably — at a single point, out in the Jool system, on Bop. Not near Bop. On it. And here is the part I have not said out loud yet: that point is also where the mass is. The perturbation we have chased since before we launched the Sentinel, the pull we could never account for — it is sitting exactly where the monoliths have been pointing all along. The trail and the tug are the same thing. Something is on Bop. Something big enough to bend orbits, and old enough to have laid a road across every world we know to lead us to it. We are going to Bop.
            }
        }
    }

    REQUIREMENT
    {
        name         = InnerTrailDone
        type         = CompleteContract
        contractType = MN_Monolith
        title        = The Minmus monolith must have been investigated (inner trail complete)
    }

    REQUIREMENT
    {
        name     = PolDetected
        type     = KASABodyDiscoveryStage
        body     = Pol
        minStage = 1
        title    = Pol must have been reached (Jool system)
    }
}


// ----------------------------------------------------------------
// AN-BOPWRECK — THE FINALE. The wreck at the convergence point.
// Requires all three bearings + Bop reached. Crewed: a kerbal stands
// at the wreck. Archaeological register — wonder and grief, quiet.
// ----------------------------------------------------------------
CONTRACT_TYPE
{
    name            = AN_BopWreck
    group           = TheAnomalyProgram

    title           = Anomaly: The Wreck
    genericTitle    = Reach the convergence point on Bop
    genericDescription = Land a crew at the convergence point on Bop and stand where the entire monolith network has been pointing.
    description     = Everything points here. Every monolith, every vector, the mass that has been pulling on our orbits since before we had a space programme — all of it converges on one spot on Bop, out at the far edge of the Jool system.\n\nThis is the end of the road the plaque on the Mun spoke of. Send a crew. Land at the convergence point. Whatever has been waiting out here, waiting long enough to lay a trail across a whole system so that someone, someday, would follow it — go and stand beside it. Bring back everything. And whoever you send: understand what you are walking up to before you get out of the craft.
    synopsis        = Land a crew at the convergence point on Bop and investigate the wreck on foot. This is the end of the trail.
    completedMessage = The crew is standing at the convergence point. Nobody at KASA is speaking. We followed the road all the way out, and we know now where it goes, and who else walked it before us.

    agent           = KASA
    cancellable     = true
    declinable      = true
    autoAccept      = false
    maxCompletions  = 1
    maxSimultaneous = 1
    prestige        = Exceptional

    targetBody = Bop
    minExpiry  = 1
    maxExpiry  = 730

    DATA
    {
        type          = double
        // finale tier x8.0 (FLAGGED)
        contractTotal = Round(Round(HomeWorld().Radius() / 40000.0) * 5000 * 8.0 / 5000) * 5000
        advance       = Round(@contractTotal * 0.20 / 5000) * 5000
        bonus         = Round(@contractTotal * 0.20 / 5000) * 5000
        step_land     = Round(@contractTotal * 0.25 / 5000) * 5000
        step_visit    = Round(@contractTotal * 0.35 / 5000) * 5000
        requiredValue = false
        title         = Reward breakdown
    }

    advanceFunds      = @/advance
    rewardFunds       = @/bonus
    rewardReputation  = 45
    rewardScience     = 60
    failureReputation = 10
    failureFunds      = 0

    PARAMETER
    {
        name       = LandCrewOnBop
        type       = ReachState
        targetBody = Bop
        situation  = LANDED
        title      = Land a crewed vessel on Bop
        rewardFunds = @/step_land
    }

    PARAMETER
    {
        name  = ReachTheWreck
        type  = All
        title = Reach the convergence point on foot

        PARAMETER
        {
            name       = OnEVA
            type       = VesselIsType
            vesselType = EVA
        }

        PARAMETER
        {
            name     = AtWreck
            type     = VisitWaypoint
            index    = 0
            distance = 50
        }

        rewardFunds = @/step_visit
    }

    BEHAVIOUR
    {
        name = WaypointGenerator
        type = WaypointGenerator
        WAYPOINT
        {
            name      = The Convergence
            icon      = KASA/Icons/unknown
            latitude  = 25.0       // PLACEHOLDER — real Bop "dead Kraken" location
            longitude = 25.0       // PLACEHOLDER
            altitude  = 0.0
        }
    }

    BEHAVIOUR
    {
        type = DialogBox

        // Beat 1 — the kerbal on the ground, first sight of it.
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.55
            title     = The Convergence
            condition = PARAMETER_COMPLETED
            parameter = ReachTheWreck
            KERBAL
            {
                characterName = Valentina Kerman
            }
            TEXT
            {
                text = It's a ship. Or it was. It's enormous — half-buried, broken along its length, older than the rock it's lying in. The hull's the same dark material as the monoliths, the same as the arches, the same as the little saucers we found crashed on Kerbin and the Mun. Those were its landing craft. This is the thing that carried them. It came all the way out here, and it came apart, and it never left. I'm standing next to it and I can't make myself say anything for a while.
            }
        }

        // Beat 2 — Wernher, the understanding. Wonder and grief.
        DIALOG_BOX
        {
            position = LEFT
            width    = 0.55
            title     = The end of the road
            condition = PARAMETER_COMPLETED
            parameter = ReachTheWreck
            INSTRUCTOR
            {
                name      = Instructor_Wernher
                animation = false_sadA
            }
            TEXT
            {
                text = We followed the signals for years, certain they were calling us somewhere. They were. Here. To this. It came a very long way and it did not survive the arrival — and the monoliths were its charts, a trail laid across our worlds so that someone, one day, could find it. We turned out to be that someone. And we were not even the first of our own to try. That marker on the Mun we found so early and could never place — those were Kerbals, reaching for exactly this, before we had the means to remember their names. They did not get this far. We did. We crossed the whole dark expecting to meet something, and instead we came to understand it, and to stand beside it properly at last. Some roads do not end in an answer. They end in a grave you were always going to reach. Bring them home, Val. Bring back everything. And take your time out there — two expeditions were trying to reach this place. You are the one that made it.
            }
        }
    }

    REQUIREMENT
    {
        name         = BearingDuna
        type         = CompleteContract
        contractType = AN_DunaFace
        title        = The Duna bearing must be fixed
    }

    REQUIREMENT
    {
        name         = BearingDres
        type         = CompleteContract
        contractType = AN_DresMonolith
        title        = The Dres bearing must be fixed
    }

    REQUIREMENT
    {
        name         = BearingPol
        type         = CompleteContract
        contractType = AN_PolMonolith
        title        = The Pol bearing must be fixed
    }

    REQUIREMENT
    {
        name     = BopReached
        type     = KASABodyDiscoveryStage
        body     = Bop
        minStage = 1
        title    = Bop must have been reached (Jool system)
    }
}
