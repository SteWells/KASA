@PART[ionEngine]:FOR[KASA]               // IX-6315 "Dawn"
{
    // Dawn's Conventional mode is its stock 4200s xenon/EC drive. The Gel
    // mode trades a little Isp (3500s) for markedly higher thrust — a
    // higher-thrust option for ion craft once Gel is available.
    @MODULE[ModuleEnginesFX] { %engineID = Conventional }

    MODULE
    {
        name      = ModuleEnginesFX
        engineID  = PrismaticGel
        thrustVectorTransformName = thrustTransform
        exhaustDamage   = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 8           // 4x stock ion thrust, slightly lower Isp -- see note
        heatProduction = 0
        EngineType = Generic
        PROPELLANT
        {
            name = PrismaticGel
            ratio = 1.0
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 3500
            key = 1 350
            key = 3 0.001
        }
    }

    MODULE
    {
        name              = MultiModeEngine
        primaryEngineID   = Conventional
        secondaryEngineID = PrismaticGel
        primaryEngineModeDisplayName   = Conventional
        secondaryEngineModeDisplayName = Prismatic Gel
        autoSwitch = false
    }
}
