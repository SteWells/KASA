// ================================================================
// KASA — PRISMATIC GEL ENGINE MODES
// ================================================================
// Gives a curated set of vacuum / transfer engines a second,
// switchable engine mode that burns Prismatic Gel — the refined
// propellant produced from Glassmonite at the Minmus refinery.
//
// Mechanism: MultiModeEngine (stock class name -- NOT "ModuleMultiModeEngine",
// which does not exist and throws "Cannot find a PartModule of typename").
//   * mode 1 "Conventional"  = the engine's stock propellant (untouched)
//   * mode 2 "Prismatic Gel" = pure PrismaticGel, ~3500s vac Isp, low thrust
// Switch in the PAW / staging. No tech unlock — the Gel mode is inert
// until Prismatic Gel actually exists (Minmus refinery online), so it
// is naturally gated by fuel availability.
//
// -------- BALANCE KNOBS (all provisional — tune freely) ----------
//   GEL_ISP     : vacuum Isp of the Gel mode          (3500)
//   maxThrust   : set equal to each engine's STOCK VACUUM THRUST.
//
//   WHY: burn duration ~= (ship mass x dV) / thrust, and is INDEPENDENT
//   of Isp. Low-thrust Gel modes therefore produced hour-long burns
//   without saving any time. Matching stock vacuum thrust means a Gel
//   burn takes the same wall-clock time as the stock engine would, but
//   delivers ~10x the dV from the same fuel mass. That is the reward.
//
//   NOTE: Gel is VACUUM-ONLY by design. The atmosphereCurve gives 350s
//   at sea level, so on the pad thrust is scaled by 350/3500 = 1/10th
//   and the ship will not move. This is intended, not a bug.
//
// -------- KNOWN FOLLOW-UPS ---------------------------------------
//   * No plume FX on the Gel mode yet (functional, just no visuals).
//   * thrustVectorTransformName assumed "thrustTransform" (stock
//     default). If an engine produces no thrust in Gel mode, its
//     transform is named differently — copy it from the stock module.
//   * DLC engines (Wolfhound, Rhino) simply no-op if the DLC is absent.
//
// Curated set + stock part names:
//   Terrier   liquidEngine3_v2       Poodle   liquidEngine2-2_v2
//     (NB: the Terrier's FOLDER is liquidEngineLV-909_v2 but its PART
//      name is liquidEngine3_v2 -- patch the PART name, not the folder.)
//   Nerv      nuclearEngine           Wolfhound LiquidEngineRE-J10
//   Rhino     Size3AdvancedEngine     Dawn     ionEngine
// ================================================================


// ----------------------------------------------------------------
// Shared Gel-mode atmosphere curve is inlined per engine so each can
// be tuned independently. Default: 3500s vac, useless at sea level.
// ----------------------------------------------------------------

@PART[liquidEngineMini_v2]:FOR[KASA]           // 48-72 "Spark"
{
    @MODULE[ModuleEnginesFX] { %engineID = Conventional }

    MODULE
    {
        name      = ModuleEnginesFX
        engineID  = PrismaticGel
        thrustVectorTransformName = thrustTransform
        exhaustDamage   = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 20          // = stock vacuum thrust (burn time matches stock)
        heatProduction = 175
        EngineType = Generic
        PROPELLANT
        {
            name = PrismaticGel
            ratio = 1.0
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 3500
            key = 1 350
            key = 3 0.001
        }
    }

    MODULE
    {
        name              = MultiModeEngine
        primaryEngineID   = Conventional
        secondaryEngineID = PrismaticGel
        primaryEngineModeDisplayName   = Conventional
        secondaryEngineModeDisplayName = Prismatic Gel
        autoSwitch = false
    }
}

