// ================================================================
// KOP-1 "SEEKER" Orbital Optics Platform
// ================================================================
// Model and textures from DMagic Orbital Science by DMagic
// Used under Creative Commons Attribution-NonCommercial-ShareAlike
// 4.0 International. https://github.com/DMagic1/Orbital-Science
//
// All modules converted to stock KSP equivalents.
// No DMagicOrbitalScience dependency required.
// ================================================================
PART
{
    name   = kop1_seeker
    module = Part
    author = DMagic (model/textures), KASA (cfg)

    MODEL
    {
        model = KASA/Parts/kop1_seeker/modelScope
        scale = 0.8, 0.8, 0.8
    }

    scale         = 1
    rescaleFactor = 1

    node_stack_bottom = 0.0, -0.3008, 0.0, 0.0, -1.0, 0.0, 0
    node_attach       = 0.0, -0.272,  0.0, 0.0, -1.0, 0.0, 0

    TechRequired = spaceExploration
    entryCost    = 8000
    cost         = 4000
    category     = Science
    subcategory  = 0

    title        = KOP-1 "Seeker" Orbital Optics Platform
    manufacturer = Kerbal Aeronautics and Space Administration
    description  = KASA's first orbital optical instrument. The Seeker was developed in response to the anomalous GRAVMAX readings recorded during the early suborbital programme — something was out there, and ground-based optics could not resolve it clearly enough. From low orbit, above the distortion of the atmosphere, the Seeker can confirm the presence, position, and rough morphology of objects within the Kerbin system. This is the instrument that will tell us whether Objects A and B are rocks, machines, or something else entirely.

    attachRules = 1,1,0,0,0

    mass             = 0.03
    bulkheadProfiles = srf
    crashTolerance   = 10
    maxTemp          = 1200

    tags = kasa seeker telescope optical survey kop1 science observation

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = kasaOpticalSurvey

        experimentActionName = Conduct Optical Survey
        resetActionName      = Discard Survey Data
        reviewActionName     = Review Survey Data

        useStaging              = False
        useActionGroups         = True
        hideUIwhenUnavailable   = False
        rerunnable              = True
        usageReqMaskExternal    = 8

        xmitDataScalar      = 1.0
        dataIsCollectable   = True
        collectActionName   = Download Survey Data
        interactionRange    = 1.2
    }

    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV     = 15
        MaximumFoV     = 35
        AnomalyDetection = 0
        DISPLAY_MODES
        {
            Mode = Terrain
        }
    }
}
