// ================================================================
// KVS-3 "GAZER" Visual Survey Imager
// ================================================================
// Model and textures from SCANsat by DMagic, Technogeeky, et al.
// Used under BSD 3-Clause License.
// https://github.com/S-C-A-N/SCANsat
//
// All modules converted to stock KSP equivalents.
// No SCANsat dependency required.
// ================================================================
PART
{
    name   = kvs3_gazer
    module = Part
    author = Nertea/SCANsat (model/textures), KASA (cfg)

    MODEL
    {
        model = KASA/Parts/kvs3_gazer/model
        scale = 1.0, 1.0, 1.0
    }

    rescaleFactor = 1.0

    attachRules = 1,1,0,1,1
    node_attach       = 0.0, -0.849, 0, 0.0, -1.0, 0.0, 1
    node_stack_bottom = 0.0, -0.849, 0, 0.0, -1.0, 0.0, 1

    TechRequired = scienceTech
    entryCost    = 25500
    cost         = 18400
    category     = Science
    subcategory  = 0

    title        = KVS-3 "Gazer" Visual Survey Imager
    manufacturer = Kerbal Aeronautics and Space Administration
    description  = The Kerbin Visual Survey Mark Three. A significant step up from the Watcher — the Gazer's higher-resolution optics can resolve surface features at the metre scale from operational altitude, sufficient to locate and characterise surface anomalies before committing a crew to investigate them. It was developed in response to Wernher's suspicion that the monolith network extends beyond Kerbin. If there are structures on the Mun or Minmus waiting to be found, the Gazer is the instrument that will find them before anyone goes looking in person.

    mass             = 0.3
    bulkheadProfiles = size1, srf
    crashTolerance   = 6
    maxTemp          = 1200
    breakingForce    = 50
    breakingTorque   = 50

    tags = kasa gazer visual survey imager kvs3 science mapping observation anomaly

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = kasaVisualSurveyHR

        experimentActionName = Conduct High-Resolution Survey
        resetActionName      = Discard Survey Data
        reviewActionName     = Review Survey Data

        useStaging            = False
        useActionGroups       = True
        hideUIwhenUnavailable = False
        rerunnable            = True
        usageReqMaskExternal  = 8

        xmitDataScalar    = 0.85
        dataIsCollectable = True
        collectActionName = Download Survey Data
        interactionRange  = 1.2
    }

    MODULE
    {
        name = ModuleAnimateGeneric
        animationName     = Deploy
        startEventGUIName = Extend Imager
        endEventGUIName   = Retract Imager
        actionGUIName     = Toggle Imager
    }

    RESOURCE
    {
        name      = ElectricCharge
        amount    = 0
        maxAmount = 0
    }
}
