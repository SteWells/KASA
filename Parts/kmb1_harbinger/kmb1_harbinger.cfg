//
// All modules converted to stock KSP equivalents.
// No DMagicOrbitalScience dependency required.
// ================================================================

PART
{
    name   = kmb1_harbinger
    module = Part
    author = DMagic (model/textures), KASA (cfg)

    MODEL
    {
        model = KASA/Parts/kmb1_harbinger/modelMagBoom
    }

    scale         = 1
    rescaleFactor = 1

    node_stack_bottom = 0.0, -0.195, 0.0, 0.0, -1.0, 0.0, 0
    node_attach       = 0.0, -0.160, 0.0, 0.0, -1.0, 0.0, 0

    TechRequired = spaceExploration
    entryCost    = 3000
    cost         = 1000
    category     = Science
    subcategory  = 0

    title        = KMF-1 "Harbinger" Magnetometer Boom
    manufacturer = Kerbal Aeronautics and Space Administration
    description  = KASA's first magnetic field instrument. The long extendable boom places the sensor array far from the probe body, isolating it from any magnetic interference caused by the spacecraft's own electronics and reaction wheels. The name was chosen before anyone appreciated the implications — early test flights kept returning readings that did not match any natural source in the Kerbin system. The anomalies are faint, consistent, and they track with certain surface sites. Someone on the science team has started calling them signatures. Use in low or high orbit, or on the surface. Not suitable during atmospheric flight.

    attachRules = 1,1,0,0,0

    mass             = 0.015
    bulkheadProfiles = size0, srf
    crashTolerance   = 10
    maxTemp          = 1200
    emissiveConstant = 0.85
    thermalMassModifier = 4.0

    tags = kasa harbinger magnetometer magnetic field boom kmb1 science kmf survey anomaly

    angularDrag   = 1
    dragModelType = default
    maximum_drag  = 0.1
    minimum_drag  = 0.1

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = kasaMagneticSurvey

        experimentActionName = Log Magnetic Field Data
        resetActionName      = Discard Magnetic Data
        reviewActionName     = Review Magnetic Data

        animationName = magBoom
        retractable   = True

        useStaging            = False
        useActionGroups       = True
        hideUIwhenUnavailable = False
        rerunnable            = True

        xmitDataScalar    = 1.0
        dataIsCollectable = True
        collectActionName = Retrieve Magnetic Data
        interactionRange  = 1.2

        usageReqMaskExternal = 8
        externalDeploy       = True

        deploymentAction  = Deploy Magnetometer
        undeployAction    = Retract Magnetometer
        toggleAction      = Toggle Magnetometer
        showEditorEvents  = True
    }

    MODULE
    {
        name                 = ModuleResourceScanner
        MaxAbundanceAltitude = 60000
        RequiresUnlock       = True
        ScannerType          = 0
        ResourceName         = Ore
    }
}
