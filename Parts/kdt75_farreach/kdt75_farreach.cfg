// ================================================================
// KDT-75 "FARREACH" Deep-Space Tracker
// ================================================================
// Model and textures from ResearchBodies by simon56modder / Well.
// Used under Creative Commons Attribution-NonCommercial-ShareAlike 4.0.
// https://github.com/JPLRepo/ResearchBodies
//
// RCS thruster assembly removed — inappropriate for a scientific
// observatory platform. Attitude control via reaction wheels only.
// ResearchBodies (ModuleTrackBodies) required for full functionality.
// ================================================================

PART
{
    name   = kdt75_farreach
    module = Part
    author = simon56modder / Well (model/textures), KASA (cfg)

    MODEL
    {
        model = KASA/Parts/kdt75_farreach/TB-75M
    }

    scale         = 1
    rescaleFactor = 1

    node_stack_bottom = 0.0, -1.371, 0.0, 0.0, -1.0, 0.0, 1

    TechRequired = spaceExploration
    entryCost    = 9530
    cost         = 19500
    category     = Science
    subcategory  = 0

    title        = KDT-75 "Farreach" Deep-Space Tracker
    manufacturer = Kerbal Aeronautics and Space Administration
    description  = The Farreach is KASA's most capable optical instrument — a wide-aperture deep-space tracking telescope capable of resolving objects at distances far beyond the Kerbin system. It is designed for long-duration orbital campaigns: the probe bus includes its own command module, power system, and high-gain antenna, so the platform can operate autonomously for months without intervention from the ground.\n\nThe Farreach was built specifically for the Discovery Programme's final campaign. Mission planning wanted an instrument that could not only characterise the Mun and Minmus in detail, but search for bodies further out — objects in Kerbol orbit, if any exist. Early test data suggests the answer to that question is emphatically yes. There are things out there. The Farreach is how we find them.

    attachRules = 1,0,1,1,0

    mass             = 1.4
    bulkheadProfiles = size1
    crashTolerance   = 2
    maxTemp          = 580
    vesselType       = Probe

    dragModelType = default
    maximum_drag  = 0.3
    minimum_drag  = 0.2
    angularDrag   = 1

    tags = kasa farreach deep space tracker telescope kdt75 discovery science survey

    // Autonomous probe core — no crew required
    MODULE
    {
        name         = ModuleCommand
        minimumCrew  = 0
        hasHibernation = True

        RESOURCE
        {
            name = ElectricCharge
            rate = 0.02
        }
    }

    // Attitude control — reaction wheels only (no RCS on a telescope)
    MODULE
    {
        name         = ModuleSAS
        SASServiceLevel = 2
    }

    MODULE
    {
        name        = ModuleReactionWheel
        PitchTorque = 2
        YawTorque   = 2
        RollTorque  = 2

        RESOURCE
        {
            name = ElectricCharge
            rate = 0.2
        }
    }

    // ResearchBodies tracking module
    // Requires ResearchBodies mod for full function.
    // minAltitude matches the KOP-1 Seeker minimum operational altitude.
    MODULE
    {
        name                 = ModuleTrackBodies
        scienceReward        = 20
        difficulty           = 4
        minAltitude          = 200000
        maxTrackDistance     = 40000000000
        electricChargeRequest = 10
        landed               = false
        viewAngle            = 12
    }

    // High-gain data transmitter for long-range telemetry
    MODULE
    {
        name                 = ModuleDataTransmitter
        antennaType          = INTERNAL
        packetInterval       = 1.0
        packetSize           = 2
        packetResourceCost   = 12.0
        requiredResource     = ElectricCharge
        antennaPower         = 5000
        optimumRange         = 2500
        packetFloor          = 0.1
        packetCeiling        = 5
    }

    RESOURCE
    {
        name      = ElectricCharge
        amount    = 300
        maxAmount = 300
    }
}
