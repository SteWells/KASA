// ================================================================
// KVS-1 "WATCHER" Visual Survey Imager
// ================================================================
// Model and textures from SCANsat by DMagic, Technogeeky, et al.
// Used under BSD 3-Clause License.
// https://github.com/S-C-A-N/SCANsat
//
// All modules converted to stock KSP equivalents.
// No SCANsat dependency required.
// ================================================================
PART
{
    name   = kvs1_watcher
    module = Part
    author = Nertea/SCANsat (model/textures), KASA (cfg)

    MODEL
    {
        model = KASA/Parts/kvs1_watcher/model
        scale = 1.0, 1.0, 1.0
    }

    rescaleFactor = 1.0

    attachRules = 1,1,0,1,1
    node_attach       = 0.0, -0.213, 0, 0.0, -1.0, 0.0, 0
    node_stack_bottom = 0.0, -0.213, 0, 0.0, -1.0, 0.0, 0

    TechRequired = advExploration
    entryCost    = 12500
    cost         = 7500
    category     = Science
    subcategory  = 0

    title        = KVS-1 "Watcher" Visual Survey Imager
    manufacturer = Kerbal Aeronautics and Space Administration
    description  = The Kerbin Visual Survey Mark One. Where the Seeker confirmed that Objects A and B exist, the Watcher begins the serious work of characterising them — building surface maps from orbit, identifying terrain features, locating potential landing zones. Its imaging resolution is modest compared to later instruments, but it operates across a wide altitude range and is reliable enough to fly on any probe with sufficient power. The data it returns will directly inform the landing site selections for the probe missions that follow.

    mass             = 0.05
    bulkheadProfiles = srf, size0
    crashTolerance   = 6
    maxTemp          = 1200
    breakingForce    = 50
    breakingTorque   = 50

    tags = kasa watcher visual survey imager kvs1 science mapping observation

    MODULE
    {
        name = ModuleScienceExperiment
        experimentID = kasaVisualSurvey

        experimentActionName = Conduct Visual Survey
        resetActionName      = Discard Survey Data
        reviewActionName     = Review Survey Data

        useStaging            = False
        useActionGroups       = True
        hideUIwhenUnavailable = False
        rerunnable            = True
        usageReqMaskExternal  = 8

        xmitDataScalar    = 0.85
        dataIsCollectable = True
        collectActionName = Download Survey Data
        interactionRange  = 1.2
    }

    MODULE
    {
        name = ModuleAnimateGeneric
        animationName    = Deploy
        startEventGUIName = Extend Imager
        endEventGUIName   = Retract Imager
        actionGUIName     = Toggle Imager
    }

    RESOURCE
    {
        name      = ElectricCharge
        amount    = 0
        maxAmount = 0
    }
}
