// 1. Wipe out EL's original default recipe and substitute your 70:30 ratio
!EL_DefaultStructureRecipe:NEEDS[Launchpad] {}

EL_DefaultStructureRecipe:NEEDS[Launchpad]
{
    Regocite = 0.7
    Consumables = 0.3
}

// 2. Override how Ablator mass is converted when building a ship
@EL_ResourceRecipe[Ablator]:FOR[KASA]:NEEDS[Launchpad]
{
    -Resources {}
    Resources
    {
        Regocite = 0.7
        Consumables = 0.3
    }
}

// 3. Override how SolidFuel mass is converted when building a ship
@EL_ResourceRecipe[SolidFuel]:FOR[KASA]:NEEDS[Launchpad]
{
    -Resources {}
    Resources
    {
        Regocite = 0.7
        Consumables = 0.3
    }
}

// 4. Update EL's internal transfer calculations to look for your resources
@EL_TransferRecipe[RocketParts]:FOR[KASA]:NEEDS[Launchpad]
{
    -Resources {}
    Resources
    {
        Regocite = 0.7
        Consumables = 0.3
    }
}

// 5. Update the recycling recipe so scrapped ships return your materials
@EL_RecycleRecipe[RocketParts]:FOR[KASA]:NEEDS[Launchpad]
{
    -Resources {}
    Resources
    {
        // Keeps EL's default 20% scrap loss, returning 80% total mass in your 70:30 ratio
        Regocite = 0.56
        Consumables = 0.24
        loss = 0.20
    }
}
