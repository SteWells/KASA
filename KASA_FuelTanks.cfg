// ================================================================
// KASA — CONVERTED FUEL TANK SUBTYPES
// ================================================================
// Adds the three converted KASA fuels as switchable subtypes on
// ordinary liquid-fuel tanks, so a Prismatic Gel transfer stage can
// be built from familiar tanks instead of bolting on an ISRU holding
// tank. (Holding-tank storage lives in KASA_Parts.cfg and stays.)
//
//   Prismatic Gel   <- Glassmonite   (Minmus)  -- HAS engines
//   Dense Oxidiser  <- Kerium        (Ike)     -- no engines yet
//   Thermic Mix     <- Moherium      (Moho)    -- no engines yet
//
// Gating is natural (Option A): the subtype names are visible from the
// start, but the resource does not exist until its source body has been
// resource-scanned and a refinery is running. You cannot fill a tank
// with a resource that has no source.
//
// -------- HOW THIS WORKS -----------------------------------------
// Parts are matched by HAS filter rather than by name, so this covers
// stock, ReStock+, Making History and most modded tanks without a
// hard-coded part list. Two passes:
//   1. LFO tanks (LiquidFuel + Oxidizer)
//   2. LF-only tanks (LiquidFuel, no Oxidizer -- jet/Nerv fuselages)
// Engines, command pods, asteroids/comets and parts that already carry
// a B9 switcher are excluded.
//
// The stock contents are removed and restored as a "Stock" subtype, so
// B9 manages everything (leftover RESOURCE nodes would otherwise stack
// on top of the fuel subtypes).
//
// -------- KNOWN CAVEATS ------------------------------------------
// * MM VARIABLE LESSON (this bit us twice): when INSERTING a new node,
//   MM can only resolve a NODE-PATH variable search, e.g.
//       #$/RESOURCE[LiquidFuel]/maxAmount$      <- works
//   It CANNOT resolve a parent-relative or bare-key reference:
//       #$../kasaTankVolume$   #$/kasaTankVolume$   <- both throw
//       "Cannot parse variable search when inserting new key"
//   So there is NO arithmetic here. baseVolume is taken from the
//   LiquidFuel amount alone, and unitsPerVolume on each tank type is
//   scaled to compensate.
//
// * LFO SCALING. Stock LFO tanks are always 9:11 (LF 0.45 / Ox 0.55),
//   so total units = LiquidFuel x 20/9 = LF x 2.22222.
//     baseVolume = LF maxAmount, then:
//       Stock  -> LiquidFuel 1.0, Oxidizer 1.22222  (= 11/9)
//       fuels  -> unitsPerVolume 2.22222            (= 20/9, full volume)
//   Verify: FL-T400 has LF 180 -> baseVolume 180
//       Stock  = 180 LF + 220 Ox   (correct)
//       Gel    = 400 units         (correct, full tank volume)
//   A few spaceplane parts (Mk2 Rocket Fuel Fuselage, 400/490) are a
//   hair off 9:11; they land within ~1 unit. Harmless.
//
// * This is a broad patch surface. If a modded tank misbehaves, delete
//   this file -- nothing else depends on it.
// * DenseOxidiser and ThermicMix are storage-only for now; no engine
//   burns them yet. They are included so the tanks are ready when the
//   Ike/Moho engine patches land.
// * SUBTYPE name = Stock is the internal ID saved into craft files --
//   do not rename it. The player-facing string is the `title` field.
// ================================================================


// ----------------------------------------------------------------
// Tank types for restoring stock contents under B9 management.
// The three fuel tank types (KASA_PrismaticGel, KASA_DenseOxidiser,
// KASA_ThermicMix) are already defined in KASA_Parts.cfg.
// ----------------------------------------------------------------
// LFO tanks: baseVolume = LiquidFuel amount, so Oxidizer needs 11/9
// and a full-volume fuel needs 20/9.
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_StockLFO
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = LiquidFuel
        unitsPerVolume = 1.0
    }
    RESOURCE
    {
        name           = Oxidizer
        unitsPerVolume = 1.22222
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_StockLF
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = LiquidFuel
        unitsPerVolume = 1
    }
}

// Full-volume (20/9) fuel types, for LFO tanks only.
B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_PrismaticGel_LFO
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = PrismaticGel
        unitsPerVolume = 2.22222
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_DenseOxidiser_LFO
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = DenseOxidiser
        unitsPerVolume = 2.22222
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_Aetherium
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = Aetherium
        unitsPerVolume = 1
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_Aetherium_LFO
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = Aetherium
        unitsPerVolume = 2.22222
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch]
{
    name     = KASA_ThermicMix_LFO
    tankMass = 0
    tankCost = 0
    RESOURCE
    {
        name           = ThermicMix
        unitsPerVolume = 2.22222
    }
}


// ----------------------------------------------------------------
// PASS 1 — LFO tanks (LiquidFuel + Oxidizer)
// baseVolume = LiquidFuel maxAmount + Oxidizer maxAmount, computed via
// a temporary part-level key so it scales with every tank size.
// ----------------------------------------------------------------
@PART[*]:HAS[@RESOURCE[LiquidFuel],@RESOURCE[Oxidizer],!MODULE[ModuleEngines],!MODULE[ModuleEnginesFX],!MODULE[ModuleB9PartSwitch],!MODULE[ModuleCommand],!MODULE[ModuleAsteroid],!MODULE[ModuleComet]]:NEEDS[B9PartSwitch]:AFTER[KASA]
{
    MODULE
    {
        name                = ModuleB9PartSwitch
        moduleID            = kasaFuel
        switcherDescription = Propellant
        baseVolume          = #$/RESOURCE[LiquidFuel]/maxAmount$

        SUBTYPE
        {
            name     = Stock
            title    = Liquid Fuel / Oxidizer
            tankType = KASA_StockLFO
            defaultSubtypePriority = 10
        }
        SUBTYPE
        {
            name     = Prismatic Gel
            tankType = KASA_PrismaticGel_LFO
        }
        SUBTYPE
        {
            name     = Dense Oxidiser
            tankType = KASA_DenseOxidiser_LFO
        }
        SUBTYPE
        {
            name     = Thermic Mix
            tankType = KASA_ThermicMix_LFO
        }
        SUBTYPE
        {
            name     = Aetherium
            tankType = KASA_Aetherium_LFO
        }
    }

    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Oxidizer] {}
}


// ----------------------------------------------------------------
// PASS 2 — LF-only tanks (jet / Nerv fuselages)
// ----------------------------------------------------------------
@PART[*]:HAS[@RESOURCE[LiquidFuel],!RESOURCE[Oxidizer],!MODULE[ModuleEngines],!MODULE[ModuleEnginesFX],!MODULE[ModuleB9PartSwitch],!MODULE[ModuleCommand],!MODULE[ModuleAsteroid],!MODULE[ModuleComet]]:NEEDS[B9PartSwitch]:AFTER[KASA]
{
    MODULE
    {
        name                = ModuleB9PartSwitch
        moduleID            = kasaFuel
        switcherDescription = Propellant
        baseVolume          = #$/RESOURCE[LiquidFuel]/maxAmount$

        SUBTYPE
        {
            name     = Stock
            title    = Liquid Fuel
            tankType = KASA_StockLF
            defaultSubtypePriority = 10
        }
        SUBTYPE
        {
            name     = Prismatic Gel
            tankType = KASA_PrismaticGel
        }
        SUBTYPE
        {
            name     = Dense Oxidiser
            tankType = KASA_DenseOxidiser
        }
        SUBTYPE
        {
            name     = Thermic Mix
            tankType = KASA_ThermicMix
        }
        SUBTYPE
        {
            name     = Aetherium
            tankType = KASA_Aetherium
        }
    }

    !RESOURCE[LiquidFuel] {}
}
