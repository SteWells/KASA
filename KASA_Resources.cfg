// ================================================================
// KASA — CUSTOM RESOURCE DEFINITIONS
// ================================================================
// These resources are unique to the KASA mod. They do not replace
// CommunityResourcePack (CRP) — if CRP is installed, standard
// resources (Ore, LqdHydrogen, etc.) work alongside these.
//
// Discovery gate: each resource is only visible in the tracking
// station and available for contracts AFTER the body has reached
// discovery stage 3 (surface scan complete) AND a resource scan
// contract has been completed for that body.
//
// Resource lifecycle:
//   Stage 3 scan + resource scanner → resource detected
//   Sample return contract           → physical sample to Kerbin
//   Analysis contract (auto-offered) → Wernher's verdict
//   If useful → mining base contract unlocks
//   Mining base → repeating ship-to-Kerbin or Convert-O-Tron loop
//
// Resources marked "sample_only = true" cannot be mined at scale
// — they break down outside their native environment and must be
// studied in-situ. These still generate contracts but not bases.
// ================================================================

// ----------------------------------------------------------------
// MUN — REGOCITE
// Compacted regolith with unusual structural properties.
// Useful as a construction aggregate in-situ on the Mun.
// Processing: Regocite → Ore (equivalent) via Convert-O-Tron
// (allows existing ISRU chains to work with Mun base builds)
// ----------------------------------------------------------------
RESOURCE_DEFINITION
{
    name         = Regocite
    displayName  = Regocite
    abbreviation = Rgc

    density      = 0.0025
    unitCost     = 0.8
    hsp          = 1

    flowMode     = ALL_VESSEL
    transfer     = PUMP
    isTweakable  = true
    isVisible    = true

    color        = 0.72, 0.68, 0.60, 1.0

    KASA_RESOURCE
    {
        body        = Mun
        useful      = true
        sample_only = false
        flavour     = Compacted regolith with unusually high structural density. Analysis suggests it would make an effective construction aggregate for in-situ base fabrication, dramatically reducing the mass that needs to be launched from Kerbin.
    }
}

