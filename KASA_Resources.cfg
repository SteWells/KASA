// ================================================================
// CONVERT-O-TRON RECIPES
// ================================================================
// Patch the stock ISRU Convert-O-Tron 250 to include recipes for
// our custom special fuels. These require the source resource to
// be present onboard — meaning the vessel must either have mined
// it locally or transported it from a mining operation.
// ================================================================

// ModuleManager patches to add Convert-O-Tron recipes
// Applied to the 250 and 125 Convert-O-Trons

@PART[ISRU|MiniISRU]:AFTER[KASA]
{
    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Glassmonite → Prismatic Gel
        StartActionName = Start Glassmonite Processing
        StopActionName  = Stop Glassmonite Processing
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 30

        INPUT_RESOURCE
        {
            ResourceName = Glassmonite
            Ratio        = 0.5
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 15
        }
        OUTPUT_RESOURCE
        {
            ResourceName = PrismaticGel
            Ratio        = 0.2
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }

    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Kerium → Heavy Blend
        StartActionName = Start Kerium Processing
        StopActionName  = Stop Kerium Processing
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 40

        INPUT_RESOURCE
        {
            ResourceName = Kerium
            Ratio        = 0.4
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 20
        }
        OUTPUT_RESOURCE
        {
            ResourceName = HeavyBlend
            Ratio        = 0.25
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }

    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Moherium + LiquidFuel → Thermic Mix
        StartActionName = Start Moherium Processing
        StopActionName  = Stop Moherium Processing
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 60

        INPUT_RESOURCE
        {
            ResourceName = Moherium
            Ratio        = 0.3
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = LiquidFuel
            Ratio        = 0.2
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 25
        }
        OUTPUT_RESOURCE
        {
            ResourceName = ThermicMix
            Ratio        = 0.18
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }
    // ----------------------------------------------------------------
    // OUTER PLANET RECIPES
    // ----------------------------------------------------------------

    // DUNA — Ferrosite smelts into structural feedstock (Regocite), so
    // ships can be built at Duna without hauling Regocite from the Mun.
    // NOTE (design): this deliberately does NOT touch EL's structure
    // recipe. EL's structural resource is DLL-level and adding a second
    // EL_ResourceRecipe double-charges (see KNOWN_BUGS). Producing
    // Regocite locally is the safe way to make Duna a forward shipyard.
    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Ferrosite → Structural Feedstock
        StartActionName = Start Ferrosite Smelting
        StopActionName  = Stop Ferrosite Smelting
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 50

        INPUT_RESOURCE
        {
            ResourceName = Ferrosite
            Ratio        = 0.5
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 25
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Regocite
            Ratio        = 0.45
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }

    // LAYTHE — Laythite yields Consumables. This is the one recipe that
    // cuts the tether to Kerbin: Consumables are otherwise bought at
    // home and shipped out, and they are half of the EL build recipe.
    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Laythite → Consumables
        StartActionName = Start Laythite Processing
        StopActionName  = Stop Laythite Processing
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 20

        INPUT_RESOURCE
        {
            ResourceName = Laythite
            Ratio        = 0.6
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 18
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Consumables
            Ratio        = 0.3
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }

    // EELOO — Elysium refines into Aetherium, the endgame propellant.
    // The reward for the longest journey in the game.
    MODULE
    {
        name            = ModuleResourceConverter
        ConverterName   = Elysium → Aetherium
        StartActionName = Start Elysium Refining
        StopActionName  = Stop Elysium Refining
        AutoShutdown    = false
        GeneratesHeat   = true
        TemperatureModifier = 35

        INPUT_RESOURCE
        {
            ResourceName = Elysium
            Ratio        = 0.4
            FlowMode     = STAGE_PRIORITY_FLOW
        }
        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio        = 30
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Aetherium
            Ratio        = 0.2
            DumpExcess   = false
            FlowMode     = STAGE_PRIORITY_FLOW
        }
    }

}


// ================================================================
// PLANETARY RESOURCE DISTRIBUTION
// ================================================================
// Each custom resource has a near-zero global baseline with high
// concentrations in specific biomes, producing meaningful heat
// maps rather than a uniform wash.
//
// SCANsat displays these automatically on its resource overlay
// once the player has passed a resource scanner over the area.
// No additional config needed — SCANsat reads PLANETARY_RESOURCE
// nodes for any resource registered in the game.
//
// Abundance values: 0.0 = none, 1.0 = maximum (100%)
// The stock ore system uses 0.05–0.15 as "good deposit" range.
// Our custom resources use similar ranges for consistency.
// ================================================================

// ----------------------------------------------------------------
// MUN — REGOCITE
// Compacted regolith. Common in low, flat terrain.
// Abundant in Midlands and Lowlands, sparse elsewhere.
// ----------------------------------------------------------------
PLANETARY_RESOURCE
{
    ResourceName = Regocite
    ResourceType = 0
    PlanetName   = Mun
    Distribution
    {
        PresenceChance = 100
        MinAbundance   = 0.33
        MaxAbundance   = 0.99
        Variance       = 3.0
        MinAltitude    = -500
        MaxAltitude    = 10000
        InnerDepth     = 0
        OuterDepth     = 1000
    }
}
BIOME_RESOURCE
{
    ResourceName = Regocite
    ResourceType = 0
    PlanetName   = Mun
    BiomeName        = Midlands
    Distribution
    {
        PresenceChance = 100
        MinAbundance   = 13.3
        MaxAbundance   = 17.26
        Variance       = 2.0
    }
}
BIOME_RESOURCE
{
    ResourceName = Regocite
    ResourceType = 0
    PlanetName   = Mun
    BiomeName        = Lowlands
    Distribution
    {
        PresenceChance = 100
        MinAbundance   = 4.64
        MaxAbundance   = 10.94
        Variance       = 2.0
    }
