// ================================================================
// KASA — LOGISTICS MODULE PATCHES
// ================================================================
// Adds the two logistics PartModules (see KASALogistics.cs).
//
// Targeting is by MODULE rather than by part name, following the kOS
// pattern. This means modded command parts and probe cores pick the
// capability up automatically, with no part list to maintain.
//
// TO EXTEND: just widen the HAS filters below. Nothing else changes.
//
// There is NO DEPOT. Hubs within 1 km of each other pool their real tanks.
// KSC is a hub too: infinite storage, backed by funds.
// ================================================================


// ----------------------------------------------------------------
// HUB — the graph's nodes. Marker only; every control lives in the
// toolbar window (KASALogisticsUI).
//
// The marker rides on every command part, so ANY vessel is a hub
// CANDIDATE — including a drill-only base with no ISRU. Registration
// (done in the window; stored in KASALogisticsScenario.RegisteredHubs)
// decides which candidates actually act as hubs. This is why the marker
// no longer keys off ISRUs and labs.
//
// A registered hub must still be CREWED to take part in any transfer.
// Both ends. Someone has to connect the hoses; we simply do not want to
// micromanage it. The hauler itself may be uncrewed.
// ----------------------------------------------------------------
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[KASALogisticsHub]]:FOR[KASA]
{
    MODULE
    {
        name = KASALogisticsHub
    }
}


// ----------------------------------------------------------------
// TUG — anything that can fly a route.
// Every command part, per the kOS pattern.
// ----------------------------------------------------------------
@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[KASALogisticsTug]]:FOR[KASA]
{
    MODULE
    {
        name = KASALogisticsTug
    }
}
