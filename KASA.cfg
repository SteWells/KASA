// ================================================================
// KASA — KERBIN AERONAUTICS AND SPACE ADMINISTRATION
// Main Contract Group
// ================================================================
// A narrative career-overhaul contract pack for KSP 1.12.4.
//
// REQUIRES: Contract Configurator 1.15.0+, Module Manager,
//           KASA.dll (the KASA plugin — discovery/resource behaviours)
// INTEGRATES WITH (optional, patched via :NEEDS): SCANsat,
//           ResearchBodies/PCBM, Parallax Continued, B9PartSwitch,
//           Extraplanetary Launchpads, ReStock+, ProbesBeforeCrew
// NOTE: SCANsat is effectively required — survey contracts use
//       SCANsatCoverage parameters.
//
// Design philosophy:
//   - Probes before crew: every destination gets an uncrewed probe first
//   - Consolidated contracts: one contract shows the full objective set
//     (flyby/orbit/landing are steps, not separate contracts)
//   - Payouts use a 20% advance / 60% per-step / 20% bonus split
//   - All values rounded to the nearest 5,000 funds
//   - Step payouts are weighted by difficulty and risk
//   - Avoid forcing long time-warp periods
//
// Discovery model (see KASADiscovery.cs):
//   Bodies are masked in seven stages (0 hidden -> 6 full detail).
//   Detection is split by physics:
//     * Sentinel (transit photometry) -> can ONLY see bodies INTERIOR
//       to Kerbin's orbit. Reveals Moho and Eve. (DP-03)
//     * Outer survey (direct imaging, Gazer relocated beyond Kerbin)
//       -> reveals bodies EXTERIOR to Kerbin. (DP-04)
//   Moons are revealed on entering their parent's SOI.
//   A body's name resolves at stage 4; resource reveals fire at 80%
//   resource-scan coverage (KASAResourceScanned behaviour).
//
// Contract files. Filename number == the group's sortKey (the order
// programmes appear in Mission Control). Groups are many-to-one with
// files, so the three anomaly files share sortKey 10 and are
// distinguished by letter.
//
//   01_TheFirstFlights          atmospheric -> crewed orbit
//   02_TheDiscoveryProgram      Gazer, Sentinel, outer survey
//   03_TheKerbinScanProgram     altimetry, resources, biomes
//   04_TheKerbinSystemProgram   Mun + Minmus, probe + crewed
//   05_TheInnerPlanetsProgram   Moho (full arc), Eve (orbit only)
//   06                          RESERVED — outer planet economy arcs
//   07_TheStationsProgram       Kerbin, Mun construction platform
//   08_TheBasesProgram          surface bases
//   10a_TheKerbinAnomalies      TMA-0 network, island airfield
//   10b_TheMunMinmusAnomalies   memorial, monoliths, arches, UFO
//   10c_TheConvergence          outer bearings -> the wreck on Bop
//   90_TheTourismProgram        passenger flights, sightseeing
//
// All three 10x files share the TheAnomalyProgram group (sortKey 10).
// (sortKey 09 / TheISRUProgram removed — ISRU folded into the Bases Programme.)
//
// The outer-planet arcs (Duna+Ike, Dres, Jool system, Eeloo) live in
// 06_TheOuterPlanetsProgram.cfg, OP-01 to OP-18. The Convergence (10c)
// deliberately does NOT depend on them: the monolith trail can be
// followed to Bop without running any outer resource survey.
// ================================================================
CONTRACT_GROUP
{
    name           = KASA
    displayName    = Kerbal Aeronautics and Space Administration
    agent          = KASA
    minVersion     = 1.15.0
    maxCompletions = 0

    disabledContractType = ARMContract
    disabledContractType = BaseConstruction
    disabledContractType = BaseContract
    disabledContractType = CollectScience
    disabledContractType = CometDetectionContract
    disabledContractType = CometSampleContract
    disabledContractType = DeployedScienceContract
    disabledContractType = DMAnomalyContract
    disabledContractType = DMAsteroidSurveyContract
    disabledContractType = DMMagneticSurveyContract
    disabledContractType = DMReconContract
    disabledContractType = DMSurveyContract
    disabledContractType = ExplorationContract
    disabledContractType = GrandTour
    disabledContractType = ISRUContract
    disabledContractType = OrbitalConstruction
    disabledContractType = OrbitalConstructionContract
    disabledContractType = PartTest
    disabledContractType = PlantFlag
    disabledContractType = RecoverAsset
    disabledContractType = ROCScienceArmContract
    disabledContractType = ROCScienceRetrievalContract
    disabledContractType = RoverConstruction
    disabledContractType = RoverConstructionContract
    disabledContractType = SatelliteContract
    disabledContractType = SentinelContract
    disabledContractType = StationContract
    disabledContractType = SurveyContract
    disabledContractType = TourismContract
    disabledContractType = VesselRepair
    disabledContractType = VesselRepairContract
    disabledContractType = WorldFirstContract
    disabledContractType = ExploreBody

    // ----------------------------------------------------------------
    // REWARD MODEL (reference — contracts compute contractTotal inline)
    // ----------------------------------------------------------------
    //     contractTotal = Round(Round(HomeWorld().Radius() / <divisor>)
    //                           * 5000 * <multiplier> / 5000) * 5000
    //
    // The DIVISOR encodes MISSION TYPE:
    //   / 60000   early Kerbin-only milestones, anomalies
    //   / 40000   uncrewed probe + survey missions
    //   / 20000   crewed missions
    //   / 15000   orbital stations
    //   / 12000   surface bases
    //
    // The MULTIPLIER encodes DESTINATION difficulty (dv from LKO + trip
    // time + landing risk), anchored on the playtested Mun probe x3.0:
    //   Mun 3.0  Minmus 4.0                        (file 04)
    //   Eve 6.0  Moho 9.0                          (file 05)
    //   Duna/Ike 5.0  Dres 7.0  Jool 9.0           (file 06)
    //   Laythe 10.0  Vall 10.5  Tylo 12.0  Eeloo 12.0
    // Anomaly and deploy contracts carry their own multipliers, flagged
    // in their own files. All values are pre-playtest beyond the Mun.
    //
    // Reward split per contract:
    //   advanceFunds  = 20%  paid on contract acceptance
    //   step rewards  = 60%  paid as each parameter completes
    //   rewardFunds   = 20%  completion bonus when all steps done
    // Step rewards are weighted by difficulty; weights are listed at
    // the top of each contract.
    // ----------------------------------------------------------------


    // ----------------------------------------------------------------
    // CONTRACT SUB-GROUPS
    // ----------------------------------------------------------------

    CONTRACT_GROUP
    {
        name           = TheFirstFlights
