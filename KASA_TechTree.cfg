// ================================================================
// KASA — Tech Tree Patch
// ================================================================
// REQUIRES: CommunityTechTree + Zee's ProbesBeforeCrew mod
// All patches run AFTER ProbesBeforeCrew to override its settings.
//
// Changes made on top of ProbesBeforeCrew:
//
//   parachuteSingle → start
//     FF-01 requires safe vessel recovery. The player must have
//     a parachute available from the very first launch.
//
//   sensorGravimeter → start
//     FF-02 requires a GRAVMAX. Moving it to start ensures it
//     is available before the player has earned any science points.
//     (PBC puts it at electronics, cost 160 — far too late.)
// ================================================================

@PART[parachuteSingle]:NEEDS[CommunityTechTree]:AFTER[ProbesBeforeCrew]
{
    @TechRequired = start
}

@PART[sensorGravimeter]:NEEDS[CommunityTechTree]:AFTER[ProbesBeforeCrew]
{
    @TechRequired = start
}

